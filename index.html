<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>巴士路線與車站選單連動（顯示終點站）</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 100px; font-weight: bold; }
        select, input { padding: 8px; width: 300px; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>巴士路線與車站查詢選單</h2>

    <!-- 第一步：輸入路線 -->
    <div class="form-group">
        <label for="routeInput">巴士路線：</label>
        <input type="text" id="routeInput" placeholder="例如: 1A, 60X" value="1A">
        <button onclick="loadRouteDetails()">搜尋路線</button>
    </div>

    <!-- 第二步：選擇方向（顯示終點站） -->
    <div class="form-group">
        <label for="boundSelect">方向：</label>
        <select id="boundSelect" onchange="updateStopDropdown()" disabled>
            <option value="">-- 請先輸入路線 --</option>
        </select>
    </div>

    <!-- 第三步：車站位置選單 -->
    <div class="form-group">
        <label for="stopSelect">車站位置：</label>
        <select id="stopSelect" disabled>
            <option value="">-- 請先選擇方向 --</option>
        </select>
    </div>

    <script>
        const stopNameCache = {};

        // 1. 取得路線詳細資訊（包含去程/回程終點站）
        async function loadRouteDetails() {
            const route = document.getElementById('routeInput').value.trim().toUpperCase();
            if (!route) return alert("請輸入路線號碼！");

            const boundSelect = document.getElementById('boundSelect');
            const stopSelect = document.getElementById('stopSelect');
            
            boundSelect.innerHTML = '<option value="">載入方向中...</option>';
            boundSelect.disabled = true;
            stopSelect.innerHTML = '<option value="">-- 請先選擇方向 --</option>';
            stopSelect.disabled = true;

            try {
                // 呼叫 Route API 取得該路線的方向與終點站資訊
                const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${route}`);
                const result = await response.json();

                if (!result.data || result.data.length === 0) {
                    boundSelect.innerHTML = '<option value="">找不到此路線</option>';
                    return;
                }

                boundSelect.innerHTML = '<option value="">-- 請選擇方向 --</option>';

                // 將取得的方向資料填入選單，選項顯示「往 [終點站]」
                result.data.forEach(item => {
                    const option = document.createElement('option');
                    // bound 可能是 "O" (Outbound) 或 "I" (Inbound)
                    const boundValue = (item.bound === 'O') ? 'outbound' : 'inbound';
                    
                    option.value = boundValue;
                    option.textContent = `往：${item.dest_tc} (經 ${item.orig_tc} 開出)`;
                    boundSelect.appendChild(option);
                });

                boundSelect.disabled = false;
            } catch (error) {
                console.error("載入路線方向失敗：", error);
                boundSelect.innerHTML = '<option value="">載入失敗</option>';
            }
        }

        // 2. 根據選定的方向，載入該方向的車站列表
        async function updateStopDropdown() {
            const route = document.getElementById('routeInput').value.trim().toUpperCase();
            const bound = document.getElementById('boundSelect').value;
            const stopSelect = document.getElementById('stopSelect');

            if (!bound) {
                stopSelect.innerHTML = '<option value="">-- 請先選擇方向 --</option>';
                stopSelect.disabled = true;
                return;
            }

            stopSelect.innerHTML = '<option value="">載入車站中...</option>';
            stopSelect.disabled = true;

            try {
                // 呼叫 Route-Stop API 取得車站清單
                const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${bound}/1`);
                const result = await response.json();

                if (!result.data || result.data.length === 0) {
                    stopSelect.innerHTML = '<option value="">未找到車站資料</option>';
                    return;
                }

                stopSelect.innerHTML = '<option value="">-- 請選擇車站 --</option>';

                // 逐一讀取車站名稱並建立選項
                for (let i = 0; i < result.data.length; i++) {
                    const stopData = result.data[i];
                    const stopId = stopData.stop;
                    const stopName = await getStopName(stopId);
                    
                    const option = document.createElement('option');
                    option.value = stopId;
                    option.textContent = `${stopData.seq}. ${stopName}`;
                    stopSelect.appendChild(option);
                }

                stopSelect.disabled = false;
            } catch (error) {
                console.error("載入車站失敗：", error);
                stopSelect.innerHTML = '<option value="">載入車站失敗</option>';
            }
        }

        // 取得車站名稱細節 API
        async function getStopName(stopId) {
            if (stopNameCache[stopId]) {
                return stopNameCache[stopId];
            }
            try {
                const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`);
                const data = await res.json();
                const name = data.data.name_tc;
                stopNameCache[stopId] = name;
                return name;
            } catch (e) {
                return "未知車站";
            }
        }
    </script>
</body>
</html>
