    function planUseMyLocationFor(which) {
      if (!navigator.geolocation) {
        alert('此裝置不支援定位');
        return;
      }
      const inputId = which === 'to' ? 'planToInput' : 'planFromInput';
      document.getElementById(inputId).value = '定位中…';
      navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        try {
          const { stopList } = await ensureStopIndex();
          let best = null, bestD = Infinity;
          for (const [id, info] of Object.entries(stopList)) {
            const loc = info.location || {};
            const slat = parseFloat(loc.lat), slng = parseFloat(loc.lng);
            if (isNaN(slat)) continue;
            const d = haversineM(lat, lng, slat, slng);
            if (d < bestD) {
              bestD = d;
              best = {
                kind: 'stop', id, label: '巴士站',
                name: (info.name && (info.name.zh || info.name.en)) || id,
                lat: slat, lng: slng
              };
            }
          }
          if (!best) {
            best = { kind: 'place', id: 'gps', name: '我的位置', lat, lng, label: '定位' };
          } else if (bestD < 1000) {
            best.name = best.name + '（約 ' + Math.round(bestD) + ' 米）';
          }
          if (which === 'to') {
            _planTo = best;
            document.getElementById('planToInput').value = best.name;
            document.getElementById('planToClear').style.display = '';
          } else {
            _planFrom = best;
            document.getElementById('planFromInput').value = best.name;
            document.getElementById('planFromClear').style.display = '';
          }
        } catch (e) {
          document.getElementById(inputId).value = '';
          alert('定位失敗');
        }
      }, () => {
        document.getElementById(inputId).value = '';
        alert('定位失敗，請允許位置權限');
      }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
    }

    /** 用目前定位填起點（若尚未設定） */
    async function planPrefillFromUserLocation() {
      if (_planFrom) return;
      if (state.userLat == null || state.userLng == null) return;
      const lat = state.userLat, lng = state.userLng;
      try {
        const { stopList } = await ensureStopIndex();
        let best = null, bestD = Infinity;
        for (const [id, info] of Object.entries(stopList)) {
          const loc = info.location || {};
          const slat = parseFloat(loc.lat), slng = parseFloat(loc.lng);
          if (isNaN(slat)) continue;
          const d = haversineM(lat, lng, slat, slng);
          if (d < bestD) {
            bestD = d;
            best = {
              kind: 'stop',
              id: String(id),
              name: (info.name && (info.name.zh || info.name.en)) || id,
              lat: slat, lng: slng,
              label: '現在位置附近'
            };
          }
        }
        // 起點用真實 GPS 座標，搜尋時以座標匹配附近站，避免「上車站離定位很遠」
        _planFrom = {
          kind: 'place',
          id: 'gps',
          name: best && bestD < 600
            ? ('我的位置（近' + best.name + '）')
            : '我的位置',
          lat, lng,
          label: '定位'
        };
        const fi = document.getElementById('planFromInput');
        if (fi) fi.value = _planFrom.name;
        const c = document.getElementById('planFromClear');
        if (c) c.style.display = '';
      } catch (e) {
        _planFrom = { kind: 'place', id: 'gps', name: '我的位置', lat, lng, label: '定位' };
        const fi = document.getElementById('planFromInput');
        if (fi) fi.value = '我的位置';
      }
    }

        return { kind: 'place', id: 'hard:' + n, name: n, lat, lng, label: '地點' };

            best = { kind: 'place', id: 'hard:' + k, name: n, lat: v[0], lng: v[1], label: '地點' };

    function bindPlanPickSuggest() {
      const pickInput = document.getElementById('planPickInput');
      if (!pickInput) return;
      if (pickInput._suggestBound) return;
      pickInput._suggestBound = true;

      const runSuggest = () => {
        const q = pickInput.value.trim();
        const list = document.getElementById('planPickList');
        const mapWrap = document.getElementById('planPickMapWrap');
        if (mapWrap) mapWrap.style.display = 'none';
        if (list) list.style.display = 'block';
        if (!q) {
          clearTimeout(_planSuggestTLocal);
          clearTimeout(_planSuggestTRemote);
          renderPlanRegionList();
          return;
        }
        if (list) {
          list.innerHTML = '<div class="plan-pick-sec">聯想結果</div>' +
            '<div class="plan-pick-item">搜尋「' + q.replace(/[<>&]/g, '') + '」中…</div>';
        }
        const gen = ++_planSuggestGen;
        clearTimeout(_planSuggestTLocal);
        _planSuggestTLocal = setTimeout(async () => {
          if (gen !== _planSuggestGen) return;
          try {
            const regions = planSearchRegionPlaces(q, 12);
            // 分區地名可先顯示（不需網絡）
            if (regions.length) planRenderSuggestList(regions, q, '搜尋中…');
            await ensureStopIndex();
            if (gen !== _planSuggestGen) return;
            const stops = await planSearchLocalStops(q, 20);
            const hits = [];
            const seen = new Set();
            for (const s of regions.concat(stops)) {
              const key = (s.name || '') + '|' + (s.kind || '');
              if (seen.has(key)) continue;
              seen.add(key);
              hits.push(s);
            }
            planRenderSuggestList(hits, q, '搜尋地點中…');
          } catch (e) {
            console.warn('suggest local', e);
            if (gen === _planSuggestGen) {
              planRenderSuggestList(planSearchRegionPlaces(q, 12), q, '載入站點失敗');
            }
          }
        }, 30);
        clearTimeout(_planSuggestTRemote);
        _planSuggestTRemote = setTimeout(async () => {
          if (gen !== _planSuggestGen) return;
          try {
            const regions = planSearchRegionPlaces(q, 12);
            let stops = [];
            try { stops = await planSearchLocalStops(q, 20); } catch (_) {}
            let places = [];
            try { places = await planSearchPhoton(q, 10); } catch (_) {}
            if (gen !== _planSuggestGen) return;
            const hits = [];
            const seen = new Set();
            for (const s of places.concat(regions).concat(stops)) {
              const key = (s.name || '') + '|' + (s.lat != null ? Number(s.lat).toFixed(4) : s.kind);
              if (seen.has(key)) continue;
              seen.add(key);
              hits.push(s);
            }
            planRenderSuggestList(hits, q, '無結果，可試地圖選點');
          } catch (e) { console.warn('suggest remote', e); }
        }, 150);
      };

      pickInput.addEventListener('input', runSuggest);
      pickInput.addEventListener('compositionend', runSuggest);
      pickInput.addEventListener('search', runSuggest);
      pickInput.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') runSuggest();
      });
      // 貼上
      pickInput.addEventListener('paste', () => setTimeout(runSuggest, 0));
    }

    function bindPlanPickList() {
      const list = document.getElementById('planPickList');
      list.querySelectorAll('.plan-pick-item').forEach(el => {
        el.onclick = async () => {
          const act = el.dataset.act;
          if (act === 'region') renderPlanDistricts(el.dataset.region);
          else if (act === 'district') renderPlanPlaces(el.dataset.region, el.dataset.dist);
          else if (act === 'back') renderPlanRegionList();
          else if (act === 'back-dist') renderPlanDistricts(el.dataset.region);
          else if (act === 'myloc') {
            planUseMyLocation();
            closePlanPlacePicker();
          } else if (act === 'map') {
            openPlanMapPick(22.3193, 114.1694, '地圖選點');
          } else if (act === 'place') {
            await planResolvePlaceName(el.dataset.name);
          } else if (act === 'hit') {
            const hits = list._hits || [];
            const s = hits[Number(el.dataset.i)];
            if (!s) return;
            if (s._needResolve || s.lat == null || s.lng == null) {
              list.innerHTML = '<div class="plan-pick-item">定位「' + s.name + '」中…</div>';
              const hard = planLookupHardCoords(s.name);
              if (hard) { applyPlanPick(hard); return; }
              const places = await planSearchPhoton(s.name, 5);
              const stops = await planSearchLocalStops(s.name, 5);
              const resolved = places[0] || stops[0];
              if (resolved) {
                resolved.name = s.name || resolved.name;
                applyPlanPick(resolved);
              } else {
                openPlanMapPick(22.3193, 114.1694, s.name);
              }
              return;
            }
            applyPlanPick(s);
          }
        };
      });
    }

    async function planResolvePlaceName(name) {
      const list = document.getElementById('planPickList');
      list.innerHTML = '<div class="plan-pick-item">搜尋「' + name + '」中…</div>';
      const hard = planLookupHardCoords(name);
      if (hard) {
        applyPlanPick(hard);
        return;
      }
      const [stops, places] = await Promise.all([
        planSearchLocalStops(name, 8),
        planSearchPhoton(name, 6)
      ]);
      const hits = [];
      const seen = new Set();
      for (const s of places.concat(stops)) {
        const key = s.name + '|' + (s.lat && s.lat.toFixed(4));
        if (seen.has(key)) continue;
        seen.add(key);
        hits.push(s);
      }
      if (!hits.length) {
        // 仍可用 photon 第一結果的近似：開地圖
        list.innerHTML = '<div class="plan-pick-item">找不到，請試地圖選點</div>' +
          '<div class="plan-pick-item" data-act="map" data-name="' + name + '"><span>地圖選點</span><span class="chev">›</span></div>';
        bindPlanPickList();
        return;
      }
      // 多於一個：列出；一個：直接用地圖確認
      if (hits.length === 1) {
        openPlanMapPick(hits[0].lat, hits[0].lng, hits[0].name, hits[0]);
        return;
      }
      list._hits = hits;
      list.innerHTML = '<div class="plan-pick-sec">選擇「' + name + '」位置</div>' +
        hits.map((s, i) =>
          `<div class="plan-pick-item" data-act="hit" data-i="${i}"><span>${s.name}</span><small style="color:#8e8e93">${s.label || ''}</small></div>`
        ).join('');
      bindPlanPickList();
    }

    async function confirmPlanMapPick() {
      try {
        const btn = document.getElementById('planPickMapConfirm');
        if (btn) { btn.disabled = true; btn.textContent = '確認中…'; }

        if (_planPickMarker && typeof _planPickMarker.getLatLng === 'function') {

        if (lat == null || isNaN(lat) || isNaN(lng)) {

        let name = info.name;
        if (!name || /地圖選點|所選位置|移動地圖/.test(name)) {
          if (info.stopName && info.stopDist < 900) {
            name = info.stopDist < 350 ? info.stopName : ('近' + info.stopName);

    let _planRevGeoTimer = null;

    async function planReverseGeocode(lat, lng) {
      try {
        const url = 'https://photon.komoot.io/reverse?lon=' + encodeURIComponent(lng) +
          '&lat=' + encodeURIComponent(lat) + '&lang=zh';
        const res = await fetch(url);
        if (!res.ok) return null;
        const json = await res.json();
        const f = (json.features || [])[0];
        if (!f) return null;
        const p = f.properties || {};
        const parts = [p.name, p.street, p.district, p.city, p.county].filter(Boolean);
        const uniq = [];
        parts.forEach(x => { if (x && !uniq.includes(x)) uniq.push(x); });
        const name = uniq.slice(0, 3).join('，') || null;
        return name ? { name, label: p.type || p.osm_value || '地點' } : null;
      } catch (e) {
        console.warn('reverse geo', e);
        return null;
      }
    }

    async function planUpdateMapPlaceName(lat, lng, fallbackName) {
      const el = document.getElementById('planMapPlaceName');
      if (el) el.innerHTML = '查詢地點名稱中…';
      const generic = !fallbackName || /地圖選點|所選位置|移動地圖|地圖自由|查詢地點/.test(fallbackName);

      // 1) 最近巴士站（本地，最可靠）
      let bestStop = null, bestD = Infinity;
      try {
        const { stopList } = await ensureStopIndex();
        for (const [id, info] of Object.entries(stopList)) {
          const loc = info.location || {};
          const slat = parseFloat(loc.lat), slng = parseFloat(loc.lng);
          if (isNaN(slat)) continue;
          const d = haversineM(lat, lng, slat, slng);
          if (d < bestD) {
            bestD = d;
            bestStop = (info.name && (info.name.zh || info.name.en)) || id;
          }
        }
      } catch (_) {}

      // 2) Photon 反查（可能因網絡／CORS 失敗）
      let rev = null;
      try { rev = await planReverseGeocode(lat, lng); } catch (_) {}

      let name = null;
      let label = '地圖';
      if (rev && rev.name && !/地圖選點/.test(rev.name)) {
        name = rev.name;
        label = rev.label || '地點';
      }
      if (!name && bestStop && bestD < 350) {
        name = bestStop;
        label = '巴士站';
      } else if (!name && bestStop && bestD < 900) {
        name = '近' + bestStop;
        label = '地圖';
      }
      if (!name && !generic) name = fallbackName;
      if (!name) {
        name = '地圖位置 ' + Number(lat).toFixed(4) + ',' + Number(lng).toFixed(4);
      }

      let stopHint = '';
      if (bestStop && bestD < 500 && name.indexOf(bestStop) < 0) {
        stopHint = '附近巴士站：' + bestStop + '（約 ' + Math.round(bestD) + ' 米）';
      }
      if (el) {
        el.innerHTML = name + (stopHint ? '<small>' + stopHint + '</small>' : '');
      }
      return { name, label, stopName: bestStop, stopDist: bestD };
    }

    function openPlanMapPick(lat, lng, name, preset) {
      const list = document.getElementById('planPickList');
      const mapWrap = document.getElementById('planPickMapWrap');
      list.style.display = 'none';
      mapWrap.style.display = 'flex';
      _planPickTemp = preset || {
        kind: 'place',
        id: 'map:' + Number(lat).toFixed(5) + ',' + Number(lng).toFixed(5),
        name: name || '所選位置',
        lat: Number(lat),
        lng: Number(lng),
        label: '地圖'
      };
      const nameEl = document.getElementById('planMapPlaceName');
      if (nameEl) nameEl.textContent = _planPickTemp.name || '移動地圖選點…';

      setTimeout(() => {
        if (typeof L === 'undefined') {
          if (nameEl) nameEl.textContent = '地圖載入失敗';
          return;
        }
        if (_planPickMap) {
          try { _planPickMap.remove(); } catch (_) {}
          _planPickMap = null;
        }
        const el = document.getElementById('planPickMap');
        el.innerHTML = '';
        _planPickMap = L.map(el, { zoomControl: true }).setView([lat, lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '&copy; OpenStreetMap'
        }).addTo(_planPickMap);
        _planPickMarker = L.marker([lat, lng], { draggable: true }).addTo(_planPickMap);

        const onPos = (plat, plng) => {
          clearTimeout(_planRevGeoTimer);
          const nameEl2 = document.getElementById('planMapPlaceName');
          if (nameEl2) nameEl2.textContent = '查詢地點名稱中…';
          _planRevGeoTimer = setTimeout(async () => {
            const info = await planUpdateMapPlaceName(plat, plng, null);
            _planPickTemp = {
              kind: 'place',
              id: 'map:' + plat.toFixed(5) + ',' + plng.toFixed(5),
              name: info.name,
              lat: plat,
              lng: plng,
              label: info.label || '地圖'
            };
          }, 280);
        };

        _planPickMarker.on('dragend', () => {
          const p = _planPickMarker.getLatLng();
          onPos(p.lat, p.lng);
        });
        _planPickMap.on('click', (e) => {
          _planPickMarker.setLatLng(e.latlng);
          onPos(e.latlng.lat, e.latlng.lng);
        });
        setTimeout(() => {
          _planPickMap.invalidateSize();
          onPos(Number(lat), Number(lng));
        }, 200);
      }, 50);
    }

      if (mapConfirm) {
        mapConfirm.onclick = () => {
          if (_planPickTemp) applyPlanPick(_planPickTemp);
        };
      }
    }

    async function planSearchLocalStops(q, limit) {
      limit = limit || 12;
      const { stopList } = await ensureStopIndex();
      const ql = q.toLowerCase();
      const scored = [];
      for (const [id, info] of Object.entries(stopList)) {
        const nameZh = (info.name && info.name.zh) || '';
        const nameEn = (info.name && info.name.en) || '';
        const name = nameZh || nameEn;
        if (!name) continue;
        const nl = name.toLowerCase();
        const en = nameEn.toLowerCase();
        let score = -1;
        if (name.startsWith(q) || nl.startsWith(ql)) score = 100;
        else if (en.startsWith(ql)) score = 90;
        else if (name.includes(q) || nl.includes(ql)) score = 50;
        else if (en.includes(ql)) score = 40;
        else continue;
        const idx = Math.max(0, nl.indexOf(ql));
        score -= Math.min(idx, 20);
        const loc = info.location || {};
        const lat = parseFloat(loc.lat), lng = parseFloat(loc.lng);
        if (isNaN(lat) || isNaN(lng)) continue;
        scored.push({
          kind: 'stop',
          id: String(id),
          name,
          lat, lng,
          label: '巴士站',
          _score: score
        });
      }
      scored.sort((a, b) => b._score - a._score);
      return scored.slice(0, limit);
    }

    function planSearchRegionPlaces(q, limit) {
      limit = limit || 8;
      const ql = q.toLowerCase();
      const scored = [];
      if (typeof PLAN_REGIONS === 'undefined') return scored;
      for (const [region, districts] of Object.entries(PLAN_REGIONS)) {
        for (const [dist, places] of Object.entries(districts || {})) {
          for (const p of places) {
            const pl = p.toLowerCase();
            let score = -1;
            if (p.startsWith(q) || pl.startsWith(ql)) score = 95;
            else if (p.includes(q) || pl.includes(ql)) score = 45;
            else continue;
            scored.push({
              kind: 'region',
              id: 'region:' + p,
              name: p,
              lat: null,
              lng: null,
              label: region + ' · ' + dist,
              _score: score,
              _needResolve: true
            });
          }
        }
      }
      scored.sort((a, b) => b._score - a._score);
      return scored.slice(0, limit);
    }

    function planHighlightMatch(name, q) {
      if (!q) return name;
      try {
        const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return String(name).replace(new RegExp('(' + esc + ')', 'ig'), '<mark>$1</mark>');
      } catch (_) {
        return name;
      }
    }

    function planRenderSuggestList(hits, q, emptyMsg) {
      const list = document.getElementById('planPickList');
      if (!list) return;
      list._hits = hits;
      if (!hits.length) {
        list.innerHTML = '<div class="plan-pick-item">' + (emptyMsg || '無結果') + '</div>';
        return;
      }
      const places = hits.filter(h => h.kind !== 'stop');
      const stops = hits.filter(h => h.kind === 'stop');
      let html = '';
      if (places.length) {
        html += '<div class="plan-pick-sec">地點</div>';
        places.forEach((s) => {
          const i = hits.indexOf(s);
          html += '<div class="plan-pick-item" data-act="hit" data-i="' + i + '">' +
            '<span>' + planHighlightMatch(s.name, q) + '</span>' +
            '<small style="color:#8e8e93">' + (s.label || '') + '</small></div>';
        });
      }
      if (stops.length) {
        html += '<div class="plan-pick-sec">巴士站</div>';
        stops.forEach((s) => {
          const i = hits.indexOf(s);
          html += '<div class="plan-pick-item" data-act="hit" data-i="' + i + '">' +
            '<span>' + planHighlightMatch(s.name, q) + '</span>' +
            '<small style="color:#8e8e93">' + (s.label || '巴士站') + '</small></div>';
        });
      }
      list.innerHTML = html;
      bindPlanPickList();
    }

    /** 地點搜尋（OpenStreetMap Photon，香港範圍） */
    async function planSearchPhoton(q, limit) {
      limit = limit || 8;
      try {
        const url = 'https://photon.komoot.io/api/?limit=' + limit +
          '&lang=zh&q=' + encodeURIComponent(q + ' 香港');
        const res = await fetch(url);
        if (!res.ok) return [];
        const json = await res.json();
        const feats = json.features || [];
        return feats.map(f => {
          const p = f.properties || {};
          const c = (f.geometry && f.geometry.coordinates) || [0, 0];
          const parts = [p.name, p.street, p.district, p.city, p.county]
            .filter(Boolean);
          // 去重相鄰
          const name = parts.filter((x, i, a) => a.indexOf(x) === i).join('，') || q;
          const lat = Number(c[1]), lng = Number(c[0]);
          // 粗略限制在香港附近
          if (lat < 22.1 || lat > 22.6 || lng < 113.8 || lng > 114.5) return null;
          return {
            kind: 'place',
            id: 'place:' + lat.toFixed(5) + ',' + lng.toFixed(5),
            name,
            lat, lng,
            label: p.type || p.osm_value || '地點'
          };
        }).filter(Boolean);
      } catch (e) {
        console.warn('photon search', e);
        return [];
      }
    }

    async function planSearchStops(q) {
      const box = document.getElementById('planSuggest');
      if (!q || q.length < 1) {
        box.classList.remove('show');
        box.innerHTML = '';
        return;
      }
      box.innerHTML = '<div class="plan-suggest-item">搜尋地點中…</div>';
      box.classList.add('show');
      const [stops, places] = await Promise.all([
        planSearchLocalStops(q, 10),
        planSearchPhoton(q, 8)
      ]);
      // 地點優先，再巴士站；去重名稱
      const hits = [];
      const seen = new Set();
      for (const s of places.concat(stops)) {
        const key = (s.name || '') + '|' + (s.lat && s.lat.toFixed(4)) + '|' + (s.lng && s.lng.toFixed(4));
        if (seen.has(key)) continue;
        seen.add(key);
        hits.push(s);
      }
      if (!hits.length) {
        box.innerHTML = '<div class="plan-suggest-item">找不到相符地點，請換關鍵字</div>';
        box.classList.add('show');
        return;
      }
      box.innerHTML = hits.map((s, i) =>
        `<div class="plan-suggest-item" data-i="${i}"><strong>${s.name}</strong><small>${s.label}${s.kind === 'stop' ? ' · ' + s.id : ''}</small></div>`
      ).join('');
      box._hits = hits;
      box.classList.add('show');
      box.querySelectorAll('.plan-suggest-item').forEach(el => {
        el.onclick = () => {
          const s = hits[Number(el.dataset.i)];
          if (!s) return;
          if (_planFocus === 'from') {
            _planFrom = s;
            document.getElementById('planFromInput').value = s.name;
          } else {
            _planTo = s;
            document.getElementById('planToInput').value = s.name;
          }
          box.classList.remove('show');
        };
      });
    }

    /** 將地點解析為最近巴士站（供路線搜尋） */
    async function planResolveToStop(point, radiusM) {
      radiusM = radiusM || 900;
      if (!point) return null;
      if (point.kind === 'stop' && point.id && !String(point.id).startsWith('place:')) {
        return point;
      }
      const { stopList } = await ensureStopIndex();
      let best = null, bestD = Infinity;
      const lat0 = point.lat, lng0 = point.lng;
      if (lat0 == null || lng0 == null || isNaN(lat0)) return null;
      for (const [id, info] of Object.entries(stopList)) {
        const loc = info.location || {};
        const lat = parseFloat(loc.lat), lng = parseFloat(loc.lng);
        if (isNaN(lat) || isNaN(lng)) continue;
        const d = haversineM(lat0, lng0, lat, lng);
        if (d < bestD) {
          bestD = d;
          best = {
            kind: 'stop',
            id: String(id),
            name: (info.name && (info.name.zh || info.name.en)) || id,
            lat, lng,
            walkFromPlaceM: Math.round(d),
            placeName: point.name
          };
        }
      }
      if (!best || bestD > radiusM) return best; // 仍回傳最近，即使稍遠
      return best;
    }

    function planCoLabel(co) {
      const m = {
        kmb: '九巴', lwb: '龍運', ctb: '城巴', nlb: '嶼巴',
        gmb: '小巴', mtrbus: '港鐵巴士', mtr: '港鐵',
        lightrail: '輕鐵', lightRail: '輕鐵', tram: '電車',
        lrtfeeder: '港鐵接駁巴士'
      };
      const c = String(co || '');
      return m[c] || m[c.toLowerCase()] || c.toUpperCase();
    }

    function planEstimateMins(distM, stopsBetween) {
      // 市區約 18km/h + 每站約 0.4 分
      const move = (distM / 1000) / 18 * 60;
      const dwell = Math.max(0, (stopsBetween || 0)) * 0.4;
      return Math.max(3, Math.round(move + dwell));
    }

    function planWalkMins(distM) {
      return Math.max(1, Math.round((distM / 1000) / 4.5 * 60)); // 步行 4.5km/h
    }

    function planRouteStops(info, co) {
      const stopsByCo = info.stops || {};
      const arr = stopsByCo[co] || stopsByCo[String(co).toLowerCase()] || [];
      // try any co
      if (arr.length) return arr.map(String);
      for (const k of Object.keys(stopsByCo)) {
        if (stopsByCo[k] && stopsByCo[k].length) return stopsByCo[k].map(String);
      }
      return [];
    }

    function planPickCo(info) {
      const cos = info.co || [];
      if (!cos.length) return 'kmb';
      return String(cos[0]).toLowerCase();
    }

    function planDestOf(info) {
      return (info.dest && (info.dest.zh || info.dest.en)) || '';
    }

    function planFareGuess(info, fromIdx, toIdx) {
      // 盡量用分段車費；否則用全程票價作參考
      try {
        const fares = info.fares || info.fare || null;
        if (Array.isArray(fares) && fares.length) {
          const i = Math.max(0, Math.min(fromIdx, fares.length - 1));
          const v = parseFloat(fares[i]);
          if (!isNaN(v)) return roundFare(v);
        }
        if (fares && typeof fares === 'object') {
          // common shapes vary; try numeric full
          if (typeof fares.full === 'number') return fares.full;
        }
        if (typeof info.fullFare === 'number') return info.fullFare;
        // hkbus routeList sometimes has fare in nested form
        if (info.freq && info.fare) return Number(info.fare);
      } catch (_) {}
      const cos = (info && info.co) ? info.co : [];
      const co0 = String((cos[0] || info && info._co) || '').toLowerCase();
      const n = Math.max(1, (toIdx - fromIdx));
      if (co0 === 'mtr') {
        // 港鐵粗估：起程約 $5，每站約 $1.2
        return Math.round(Math.max(5, Math.min(35, 4 + n * 1.2)) * 10) / 10;
      }
      if (co0 === 'lightrail') {
        return Math.round(Math.max(3, Math.min(12, 2.5 + n * 0.6)) * 10) / 10;
      }
      // 巴士粗估
      return Math.round(Math.max(4.5, Math.min(28, 3.5 + n * 0.75)) * 10) / 10;
    }


    /**
     * 港鐵／輕鐵轉乘不限次數（站點圖最短路）
     */
    function planBuildRailUnlimitedOptions(fromLat, fromLng, toLat, toLng, stopCoord, routeList) {
      const NEAR = 700;
      const options = [];
      const railRoutes = [];
      for (const [key, info] of Object.entries(routeList)) {
        const cos = (info.co && info.co.length) ? info.co.map(c => String(c).toLowerCase()) : [];
        const isRail = cos.includes('mtr') || cos.includes('lightrail');
        if (!isRail) continue;
        const co = cos.includes('mtr') ? 'mtr' : 'lightrail';
        let stops = planRouteStops(info, co === 'lightrail' ? 'lightRail' : 'mtr');
        if (!stops.length) stops = planRouteStops(info, co);
        if (!stops.length) {
          const by = info.stops || {};
          stops = (by.mtr || by.lightRail || by.lightrail || []).map(String);
        }
        if (stops.length < 2) continue;
        const seq = [];
        for (let i = 0; i < stops.length; i++) {
          const sc = stopCoord.get(String(stops[i]));
          if (!sc) continue;
          seq.push({ i, sid: String(stops[i]), lat: sc.lat, lng: sc.lng, name: sc.name });
        }
        if (seq.length < 2) continue;
        railRoutes.push({ key, co, info, route: info.route || key.split('+')[0], seq });
      }
      if (!railRoutes.length) return options;

      const graph = new Map();
      const addEdge = (fromSid, edge) => {
        if (!graph.has(fromSid)) graph.set(fromSid, []);
        graph.get(fromSid).push(edge);
      };
      for (const R of railRoutes) {
        for (let a = 0; a < R.seq.length; a++) {
          for (let b = a + 1; b < Math.min(R.seq.length, a + 18); b++) {
            const A = R.seq[a], B = R.seq[b];
            const mins = Math.max(2, Math.round((b - a) * (R.co === 'mtr' ? 2.2 : 1.8)));
            const fare = planFareGuess(Object.assign({}, R.info, { co: [R.co] }), a, b);
            addEdge(A.sid, {
              to: B.sid, toName: B.name, fromName: A.name,
              fromSid: A.sid, route: R.route, co: R.co, info: R.info,
              mins, fare
            });
          }
        }
      }

      const starts = [];
      const ends = new Map();
      for (const [sid, sc] of stopCoord.entries()) {
        if (!graph.has(sid)) continue;
        const df = haversineM(fromLat, fromLng, sc.lat, sc.lng);
        const dt = haversineM(toLat, toLng, sc.lat, sc.lng);
        if (df <= NEAR) starts.push({ sid, d: df, name: sc.name });
        if (dt <= NEAR) ends.set(sid, { d: dt, name: sc.name });
      }
      starts.sort((a, b) => a.d - b.d);
      const startList = starts.slice(0, 5);
      if (!startList.length || !ends.size) return options;

      for (const st of startList) {
        const distMap = new Map([[st.sid, planWalkMins(st.d)]]);
        const prev = new Map();
        const pq = [{ sid: st.sid, cost: planWalkMins(st.d) }];
        const seen = new Set();
        while (pq.length) {
          pq.sort((a, b) => a.cost - b.cost);
          const cur = pq.shift();
          if (seen.has(cur.sid)) continue;
          seen.add(cur.sid);
          for (const e of (graph.get(cur.sid) || [])) {
            const nc = cur.cost + e.mins + 0.8;
            if (!distMap.has(e.to) || nc < distMap.get(e.to)) {
              distMap.set(e.to, nc);
              prev.set(e.to, { fromSid: cur.sid, edge: e });
              pq.push({ sid: e.to, cost: nc });
            }
          }
          if (seen.size > 400) break;
        }
        for (const [endSid, endInfo] of ends.entries()) {
          if (endSid === st.sid || !distMap.has(endSid)) continue;
          const edgePath = [];
          let x = endSid;
          const guard = new Set();
          while (prev.has(x) && !guard.has(x)) {
            guard.add(x);
            const p = prev.get(x);
            edgePath.push(p.edge);
            x = p.fromSid;
          }
          edgePath.reverse();
          if (!edgePath.length) continue;
          const legs = [];
          for (const e of edgePath) {
            const last = legs[legs.length - 1];
            if (last && last.route === e.route && last.co === e.co) {
              last.alightId = e.to;
              last.alightName = e.toName;
              last.mins += e.mins;
              last.fare = Math.round(Math.max(last.fare, e.fare) * 10) / 10;
            } else {
              legs.push({
                route: e.route, co: e.co, dest: planDestOf(e.info),
                boardId: e.fromSid, boardName: e.fromName,
                alightId: e.to, alightName: e.toName,
                mins: e.mins, fare: e.fare,
                service_type: '1', nlbId: null,
                walkFromPrevM: legs.length ? 120 : undefined
              });
            }
          }
          const transferCount = Math.max(0, legs.length - 1);
          const rideMins = legs.reduce((s, l) => s + l.mins, 0);
          const walkMins = planWalkMins(st.d) + planWalkMins(endInfo.d) + transferCount * 2;
          const fareRaw = legs.reduce((s, l) => s + (l.fare || 0), 0);
          const totalFare = Math.round(Math.min(fareRaw, Math.max(...legs.map(l => l.fare || 0)) * 1.35) * 10) / 10;
          const totalMins = rideMins + walkMins;
          options.push({
            type: transferCount ? 'transfer' : 'direct',
            transfers: transferCount,
            railUnlimited: true,
            scoreSmart: totalMins + totalFare * 0.5 + transferCount * 0.3,
            scoreFast: totalMins,
            scoreCheap: totalFare * 10 + totalMins * 0.03,
            totalMins,
            walkM: Math.round(st.d + endInfo.d + transferCount * 100),
            totalFare,
            legs
          });
        }
      }
      const best = new Map();
      for (const o of options) {
        const k = o.legs.map(l => l.co + '/' + l.route + '/' + l.boardName + '/' + l.alightName).join('>');
        if (!best.has(k) || o.scoreFast < best.get(k).scoreFast) best.set(k, o);
      }
      return Array.from(best.values()).slice(0, 15);
    }

    async function buildPlanOptions(from, to) {
      const { stopList, routeList } = await ensureStopIndex();
      const fromLat = Number(from.lat), fromLng = Number(from.lng);
      const toLat = Number(to.lat), toLng = Number(to.lng);
      if (isNaN(fromLat) || isNaN(toLat)) return [];

      // 上／落車匹配（終點距離由搜尋偏好控制）
      const NEAR_BOARD_M = 450;
      const NEAR_BOARD_MAX = 1000;
      const alightPrefM = (typeof PLAN_PREFS !== 'undefined' && PLAN_PREFS.alightM != null)
        ? PLAN_PREFS.alightM : 400;
      const NEAR_ALIGHT_PREF = Math.max(0, Math.min(200, alightPrefM));
      const NEAR_ALIGHT_M = Math.max(50, Math.min(1000, alightPrefM || 400));
      // 0 米時仍給最小緩衝，否則幾乎無結果
      const NEAR_ALIGHT_USE = NEAR_ALIGHT_M === 0 ? 80 : NEAR_ALIGHT_M;
      const TRANSFER_M = 650;
      const maxXfer = (typeof PLAN_PREFS !== 'undefined' && PLAN_PREFS.maxTransfers != null)
        ? PLAN_PREFS.maxTransfers : 2;
      const showN = (typeof PLAN_PREFS === 'undefined') ? true : !!PLAN_PREFS.showNRoute;
      const options = [];

      const stopCoord = new Map();
      for (const [id, info] of Object.entries(stopList)) {
        const loc = info.location || {};
        const lat = parseFloat(loc.lat), lng = parseFloat(loc.lng);
        if (isNaN(lat) || isNaN(lng)) continue;
        stopCoord.set(String(id), {
          lat, lng,
          name: (info.name && (info.name.zh || info.name.en)) || id
        });
      }

      const cellSize = 0.004;
      function cellKey(lat, lng) {
        return Math.floor(lat / cellSize) + ':' + Math.floor(lng / cellSize);
      }
      function makeGrid() {
        return {
          map: new Map(),
          add(lat, lng, item) {
            const k = cellKey(lat, lng);
            if (!this.map.has(k)) this.map.set(k, []);
            this.map.get(k).push(item);
          },
          query(lat, lng, maxM) {
            const out = [];
            const ci = Math.floor(lat / cellSize), cj = Math.floor(lng / cellSize);
            for (let di = -1; di <= 1; di++) {
              for (let dj = -1; dj <= 1; dj++) {
                const arr = this.map.get((ci + di) + ':' + (cj + dj));
                if (!arr) continue;
                for (const it of arr) {
                  const d = haversineM(lat, lng, it.lat, it.lng);
                  if (d <= maxM) out.push(Object.assign({ d }, it));
                }
              }
            }
            return out;
          }
        };
      }

      const destGrid = makeGrid();   // 通往終點的第二／末程上車點
      const passGrid = makeGrid();   // 全線站點（中轉用）
      const leg1 = [];

      for (const [key, info] of Object.entries(routeList)) {
        const cos = (info.co && info.co.length) ? info.co : [planPickCo(info)];
        for (const c0 of cos) {
          const co = String(c0).toLowerCase();
          const arr = planRouteStops(info, co);
          if (arr.length < 2) continue;
          const seq = [];
          for (let i = 0; i < arr.length; i++) {
            const sc = stopCoord.get(String(arr[i]));
            if (!sc) continue;
            seq.push({ i, sid: String(arr[i]), lat: sc.lat, lng: sc.lng, name: sc.name });
          }
          if (seq.length < 2) continue;

          const nearFrom = [];
          const nearTo = [];
          for (const s of seq) {
            const df = haversineM(fromLat, fromLng, s.lat, s.lng);
            const dt = haversineM(toLat, toLng, s.lat, s.lng);
            if (df <= NEAR_BOARD_MAX) nearFrom.push(Object.assign({ d: df }, s));
            if (dt <= NEAR_ALIGHT_USE) nearTo.push(Object.assign({ d: dt }, s));
            // 中轉索引：每站
            passGrid.add(s.lat, s.lng, {
              key, co, info, route: info.route || key.split('+')[0],
              stop: s, seq
            });
          }
          nearFrom.sort((a, b) => a.d - b.d);
          nearTo.sort((a, b) => a.d - b.d);
          // 只要有更近的站，就不用過遠的上車站
          const nearFromPrefer = nearFrom.filter(s => s.d <= NEAR_BOARD_M);
          const boardCandidates = (nearFromPrefer.length ? nearFromPrefer : nearFrom).slice(0, 3);
          const nearToPrefer = nearTo.filter(s => s.d <= NEAR_ALIGHT_PREF);
          const alightCandidates = (nearToPrefer.length ? nearToPrefer : nearTo.filter(s => s.d <= 400).length ? nearTo.filter(s => s.d <= 400) : nearTo).slice(0, 4);
          const routeName = info.route || key.split('+')[0];
          if (!showN && planIsNRoute(routeName)) continue;

          // 直達
          for (const a of boardCandidates) {
            for (const b of alightCandidates) {
              if (b.i <= a.i) continue;
              const dist = haversineM(a.lat, a.lng, b.lat, b.lng);
              const rideMins = planEstimateMins(dist, b.i - a.i);
              const walkMins = planWalkMins(a.d) + planWalkMins(b.d);
              const mins = rideMins + walkMins;
              const fare = planFareGuess(info, a.i, b.i);
              const boardPenalty = a.d > 350 ? (a.d - 350) / 40 : 0;
              const alightPenalty = b.d > 150 ? (b.d - 150) / 50 : 0;
              options.push({
                type: 'direct',
                transfers: 0,
                scoreSmart: mins + fare * 0.75 + boardPenalty + alightPenalty,
                scoreFast: mins + boardPenalty + alightPenalty,
                scoreCheap: fare * 10 + mins * 0.05 + boardPenalty,
                totalMins: mins,
                walkM: Math.round(a.d + b.d),
                walkMins: walkMins,
                boardWalkM: Math.round(a.d),
                alightWalkM: Math.round(b.d),
                totalFare: fare,
                legs: [{
                  route: routeName, co, dest: planDestOf(info),
                  boardId: a.sid, boardName: a.name,
                  alightId: b.sid, alightName: b.name,
                  mins, fare,
                  service_type: String(info.serviceType || 1),
                  nlbId: info.nlbId || null
                }]
              });
            }
          }

          // 第一程（只從最近上車站出發）
          for (const a of boardCandidates) {
            const alights = [];
            for (const s of seq) {
              if (s.i <= a.i) continue;
              if (s.i - a.i > 55) break;
              alights.push(s);
              if (alights.length >= 20) break;
            }
            const sampled = alights.length <= 10 ? alights :
              alights.filter((_, idx) => idx % Math.ceil(alights.length / 10) === 0);
            leg1.push({ key, co, info, route: routeName, board: a, alights: sampled });
          }

          // 末程：終點落車前的上車點
          for (const b of nearTo.slice(0, 3)) {
            let count = 0;
            for (let si = seq.length - 1; si >= 0; si--) {
              const s = seq[si];
              if (s.i >= b.i) continue;
              if (b.i - s.i > 55) break;
              destGrid.add(s.lat, s.lng, {
                key, co, info, route: routeName,
                board: s, alight: b
              });
              count++;
              if (count >= 18) break;
            }
          }
        }
      }

      // —— 一次轉乘 ——
      const transfer1Seen = new Set();
      if (maxXfer >= 1) for (const L of leg1) {
        for (const al of L.alights) {
          const matches = destGrid.query(al.lat, al.lng, TRANSFER_M);
          for (const m of matches) {
            if (m.key === L.key && m.co === L.co) continue;
            const sig = '1|' + L.route + L.co + al.sid + m.route + m.co + m.board.sid;
            if (transfer1Seen.has(sig)) continue;
            transfer1Seen.add(sig);
            if (transfer1Seen.size > 280) break;

            const d1 = haversineM(L.board.lat, L.board.lng, al.lat, al.lng);
            const d2 = haversineM(m.board.lat, m.board.lng, m.alight.lat, m.alight.lng);
            const m1 = planEstimateMins(d1, al.i - L.board.i);
            const m2 = planEstimateMins(d2, m.alight.i - m.board.i);
            const wmin = planWalkMins(m.d);
            const f1 = planFareGuess(L.info, L.board.i, al.i);
            const f2 = planFareGuess(m.info, m.board.i, m.alight.i);
            const boardWalk = planWalkMins(L.board.d || 0);
            const totalMins = m1 + m2 + wmin + boardWalk + 4;
            const totalFare = Math.round((f1 + f2) * 10) / 10;
            const boardPenalty = (L.board.d || 0) > 350 ? ((L.board.d || 0) - 350) / 40 : 0;
            options.push({
              type: 'transfer',
              transfers: 1,
              scoreSmart: totalMins + totalFare * 0.7 + 3 + boardPenalty,
              scoreFast: totalMins + boardPenalty,
              scoreCheap: totalFare * 10 + totalMins * 0.04 + boardPenalty,
              totalMins,
              walkM: Math.round(m.d + L.board.d + m.alight.d),
              walkMins: boardWalk + wmin + planWalkMins(m.alight.d || 0),
              boardWalkM: Math.round(L.board.d || 0),
              alightWalkM: Math.round(m.alight.d || 0),
              totalFare,
              legs: [
                {
                  route: L.route, co: L.co, dest: planDestOf(L.info),
                  boardId: L.board.sid, boardName: L.board.name,
                  alightId: al.sid, alightName: al.name,
                  mins: m1, fare: f1,
                  service_type: String(L.info.serviceType || 1),
                  nlbId: L.info.nlbId || null
                },
                {
                  route: m.route, co: m.co, dest: planDestOf(m.info),
                  boardId: m.board.sid, boardName: m.board.name,
                  alightId: m.alight.sid, alightName: m.alight.name,
                  mins: m2, fare: f2,
                  service_type: String(m.info.serviceType || 1),
                  nlbId: m.info.nlbId || null,
                  walkFromPrevM: Math.round(m.d)
                }
              ]
            });
          }
          if (transfer1Seen.size > 280) break;
        }
        if (transfer1Seen.size > 280) break;
      }

      // —— 兩次轉乘（起點線 → 中轉線 → 終點線）——
      const transfer2Seen = new Set();
      const leg1For2 = leg1.slice(0, 50);
      if (maxXfer >= 2) for (const L of leg1For2) {
        // 每條第一程只取少數落車點
        const alights = L.alights.filter((_, i) => i % 2 === 0).slice(0, 5);
        for (const al of alights) {
          // 在落車點附近找可轉的其他路線（中轉程）
          const midHits = passGrid.query(al.lat, al.lng, TRANSFER_M);
          // 去重路線
          const midRoutes = [];
          const midSeen = new Set();
          for (const h of midHits) {
            if (h.key === L.key && h.co === L.co) continue;
            const mk = h.key + '|' + h.co;
            if (midSeen.has(mk)) continue;
            midSeen.add(mk);
            // 上車點為 h.stop，需在路線上其後仍有站
            const seq = h.seq;
            const boardIdx = h.stop.i;
            const later = [];
            for (const s of seq) {
              if (s.i <= boardIdx) continue;
              if (s.i - boardIdx > 40) break;
              later.push(s);
              if (later.length >= 10) break;
            }
            if (!later.length) continue;
            const sampled = later.length <= 5 ? later :
              later.filter((_, idx) => idx % Math.ceil(later.length / 5) === 0);
            midRoutes.push({
              key: h.key, co: h.co, info: h.info, route: h.route,
              board: h.stop, walk1: h.d, alights: sampled
            });
            if (midRoutes.length >= 8) break;
          }

          for (const mid of midRoutes) {
            for (const midAl of mid.alights) {
              const endHits = destGrid.query(midAl.lat, midAl.lng, TRANSFER_M);
              for (const m of endHits) {
                if ((m.key === L.key && m.co === L.co) || (m.key === mid.key && m.co === mid.co)) continue;
                const sig = '2|' + L.route + mid.route + m.route + al.sid + midAl.sid + m.board.sid;
                if (transfer2Seen.has(sig)) continue;
                transfer2Seen.add(sig);
                if (transfer2Seen.size > 120) break;

                const d1 = haversineM(L.board.lat, L.board.lng, al.lat, al.lng);
                const d2 = haversineM(mid.board.lat, mid.board.lng, midAl.lat, midAl.lng);
                const d3 = haversineM(m.board.lat, m.board.lng, m.alight.lat, m.alight.lng);
                const m1 = planEstimateMins(d1, al.i - L.board.i);
                const m2 = planEstimateMins(d2, midAl.i - mid.board.i);
                const m3 = planEstimateMins(d3, m.alight.i - m.board.i);
                const w1 = planWalkMins(mid.walk1);
                const w2 = planWalkMins(m.d);
                const f1 = planFareGuess(L.info, L.board.i, al.i);
                const f2 = planFareGuess(mid.info, mid.board.i, midAl.i);
                const f3 = planFareGuess(m.info, m.board.i, m.alight.i);
                const totalMins = m1 + m2 + m3 + w1 + w2 + 8;
                const totalFare = Math.round((f1 + f2 + f3) * 10) / 10;
                options.push({
                  type: 'transfer',
                  transfers: 2,
                  scoreSmart: totalMins + totalFare * 0.7 + 8,
                  scoreFast: totalMins,
                  scoreCheap: totalFare * 10 + totalMins * 0.04,
                  totalMins,
                  walkM: Math.round(mid.walk1 + m.d + L.board.d + m.alight.d),
                  totalFare,
                  legs: [
                    {
                      route: L.route, co: L.co, dest: planDestOf(L.info),
                      boardId: L.board.sid, boardName: L.board.name,
                      alightId: al.sid, alightName: al.name,
                      mins: m1, fare: f1,
                      service_type: String(L.info.serviceType || 1),
                      nlbId: L.info.nlbId || null
                    },
                    {
                      route: mid.route, co: mid.co, dest: planDestOf(mid.info),
                      boardId: mid.board.sid, boardName: mid.board.name,
                      alightId: midAl.sid, alightName: midAl.name,
                      mins: m2, fare: f2,
                      service_type: String(mid.info.serviceType || 1),
                      nlbId: mid.info.nlbId || null,
                      walkFromPrevM: Math.round(mid.walk1)
                    },
                    {
                      route: m.route, co: m.co, dest: planDestOf(m.info),
                      boardId: m.board.sid, boardName: m.board.name,
                      alightId: m.alight.sid, alightName: m.alight.name,
                      mins: m3, fare: f3,
                      service_type: String(m.info.serviceType || 1),
                      nlbId: m.info.nlbId || null,
                      walkFromPrevM: Math.round(m.d)
                    }
                  ]
                });
              }
              if (transfer2Seen.size > 120) break;
            }
            if (transfer2Seen.size > 120) break;
          }
          if (transfer2Seen.size > 120) break;
        }
        if (transfer2Seen.size > 120) break;
      }

      // 港鐵／輕鐵：不限轉乘次數
      try {
        const railOpts = planBuildRailUnlimitedOptions(fromLat, fromLng, toLat, toLng, stopCoord, routeList);
        for (const o of railOpts) options.push(o);
      } catch (e) { console.warn('rail plan', e); }

      // 去重：同路線組合留最快；跨公司去同目的地保留
      const bestMap = new Map();
      for (const o of options) {
        const k = o.legs.map(l => l.route + '/' + l.co).join('+') + '|' + (o.legs[0] && o.legs[0].boardName) + '>' + (o.legs[o.legs.length - 1] && o.legs[o.legs.length - 1].alightName);
        const prev = bestMap.get(k);
        if (!prev || o.scoreFast < prev.scoreFast) bestMap.set(k, o);
      }
      let merged = Array.from(bestMap.values());
      merged = merged.filter(o => {
        if (o.railUnlimited) return true; // 港鐵／輕鐵不限轉乘
        if (!showN && o.legs && o.legs.some(l => planIsNRoute(l.route))) return false;
        const t = o.transfers != null ? o.transfers : (o.legs ? o.legs.length - 1 : 0);
        return t <= maxXfer;
      });
      merged.sort((a, b) => a.scoreFast - b.scoreFast);
      return merged;
    }


    function planDescribe(opt) {
      const lines = [];
      if (opt.placeFrom || opt.placeTo) {
        lines.push(`由「${opt.placeFrom || '起點'}」前往「${opt.placeTo || '終點'}」：`);
      }
      opt.legs.forEach((leg, i) => {
        const co = planCoLabel(leg.co);
        if (i === 0) {
          const rname = planDisplayRoute(leg);
          const isRail = ['mtr','lightrail','lightRail','tram'].includes(String(leg.co));
          const ride = isRail ? rname : (rname + ' 號線');
          lines.push(
            `建議乘搭${ride}（${co}），喺${leg.boardName}上車，車費約 $${leg.fare}，車程約 ${leg.mins} 分鐘，喺${leg.alightName}落車。`
          );
        } else {
          const walk = leg.walkFromPrevM != null ? `轉車步行約 ${leg.walkFromPrevM} 米，` : '';
          const rname = planDisplayRoute(leg);
          const isRail = ['mtr','lightrail','lightRail','tram'].includes(String(leg.co));
          const ride = isRail ? rname : (rname + ' 號線');
          lines.push(
            `然後${walk}轉乘${ride}（${co}），喺${leg.boardName}上車，車費約 $${leg.fare}，車程約 ${leg.mins} 分鐘，喺${leg.alightName}落車。`
          );
        }
      });
      lines.push(`全程約 ${opt.totalMins} 分鐘，步行約 ${opt.walkM} 米，車費合計約 $${opt.totalFare}。`);
      return lines.join(String.fromCharCode(10));
    }

    async function runPlanSearch() {
      const box = document.getElementById('planResults');
      const sum = document.getElementById('planSummary');
      // 用內建座標修正起終點
      if (_planFrom && (_planFrom.lat == null || isNaN(Number(_planFrom.lat)))) {
        const h = planLookupHardCoords(_planFrom.name || document.getElementById('planFromInput').value);
        if (h) _planFrom = h;
      }
      if (_planTo && (_planTo.lat == null || isNaN(Number(_planTo.lat)))) {
        const h = planLookupHardCoords(_planTo.name || document.getElementById('planToInput').value);
        if (h) _planTo = h;
      }
      // 名稱對得上但座標可能被 Photon 指錯：若有 hardcode 則覆寫座標
      if (_planFrom && _planFrom.name) {
        const h = planLookupHardCoords(_planFrom.name);
        if (h) { _planFrom.lat = h.lat; _planFrom.lng = h.lng; }
      }
      if (_planTo && _planTo.name) {
        const h = planLookupHardCoords(_planTo.name);
        if (h) { _planTo.lat = h.lat; _planTo.lng = h.lng; }
      }

      if (!_planFrom || !_planTo) {
        const fv = document.getElementById('planFromInput').value.trim();
        const tv = document.getElementById('planToInput').value.trim();
        if (!_planFrom && fv) {
          const hard = planLookupHardCoords(fv);
          if (hard) _planFrom = hard;
          await planSearchStops(fv);
          const hits = document.getElementById('planSuggest')._hits || [];
          if (hits[0]) _planFrom = hits[0];
        }
        if (!_planTo && tv) {
          await planSearchStops(tv);
          const hits = document.getElementById('planSuggest')._hits || [];
          if (hits[0]) _planTo = hits[0];
        }
      }
      if (!_planFrom || !_planTo) {
        alert('請選擇起點與終點地點');
        return;
      }
      const hot = document.getElementById('planHot');
      const wrap = document.getElementById('planResultsWrap');
      if (hot) hot.classList.add('hidden');
      if (wrap) wrap.classList.remove('hidden');
      box.innerHTML = '<div class="plan-loading">正在搜尋跨公司路線…</div>';
      sum.style.display = 'none';
      const sug = document.getElementById('planSuggest');
      if (sug) sug.classList.remove('show');
      try {
        // 用地點座標規劃（演算法以附近站點座標匹配，不強依賴單一站 id）
        const fromPt = {
          lat: _planFrom.lat,
          lng: _planFrom.lng,
          name: _planFrom.name,
          id: _planFrom.id
        };
        const toPt = {
          lat: _planTo.lat,
          lng: _planTo.lng,
          name: _planTo.name,
          id: _planTo.id
        };
        if (fromPt.lat == null || toPt.lat == null || isNaN(Number(fromPt.lat)) || isNaN(Number(toPt.lat))) {
          box.innerHTML = '<div class="plan-empty">地點座標無效，請重新選擇起點／終點</div>';
          return;
        }
        if (haversineM(fromPt.lat, fromPt.lng, toPt.lat, toPt.lng) < 80) {
          box.innerHTML = '<div class="plan-empty">起點與終點太近，請選擇更遠的地點</div>';
          return;
        }
        _planFromStop = fromPt;
        _planToStop = toPt;
        const opts = await buildPlanOptions(fromPt, toPt);
        opts.forEach(o => {
          o.placeFrom = _planFrom.name;
          o.placeTo = _planTo.name;
          o.scoreFast = o.totalMins;
          o.scoreCheap = (o.totalFare || 0) * 10 + o.totalMins * 0.05;
          o.scoreSmart = o.totalMins + (o.totalFare || 0) * 0.85 + (o.type === 'transfer' ? 3 : 0);
        });
        _planResults = opts;
        if (!opts.length) {
          box.innerHTML = '<div class="plan-empty">找不到合適路線<br><small>已搜尋附近車站與最多 2 次轉乘（港鐵轉乘不限）。<br>可試改用「上水／粉嶺」等中途點，或檢查起終點是否定位正確。</small></div>';
          return;
        }
        renderPlanResults();
      } catch (e) {
        console.error(e);
        box.innerHTML = '<div class="plan-empty">搜尋失敗，請稍後再試</div>';
      }
    }

    function renderPlanResults() {
      const box = document.getElementById('planResults');
      const sum = document.getElementById('planSummary');
      let list = _planResults.slice();
      if (_planMode === 'fast') list.sort((a, b) => a.scoreFast - b.scoreFast);
      else if (_planMode === 'cheap') list.sort((a, b) => a.scoreCheap - b.scoreCheap);
      else list.sort((a, b) => a.scoreSmart - b.scoreSmart);
      list = list.slice(0, 20);
      if (!list.length) {
        box.innerHTML = '<div class="plan-empty">沒有結果</div>';
        sum.style.display = 'none';
        return;
      }
      const top = list[0];
      sum.style.display = 'flex';
      const depart = _planDepartAt ? new Date(_planDepartAt) : new Date();
      const arrive = new Date(depart.getTime() + top.totalMins * 60000);
      const pad = n => String(n).padStart(2, '0');
      const arrLabel = pad(arrive.getHours()) + ':' + pad(arrive.getMinutes());
      sum.innerHTML = `
        <span>⏱ ${top.totalMins} 分鐘</span>
        <span>🚶 ${top.walkM} 米</span>
        <span>$ ${top.totalFare}</span>
        <span>抵達約 ${arrLabel}</span>
      `;
      const modeTitle = _planMode === 'cheap' ? '最便宜前往目的地之路線' :
        (_planMode === 'smart' ? '較短行程建議' : '最快前往目的地之路線');
      const banner = '<div class="plan-results-banner">' + modeTitle + '</div>';
      box.innerHTML = banner + list.map((o, idx) => {
        const chips = o.legs.map((l, i) => {
          const plate = plateClass({ co: l.co, region: l.region });
          const label = planDisplayRoute(l);
          return (i ? '<span class="plan-plus">⇒</span>' : '') +
            `<span class="plan-route-chip ${plate}">${label}</span>`;
        }).join('');
        const fares = o.legs.map(l => '$' + (l.fare != null ? l.fare : '—')).join('　');
        const desc = planDescribe(o).split(String.fromCharCode(10)).join('<br>');
        return `<div class="plan-card" data-idx="${idx}">
          <div class="plan-card-head">
            <div style="flex:1;min-width:0">${chips}</div>
            <div class="plan-card-right"><small>全程時間(約)</small>${o.totalMins} 分鐘</div>
          </div>
          <div class="plan-leg-fares">${fares}</div>
          <div class="plan-walk-line">步行約 ${o.walkM} 米（${o.walkMins != null ? o.walkMins : Math.max(1, Math.round((o.walkM||0)/70))} 分鐘）${o.boardWalkM != null ? '　·　起點走 ' + o.boardWalkM + ' 米' : ''}${o.alightWalkM != null ? '　·　終點走 ' + o.alightWalkM + ' 米' : ''}${o.transfers ? '　·　轉乘 ' + o.transfers + ' 次' : '　·　直達'}</div>
          <div class="plan-card-body">${desc}
            <div style="margin-top:10px">
              <button type="button" class="plan-btn-search" style="width:100%;padding:8px;border-radius:8px;font-size:0.85rem"
                data-open-leg="0">查看首程到站</button>
            </div>
          </div>
        </div>`;
      }).join('') + '<div class="plan-disclaimer">預計全程時間根據路線站距與步行時間估算，搜尋結果只供參考，實際情況視乎路面交通而定。港鐵／輕鐵／巴士資料來自公開資料。</div>';

      box.querySelectorAll('.plan-card-head').forEach(head => {
        head.onclick = () => head.parentElement.classList.toggle('open');
      });
      box.querySelectorAll('[data-open-leg]').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const card = btn.closest('.plan-card');
          const opt = list[Number(card.dataset.idx)];
          if (!opt || !opt.legs[0]) return;
          const leg = opt.legs[0];
          // 開啟該路線到站
          const bound = 'out';
          selectRouteDirection(
            leg.route,
            leg.co,
            bound,
            leg.dest,
            null,
            null,
            null,
            leg.service_type || '1',
            leg.nlbId || null
          );
          setTimeout(() => {
            const found = (state.currentStops || []).find(x => String(x.id) === String(leg.boardId));
            if (found) selectStop(found);
          }, 800);
        };
      });
    }


    // ========== 天氣（香港天文台） ==========
    const WX_ICON_NAME = {
      50: '陽光充沛', 51: '間有陽光', 52: '短暫陽光', 53: '間有陽光幾陣驟雨',
      54: '短暫陽光幾陣驟雨', 60: '多雲', 61: '密雲', 62: '微雨', 63: '雨',
      64: '大雨', 65: '雷暴', 70: '微雨', 71: '微雨', 72: '微雨', 73: '雨',
      74: '大雨', 75: '大雨', 76: '大雨', 77: '大雨', 80: '大風', 81: '大風',
      82: '大風', 83: '大風', 84: '大風', 85: '大風', 90: '熱', 91: '冷', 92: '冷', 93: '冷'
    };

    function wxWarnClass(code) {
      const c = String(code || '').toUpperCase();
      if (c.includes('BLACK') || c.includes('黑')) return 'black';
      if (c.includes('RED') || c.includes('紅')) return 'red';
      if (c.includes('AMBER') || c.includes('黃') || c.includes('AMBER')) return 'amber';
      if (c.includes('YELLOW') || c.includes('黃')) return 'yellow';
      if (c.includes('BLUE') || c.includes('藍')) return 'blue';
      return '';
    }

    async function loadWeather() {
      const bar = document.getElementById('weatherBar');
      if (!bar) return;
      try {
        const [rhr, flw, warn] = await Promise.all([
          fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
          fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc').catch(() => ({})),
          fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc').catch(() => ({}))
        ]);

        // 氣溫：優先天文台
        let temp = '—';
        if (rhr.temperature && rhr.temperature.data) {
          const hko = rhr.temperature.data.find(t => t.place === '香港天文台') || rhr.temperature.data[0];
          if (hko) temp = hko.value;
        }
        let humidity = '—';
        if (rhr.humidity && rhr.humidity.data && rhr.humidity.data[0]) {
          humidity = rhr.humidity.data[0].value;
        }
        const iconNum = (rhr.icon && rhr.icon[0]) ? rhr.icon[0] : 60;
        const iconName = WX_ICON_NAME[iconNum] || '天氣';
        const iconUrl = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconNum}.png`;

        // 警告
        const warnBadges = [];
        if (warn && typeof warn === 'object') {
          Object.keys(warn).forEach(k => {
            const w = warn[k];
            if (!w) return;
            const name = w.name || w.code || k;
            const type = w.type || w.actionCode || '';
            const label = type ? `${name} ${type}` : name;
            warnBadges.push({ label, cls: wxWarnClass(w.code || name) });
          });
        }
        // rhr 也可能有 warningMessage 字串
        if ((!warnBadges.length) && rhr.warningMessage) {
          const msgs = Array.isArray(rhr.warningMessage) ? rhr.warningMessage : [rhr.warningMessage];
          msgs.filter(Boolean).forEach(m => warnBadges.push({ label: m, cls: 'red' }));
        }

        const forecast = (flw && flw.forecastDesc) ? flw.forecastDesc : '';
        const outlook = (flw && flw.outlook) ? flw.outlook : '';
        const forecastText = forecast || outlook || '';
        const updatedAt = new Date().toTimeString().substring(0, 5);

        bar.classList.remove('wx-loading');
        bar.innerHTML = `
          <div class="weather-main">
            <img class="weather-icon" src="${iconUrl}" alt="${iconName}" onerror="this.style.display='none'">
            <div class="weather-temp">${temp}<span style="font-size:.7rem;font-weight:500">°C</span></div>
            <div class="weather-meta">
              <div class="wx-line"><strong>${iconName}</strong> · 濕度 ${humidity}%</div>
              <div class="wx-line">天文台 · 更新 ${updatedAt} · 每10分鐘自動更新</div>
            </div>
          </div>
          ${warnBadges.length ? `<div class="weather-warns">${warnBadges.map(b =>
            `<span class="wx-warn-badge ${b.cls}">${b.label}</span>`
          ).join('')}</div>` : ''}
          ${forecastText ? `<div class="wx-forecast">${forecastText}</div>` : ''}
        `;
      } catch (e) {
        console.warn('Weather load failed', e);
        bar.classList.add('wx-loading');
        bar.textContent = '天氣資料暫時無法載入';
      }
    }

    loadAllRoutes();
    ensureFareData().catch(() => {});
    initStopActionSheet();
    window.confirmPlanMapPick = confirmPlanMapPick;
    window.closePlanPlacePicker = closePlanPlacePicker;
    window.openPlanPlacePicker = openPlanPlacePicker;
    initPlanPage();
    requestUserLocationOnLaunch();
    loadPlanPrefs();
    setTimeout(initPlanPrefsUI, 0);
    setTimeout(initPlanPrefsUI, 300);
    // DOM 尾部的選點面板：延遲再綁一次聯想
    setTimeout(bindPlanPickSuggest, 0);
    setTimeout(bindPlanPickSuggest, 500);
    loadWeather();
    // 每 10 分鐘自動更新天氣
    setInterval(loadWeather, 10 * 60 * 1000);
  </script>

  <div class="plan-pick-mask" id="planPickMask">
    <div class="plan-pick-bar">
      <input type="search" id="planPickInput" placeholder="起點（請輸入）" autocomplete="off">
      <button type="button" class="cancel" id="planPickCancel" onclick="closePlanPlacePicker()">取消</button>
    </div>
    <div class="plan-pick-body" id="planPickList"></div>
    <div id="planPickMapWrap" style="display:none;flex-direction:column;flex:1;min-height:0">
      <div id="planPickMap"></div>
      <div class="plan-map-place-name" id="planMapPlaceName">移動地圖選點…</div>
      <div class="plan-map-confirm">
        <button type="button" id="planPickMapConfirm" onclick="confirmPlanMapPick()">確認</button>
      </div>
    </div>
  </div>


  <div class="plan-pref-mask" id="planPrefMask">
    <div class="plan-pref-sheet" role="dialog" aria-label="搜尋偏好設定">
      <div class="plan-pref-handle"></div>
      <div class="plan-pref-title">搜尋偏好設定</div>

      <div class="plan-pref-row">
        <label class="main"><span>終點站匹配距離</span><span class="val" id="prefAlightVal">400 米</span></label>
        <input type="range" id="prefAlightRange" min="0" max="1000" step="50" value="400">
        <div class="plan-pref-hint">只建議在終點約此距離內落車的路線（0 = 極近，1000 = 較寬鬆）</div>
      </div>

      <div class="plan-pref-row">
        <label class="main"><span>最多轉乘次數</span><span class="val" id="prefXferVal">2 次</span></label>
        <input type="range" id="prefXferRange" min="0" max="4" step="1" value="2">
        <div class="plan-pref-hint">巴士／小巴：0～4 次。港鐵、輕鐵轉乘不限次數。</div>
      </div>

      <div class="plan-pref-row">
        <div class="plan-pref-toggle">
          <div>
            <div style="font-weight:700;font-size:0.92rem">顯示 N 線通宵巴士</div>
            <div class="plan-pref-hint">關閉後搜尋結果不會出現 N 字頭通宵路線</div>
          </div>
          <button type="button" class="sw on" id="prefNRouteSw" aria-label="顯示N線"></button>
        </div>
      </div>

      <div class="plan-pref-row">
        <label class="main"><span>底色主題</span></label>
        <div class="plan-pref-seg" id="prefThemeSeg">
          <button type="button" data-theme="day">日間</button>
          <button type="button" data-theme="night">夜間</button>
          <button type="button" data-theme="system" class="active">跟隨系統</button>
        </div>
      </div>

      <div class="plan-pref-actions">
        <button type="button" class="plan-pref-cancel" id="planPrefCancel">取消</button>
        <button type="button" class="plan-pref-save" id="planPrefSave">儲存</button>
      </div>
    </div>
  </div>

</body>
</html>
