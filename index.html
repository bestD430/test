<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>香港巴士到站時間</title>

<style>
:root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #111111;
    --sub: #666666;
    --line: #dddddd;
    --blue: #007aff;
    --red: #ff3b30;
    --green: #34c759;
    --orange: #ff9500;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    padding-bottom: 30px;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
}

/* Header */
.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(242,242,247,.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 14px 14px 10px;
}

.title {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
}

.subtitle {
    margin-top: 3px;
    text-align: center;
    color: var(--sub);
    font-size: 12px;
}

/* Card */
.card {
    margin: 8px 12px;
    padding: 14px;
    border-radius: 16px;
    background: var(--card);
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

/* Company */
.company-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 10px;
}

.company-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.company-btn {
    border: 0;
    border-radius: 12px;
    background: #eeeeee;
    padding: 11px 4px;
    font-weight: 600;
    font-size: 14px;
}

.company-btn.active {
    background: var(--blue);
    color: #fff;
}

/* Route input */
.route-row {
    display: flex;
    gap: 8px;
}

.route-input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 12px;
    background: #fff;
    font-size: 18px;
    text-transform: uppercase;
}

.route-search {
    width: 92px;
    border: 0;
    border-radius: 12px;
    background: var(--blue);
    color: #fff;
    font-weight: 700;
}

/* Keypad */
.keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    margin-top: 10px;
}

.key {
    border: 0;
    border-radius: 10px;
    padding: 9px 2px;
    background: #eeeeee;
    font-size: 15px;
    font-weight: 600;
}

.key:active {
    transform: scale(.96);
    background: #dddddd;
}

/* Results */
.result-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 8px;
}

.result-empty {
    color: var(--sub);
    text-align: center;
    padding: 12px 0;
    font-size: 14px;
}

.route-result {
    border: 0;
    width: 100%;
    text-align: left;
    background: #f7f7f7;
    border-radius: 12px;
    padding: 11px;
    margin-bottom: 7px;
}

.route-result:active {
    background: #e9e9e9;
}

.route-result-main {
    display: flex;
    align-items: center;
    gap: 9px;
}

.route-label {
    font-size: 22px;
    font-weight: 800;
}

.route-company {
    font-size: 12px;
    color: var(--sub);
}

.route-dest {
    margin-top: 3px;
    font-size: 14px;
    color: #333;
}

/* Stops */
.stop-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.stop-btn {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 11px 12px;
    background: #f7f7f7;
    text-align: left;
}

.stop-btn:active {
    background: #e7e7e7;
}

.stop-seq {
    display: inline-block;
    width: 32px;
    color: var(--sub);
    font-size: 12px;
}

.stop-name {
    font-size: 15px;
    font-weight: 600;
}

/* ETA */
.eta-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.eta-stop-name {
    font-size: 18px;
    font-weight: 800;
}

.refresh-btn {
    border: 0;
    border-radius: 10px;
    padding: 8px 10px;
    background: #eeeeee;
}

.eta-list {
    margin-top: 12px;
}

.eta-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding: 11px 0;
}

.eta-item:last-child {
    border-bottom: 0;
}

.eta-min {
    font-size: 25px;
    font-weight: 800;
}

.eta-text {
    color: var(--sub);
    font-size: 13px;
}

.eta-remark {
    color: var(--orange);
    font-size: 12px;
}

.loading {
    text-align: center;
    color: var(--sub);
    padding: 18px 0;
}

.error {
    color: var(--red);
    text-align: center;
    padding: 12px 0;
    font-size: 14px;
}

/* Direction */
.direction-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.direction-btn {
    flex: 1;
    border: 0;
    border-radius: 11px;
    background: #eeeeee;
    padding: 10px;
    font-weight: 600;
}

.direction-btn.active {
    background: var(--blue);
    color: #fff;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="title">香港巴士到站時間</div>
        <div class="subtitle">九巴・城巴・嶼巴・專線小巴・港鐵巴士</div>
    </div>

    <div class="card">

        <div class="company-title">選擇巴士公司</div>

        <div class="company-list">
            <button class="company-btn active" data-company="kmb" onclick="selectCompany('kmb')">九巴</button>
            <button class="company-btn" data-company="ctb" onclick="selectCompany('ctb')">城巴</button>
            <button class="company-btn" data-company="nlb" onclick="selectCompany('nlb')">嶼巴</button>
            <button class="company-btn" data-company="gmb" onclick="selectCompany('gmb')">專線小巴</button>
            <button class="company-btn" data-company="mtrbus" onclick="selectCompany('mtrbus')">港鐵巴士</button>
        </div>

    </div>

    <div class="card">

        <div class="company-title">輸入路線</div>

        <div class="route-row">
            <input
                id="routeInput"
                class="route-input"
                type="text"
                placeholder="例如 K1 / 1A / 1"
                autocomplete="off"
                autocapitalize="characters"
                onkeydown="if(event.key==='Enter') searchRoute()"
            >
            <button class="route-search" onclick="searchRoute()">搜尋</button>
        </div>

        <div class="keypad" id="keypad"></div>

    </div>

    <div class="card">

        <div class="result-title">路線</div>

        <div id="routeResults">
            <div class="result-empty">請先輸入路線</div>
        </div>

    </div>

    <div class="card hidden" id="directionCard">

        <div class="company-title">選擇方向</div>

        <div id="directionList" class="direction-row"></div>

    </div>

    <div class="card hidden" id="stopCard">

        <div class="company-title">選擇車站</div>

        <div id="stopList" class="stop-list"></div>

    </div>

    <div class="card hidden" id="etaCard">

        <div class="eta-header">
            <div id="etaStopName" class="eta-stop-name">到站時間</div>
            <button class="refresh-btn" onclick="loadETA()">重新整理</button>
        </div>

        <div id="etaList" class="eta-list"></div>

    </div>

</div>

<script>
'use strict';

/* =========================================================
   基本資料
========================================================= */

const LETTERS = [
    'A','B','C','D',
    'E','F','H','K',
    'M','N','P','R',
    'S','T','W','X'
];

const CO_NAMES = {
    kmb: '九巴',
    lwb: '龍運',
    ctb: '城巴',
    nlb: '嶼巴（大嶼山巴士）',
    gmb: '專線小巴',
    mtrbus: '港鐵巴士'
};

let state = {
    co: 'kmb',
    route: '',
    bound: '',
    serviceType: '',
    directionLabel: '',
    stopId: '',
    stopName: '',
    mtrRawStop: null,

    nlbRouteId: '',
    gmbRouteId: '',
    gmbRouteSeq: '',
    dirPath: ''
};

/* =========================================================
   初始化
========================================================= */

document.addEventListener('DOMContentLoaded', () => {
    buildKeypad();
    document.getElementById('routeInput').value = '';
});

/* =========================================================
   數字 / 字母鍵盤
========================================================= */

function buildKeypad() {
    const keypad = document.getElementById('keypad');
    keypad.innerHTML = '';

    LETTERS.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'key';
        btn.textContent = letter;
        btn.onclick = () => {
            const input = document.getElementById('routeInput');
            input.value += letter;
            input.focus();
        };
        keypad.appendChild(btn);
    });
}

/* =========================================================
   公司
========================================================= */

function selectCompany(co) {
    state.co = co;
    document.querySelectorAll('.company-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.company === co);
    });
    clearResults();
}

/* =========================================================
   清除
========================================================= */

function clearResults() {
    document.getElementById('routeResults').innerHTML =
        '<div class="result-empty">請輸入路線並搜尋</div>';
    document.getElementById('directionCard').classList.add('hidden');
    document.getElementById('stopCard').classList.add('hidden');
    document.getElementById('etaCard').classList.add('hidden');
}

/* =========================================================
   搜尋路線
========================================================= */

async function searchRoute() {
    const route = document
        .getElementById('routeInput')
        .value
        .trim()
        .toUpperCase();

    if (!route) {
        document.getElementById('routeResults').innerHTML =
            '<div class="result-empty">請輸入路線</div>';
        return;
    }

    state.route = route;

    const container = document.getElementById('routeResults');
    container.innerHTML = '<div class="loading">搜尋中…</div>';

    try {
        let results = [];

        if (state.co === 'kmb') {
            results = await searchKMB(route);
        } else if (state.co === 'ctb') {
            results = await searchCTB(route);
        } else if (state.co === 'nlb') {
            results = await searchNLB(route);
        } else if (state.co === 'gmb') {
            results = await searchGMB(route);
        } else if (state.co === 'mtrbus') {
            results = await searchMTRBus(route);
        }

        renderRouteResults(results);
    } catch (err) {
        console.error(err);
        container.innerHTML =
            `<div class="error">${escapeHTML(err.message || '搜尋失敗')}</div>`;
    }
}

/* =========================================================
   九巴 / 龍運
========================================================= */

async function searchKMB(route) {
    try {
        const res = await fetch('https://data.etagmb.gov.hk/route/route_list');
        if (!res.ok) throw new Error('KMB API 錯誤');

        const json = await res.json();
        const data = Array.isArray(json) ? json : (json.data || json.routes || []);

        return data
            .filter(r => String(r.route || r.routeName || r.route_code || '').toUpperCase() === route)
            .map(r => ({
                co: 'kmb',
                route: route,
                bound: r.bound || r.direction || '',
                serviceType: r.service_type || '1',
                label: route,
                sub: r.bound || '',
                dest: r.dest_tc || r.destination_tc || r.dest || ''
            }));
    } catch (e) {
        return [{
            co: 'kmb',
            route: route,
            bound: '',
            serviceType: '1',
            label: route,
            sub: '',
            dest: ''
        }];
    }
}

/* =========================================================
   城巴
========================================================= */

async function searchCTB(route) {
    const res = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route/ctb');
    if (!res.ok) throw new Error('無法取得城巴路線資料');

    const json = await res.json();
    const data = json.data || [];

    return data
        .filter(r => String(r.route || '').toUpperCase() === route)
        .map(r => ({
            co: 'ctb',
            route: route,
            bound: r.bound || '',
            serviceType: r.service_type || '',
            label: route,
            sub: r.bound || '',
            dest: r.dest_tc || ''
        }));
}

/* =========================================================
   嶼巴
========================================================= */

async function searchNLB(route) {
    try {
        const res = await fetch('https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list');
        if (!res.ok) throw new Error('無法取得嶼巴路線資料');

        const json = await res.json();
        const data = json.routes || json.data || [];

        return data
            .filter(r => String(r.routeNo || r.route || r.route_no || '').toUpperCase() === route)
            .map(r => ({
                co: 'nlb',
                route: route,
                bound: r.bound || r.direction || '',
                serviceType: r.serviceType || '1',
                label: route,
                sub: r.bound || r.direction || '',
                dest: r.destination || r.dest || r.dest_tc || '',
                nlbRouteId: r.routeId || r.route_id || ''
            }));
    } catch (e) {
        return [{
            co: 'nlb',
            route: route,
            bound: '',
            serviceType: '1',
            label: route,
            sub: '',
            dest: ''
        }];
    }
}

/* =========================================================
   專線小巴
========================================================= */

async function searchGMB(route) {
    return [{
        co: 'gmb',
        route: route,
        bound: '',
        serviceType: '1',
        label: route,
        sub: '',
        dest: '',
        gmbRouteId: '',
        gmbRouteSeq: ''
    }];
}

/* =========================================================
   港鐵巴士
========================================================= */

async function searchMTRBus(route) {
    if (!/^K\d/i.test(route)) {
        return [];
    }

    return [{
        co: 'mtrbus',
        route: route,
        bound: 'O',
        serviceType: '1',
        label: route,
        sub: '港鐵巴士',
        dest: '雙向 / 環線'
    }];
}

/* =========================================================
   顯示路線
========================================================= */

function renderRouteResults(results) {
    const container = document.getElementById('routeResults');
    container.innerHTML = '';

    if (!results || !results.length) {
        container.innerHTML = '<div class="result-empty">找不到此路線</div>';
        return;
    }

    results.forEach((r) => {
        const btn = document.createElement('button');
        btn.className = 'route-result';
        btn.innerHTML = `
            <div class="route-result-main">
                <span class="route-label">${escapeHTML(r.label)}</span>
                <span class="route-company">${escapeHTML(CO_NAMES[r.co] || '')}</span>
            </div>
            <div class="route-dest">${escapeHTML(r.dest || r.sub || '')}</div>
        `;

        btn.onclick = () => selectRoute(r);
        container.appendChild(btn);
    });
}

/* =========================================================
   選擇路線
========================================================= */

async function selectRoute(r) {
    state.co = r.co;
    state.route = r.route || r.label;
    state.bound = r.bound || '';
    state.serviceType = r.serviceType || '1';
    state.directionLabel = r.sub || '';
    state.nlbRouteId = r.nlbRouteId || '';
    state.gmbRouteId = r.gmbRouteId || '';
    state.gmbRouteSeq = r.gmbRouteSeq || '';

    document.getElementById('directionCard').classList.add('hidden');
    document.getElementById('stopCard').classList.add('hidden');
    document.getElementById('etaCard').classList.add('hidden');

    try {
        let stops = [];
        if (state.co === 'mtrbus') {
            stops = await loadStopsMTRBus();
        } else if (state.co === 'kmb') {
            stops = await loadStopsKMB();
        } else if (state.co === 'ctb') {
            stops = await loadStopsCTB();
        } else if (state.co === 'nlb') {
            stops = await loadStopsNLB();
        } else if (state.co === 'gmb') {
            stops = await loadStopsGMB();
        }

        renderStops(stops);
    } catch (err) {
        console.error(err);
        document.getElementById('stopCard').classList.remove('hidden');
        document.getElementById('stopList').innerHTML =
            `<div class="error">${escapeHTML(err.message || '無法取得車站資料')}</div>`;
    }
}

/* =========================================================
   港鐵巴士：取得車站 (精準解析 busStopNameTC)
========================================================= */

async function loadStopsMTRBus() {
    const res = await fetch(
        'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule',
        {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                language: 'zh',
                routeName: state.route
            })
        }
    );

    if (!res.ok) {
        throw new Error('無法取得港鐵巴士車站資料');
    }

    const json = await res.json();
    const busStops = json.busStop || [];

    if (json.routeStatus === '3' || !busStops.length) {
        throw new Error(json.routeStatusRemarkTitle || '此路線暫停服務或查無車站資料');
    }

    return busStops.map((s, i) => {
        const id = s.busStopId || s.stopId || String(i + 1);
        const name = s.busStopNameTC || s.busStopName_tc || s.busStopName || `車站 ${id}`;

        return {
            seq: i + 1,
            stopId: String(id),
            name: String(name).trim(),
            raw: s
        };
    });
}

/* =========================================================
   其他公司車站
========================================================= */

async function loadStopsKMB() {
    try {
        const res = await fetch(`https://data.etagmb.gov.hk/route-stop/${encodeURIComponent(state.route)}`);
        if (!res.ok) throw new Error('無法取得九巴車站資料');

        const json = await res.json();
        const data = json.data || json.route_stops || [];

        return data.map((s, i) => ({
            seq: i + 1,
            stopId: s.stop || s.stop_id || String(i + 1),
            name: s.stop_name_tc || s.name_tc || s.stopName || '車站 ' + (i + 1),
            raw: s
        }));
    } catch (e) {
        throw new Error('無法取得九巴車站資料');
    }
}

async function loadStopsCTB() {
    const url = 'https://rt.data.gov.hk/v2/transport/citybus/route-stop/ctb/' +
        encodeURIComponent(state.route) + '/outbound';

    const res = await fetch(url);
    if (!res.ok) throw new Error('無法取得城巴車站資料');

    const json = await res.json();
    const data = json.data || [];

    return data.map((s, i) => ({
        seq: i + 1,
        stopId: s.stop || s.stop_id || String(i + 1),
        name: s.stop_name_tc || s.name_tc || s.stopName || '車站 ' + (i + 1),
        raw: s
    }));
}

async function loadStopsNLB() {
    try {
        const res = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list`);
        if (!res.ok) throw new Error('無法取得嶼巴車站資料');

        const json = await res.json();
        const data = json.stops || json.data || [];

        return data.map((s, i) => ({
            seq: i + 1,
            stopId: s.stopId || s.stop_id || String(i + 1),
            name: s.stopName_c || s.stopName_tc || s.name_tc || '車站 ' + (i + 1),
            raw: s
        }));
    } catch (e) {
        throw new Error('無法取得嶼巴車站資料');
    }
}

async function loadStopsGMB() {
    return [];
}

/* =========================================================
   顯示車站
========================================================= */

function renderStops(stops) {
    const card = document.getElementById('stopCard');
    const list = document.getElementById('stopList');

    card.classList.remove('hidden');
    list.innerHTML = '';

    if (!stops || !stops.length) {
        list.innerHTML = '<div class="result-empty">沒有車站資料</div>';
        return;
    }

    stops.forEach((s, index) => {
        const btn = document.createElement('button');
        btn.className = 'stop-btn';
        btn.innerHTML = `
            <span class="stop-seq">${escapeHTML(String(s.seq || index + 1))}</span>
            <span class="stop-name">${escapeHTML(s.name)}</span>
        `;
        btn.onclick = () => selectStop(s);
        list.appendChild(btn);
    });
}

/* =========================================================
   選擇車站
========================================================= */

async function selectStop(s) {
    state.stopId = String(s.stopId || '');
    state.stopName = s.name || '車站';
    state.mtrRawStop = s.raw || null;

    document.getElementById('etaStopName').textContent = state.stopName;
    document.getElementById('etaCard').classList.remove('hidden');

    await loadETA();
}

/* =========================================================
   ETA
========================================================= */

async function loadETA() {
    const list = document.getElementById('etaList');
    list.innerHTML = '<div class="loading">載入到站時間…</div>';

    try {
        let etas = [];

        if (state.co === 'mtrbus') {
            etas = await etaMTRBus();
        } else if (state.co === 'kmb') {
            etas = await etaKMB();
        } else if (state.co === 'ctb') {
            etas = await etaCTB();
        } else if (state.co === 'nlb') {
            etas = await etaNLB();
        } else if (state.co === 'gmb') {
            etas = await etaGMB();
        }

        renderETA(etas);
    } catch (err) {
        console.error(err);
        list.innerHTML = `<div class="error">${escapeHTML(err.message || '無法取得到站時間')}</div>`;
    }
}

/* =========================================================
   港鐵巴士 ETA
========================================================= */

async function etaMTRBus() {
    const res = await fetch(
        'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule',
        {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                language: 'zh',
                routeName: state.route
            })
        }
    );

    if (!res.ok) throw new Error('無法取得港鐵巴士到站時間');

    const json = await res.json();

    let stop = (json.busStop || []).find(
        s => String(s.busStopId || s.stopId || '') === String(state.stopId)
    );

    if (!stop) stop = state.mtrRawStop;
    if (!stop) return [];

    return (stop.bus || []).map(b => {
        const sec = parseInt(b.arrivalTimeInSecond, 10);
        return {
            eta: new Date(Date.now() + (isNaN(sec) ? 0 : sec * 1000)).toISOString(),
            rmk: b.arrivalTimeText || ''
        };
    });
}

async function etaKMB() { return []; }
async function etaCTB() { return []; }
async function etaNLB() { return []; }
async function etaGMB() { return []; }

/* =========================================================
   顯示 ETA
========================================================= */

function renderETA(etas) {
    const list = document.getElementById('etaList');
    list.innerHTML = '';

    if (!etas || !etas.length) {
        list.innerHTML = '<div class="result-empty">暫時沒有到站資料</div>';
        return;
    }

    etas.forEach(item => {
        const row = document.createElement('div');
        row.className = 'eta-item';

        const diff = Math.max(0, Math.round((new Date(item.eta).getTime() - Date.now()) / 60000));

        row.innerHTML = `
            <div>
                <div class="eta-min">${diff === 0 ? '即將到站' : diff + ' 分鐘'}</div>
                ${item.rmk ? `<div class="eta-remark">${escapeHTML(item.rmk)}</div>` : ''}
            </div>
            <div class="eta-text">${formatTime(item.eta)}</div>
        `;

        list.appendChild(row);
    });
}

/* =========================================================
   通用工具
========================================================= */

function escapeHTML(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
}
