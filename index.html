<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港巴士到站時間</title>
  <style>
    :root {
      --primary: #00A0E9;
      --primary-dark: #0088cc;
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #e5e5ea;
      --green: #34c759;
      --amber: #ff9500;
      --red: #ff3b30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }

    /* Header */
    .header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 14px 16px 12px;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: 1px;
    }

    /* Search input area */
    .search-box {
      background: white;
      padding: 12px 16px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.2rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #fafafa;
      font-family: inherit;
      letter-spacing: 1px;
      text-align: center;
      font-weight: 600;
    }
    .search-input:focus { border-color: var(--primary); background: white; }
    .search-input::placeholder { color: #c7c7cc; font-weight: 400; letter-spacing: 0; }

    /* Keypad 樣式校正 */
    .keypad {
      flex-shrink: 0;
      background: #5a6570;
      padding: 8px 6px 10px;
      user-select: none;
      position: relative;
      z-index: 10;
    }
    .key-row {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
      justify-content: center;
    }
    .key-row:last-child { margin-bottom: 0; }
    .key {
      flex: 1;
      max-width: 72px;
      height: 44px;
      border: none;
      border-radius: 8px;
      background: white;
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      transition: background 0.08s, transform 0.05s;
    }
    .key:active {
      background: #d1d1d6;
      transform: scale(0.96);
    }
    .key-letter {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1rem;
      background: #d8dce0;
      color: #1c1c1e;
    }
    .key-letter:active { background: #b0b6bc; }
    .key-func {
      background: #8e99a4;
      color: white;
      font-size: 1.1rem;
    }
    .key-func:active { background: #6d7883; }
    .keypad-main {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .num-pad {
      flex: 1.15;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .letter-pad {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Results list */
    .results {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .result-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 12px;
      transition: background 0.1s;
    }
    .result-item:active { background: #f2f2f7; }
    
    .result-num {
      font-size: 1.5rem;
      font-weight: 700;
      min-width: 68px;
      text-align: center;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    
    /* 路線牌 house color */
    .plate-kmb { background: #E4002B; color: #fff; }          /* 九巴紅 */
    .plate-lwb { background: #F15A22; color: #fff; }          /* 龍運橙 */
    .plate-ctb { background: #FFD100; color: #1a1a1a; }       /* 城巴黃 */
    .plate-nlb { background: #007A3D; color: #fff; }          /* 嶼巴綠 */
    .plate-gmb { background: #00A651; color: #fff; }          /* 小巴綠 */
    .plate-mtrbus { background: #0077C8; color: #fff; }       /* 港鐵藍 */

    .result-info { flex: 1; min-width: 0; }
    .result-dest {
      font-size: 0.98rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-co {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .result-arrow {
      color: #c7c7cc;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .empty-state, .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Sub pages */
    .page { display: none; flex-direction: column; height: 100%; }
    .page.active { display: flex; }

    .page-header {
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 8px;
      flex-shrink: 0;
      gap: 4px;
    }
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      padding: 4px 12px;
      cursor: pointer;
      line-height: 1;
    }
    .page-title {
      flex: 1;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .stop-list, .eta-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .stop-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stop-item:active { background: #f2f2f7; }
    .stop-seq {
      font-size: 0.85rem;
      color: var(--muted);
      min-width: 28px;
      font-weight: 600;
    }
    .stop-name { font-size: 0.98rem; font-weight: 500; flex: 1; }

    /* ETA board */
    .eta-header-info {
      background: #1c1c1e;
      color: white;
      padding: 16px;
    }
    .eta-route-num {
      font-size: 2rem;
      font-weight: 700;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      line-height: 1.1;
    }
    .eta-route-num.plate-kmb { background: #E4002B; color: #fff; }
    .eta-route-num.plate-lwb { background: #F15A22; color: #fff; }
    .eta-route-num.plate-ctb { background: #FFD100; color: #1a1a1a; }
    .eta-dest-text { font-size: 0.95rem; color: #aeaeb2; margin-top: 6px; }
    .eta-stop-text { font-size: 1.1rem; font-weight: 600; margin-top: 8px; color: #fff; }
    
    .eta-rows { padding: 8px 0; }
    .eta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .eta-mins {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--green);
    }
    .eta-mins.soon { color: var(--amber); }
    .eta-mins.arrived { color: var(--red); }
    .eta-clock {
      font-size: 0.88rem;
      color: var(--muted);
      text-align: right;
    }
    .eta-toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: white;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .eta-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #f2f2f7;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .eta-btn.active-refresh {
      background: var(--primary);
      color: white;
    }

    .fav-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
      color: #c7c7cc;
    }
    .fav-btn.on { color: #ff9500; }
  </style>
</head>
<body>
  <div class="app">

    <!-- PAGE: SEARCH -->
    <div class="page active" id="pageSearch">
      <div class="header">香港巴士到站時間</div>
      <div class="search-box">
        <input type="text" class="search-input" id="routeInput" placeholder="輸入路線號碼" readonly inputmode="none">
      </div>
      <div class="keypad" id="keypad">
        <div class="keypad-main">
          <div class="num-pad">
            <div class="key-row">
              <button class="key" data-k="1">1</button>
              <button class="key" data-k="2">2</button>
              <button class="key" data-k="3">3</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="4">4</button>
              <button class="key" data-k="5">5</button>
              <button class="key" data-k="6">6</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="7">7</button>
              <button class="key" data-k="8">8</button>
              <button class="key" data-k="9">9</button>
            </div>
            <div class="key-row">
              <button class="key key-func" data-k="clear">✕</button>
              <button class="key" data-k="0">0</button>
              <button class="key key-func" data-k="back">⌫</button>
            </div>
          </div>
          <div class="letter-pad" id="letterKeys">
            <div class="key-row">
              <button class="key key-letter" data-k="A">A</button>
              <button class="key key-letter" data-k="B">B</button>
              <button class="key key-letter" data-k="C">C</button>
              <button class="key key-letter" data-k="D">D</button>
            </div>
            <div class="key-row">
              <button class="key key-letter" data-k="E">E</button>
              <button class="key key-letter" data-k="F">F</button>
              <button class="key key-letter" data-k="H">H</button>
              <button class="key key-letter" data-k="K">K</button>
            </div>
            <div class="key-row">
              <button class="key key-letter" data-k="M">M</button>
              <button class="key key-letter" data-k="N">N</button>
              <button class="key key-letter" data-k="P">P</button>
              <button class="key key-letter" data-k="R">R</button>
            </div>
            <div class="key-row">
              <button class="key key-letter" data-k="S">S</button>
              <button class="key key-letter" data-k="T">T</button>
              <button class="key key-letter" data-k="W">W</button>
              <button class="key key-letter" data-k="X">X</button>
            </div>
          </div>
        </div>
      </div>
      <div class="results" id="results">
        <div class="empty-state">輸入路線號碼開始搜尋</div>
      </div>
    </div>

    <!-- PAGE: STOPS -->
    <div class="page" id="pageStops">
      <div class="page-header">
        <button class="back-btn" onclick="goSearch()">‹</button>
        <div class="page-title" id="stopsTitle">選擇車站</div>
      </div>
      <div class="stop-list" id="stopList">
        <div class="loading-state">載入車站中...</div>
      </div>
    </div>

    <!-- PAGE: ETA -->
    <div class="page" id="pageEta">
      <div class="page-header">
        <button class="back-btn" onclick="goStops()">‹</button>
        <div class="page-title">預計到站</div>
      </div>
      <div class="eta-area" id="etaArea">
        <div class="eta-header-info">
          <div class="eta-route-num" id="etaRoute">—</div>
          <div class="eta-dest-text" id="etaDest">—</div>
          <div class="eta-stop-text" id="etaStopName">—</div>
        </div>
        <div class="eta-rows" id="etaRows"></div>
      </div>
      <div class="eta-toolbar">
        <button class="eta-btn" onclick="fetchETA()">🔄 刷新</button>
        <button class="eta-btn" id="btnAuto" onclick="toggleAuto()">▶ 自動刷新</button>
      </div>
    </div>

  </div>

  <script>
    // 全域快取，大幅提速
    let routesCache = { kmb: [], ctb: [] };
    let isDataLoaded = false;

    let inputVal = '';
    let state = {
      co: null, route: null, bound: null, serviceType: '1',
      stopId: null, stopName: null, auto: false, timer: null
    };

    // 初始化與預先載入路線數據 (背景非同步載入)
    window.addEventListener('DOMContentLoaded', () => {
      initKeypad();
      preloadAllRoutes();
    });

    async function preloadAllRoutes() {
      try {
        const [kmbRes, ctbRes] = await Promise.all([
          fetch('https://data.etabus.gov.hk/v1/transport/kmb/route/').then(r => r.json()).catch(() => ({data:[]})),
          fetch('https://data.etabus.gov.hk/v1/transport/citybus-nwfb/route/ctb').then(r => r.json()).catch(() => ({data:[]}))
        ]);

        routesCache.kmb = kmbRes.data || [];
        routesCache.ctb = ctbRes.data || [];
        isDataLoaded = true;
      } catch (e) {
        console.error("預載路線失敗:", e);
      }
    }

    // 事件委派：綁定鍵盤點擊事件
    function initKeypad() {
      document.getElementById('keypad').addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const key = btn.dataset.k;

        if (key === 'clear') {
          inputVal = '';
        } else if (key === 'back') {
          inputVal = inputVal.slice(0, -1);
        } else if (key && inputVal.length < 6) {
          inputVal += key;
        }

        document.getElementById('routeInput').value = inputVal;
        onSearchInput();
      });
    }

    // 搜尋觸發邏輯 (記憶體高快取比對)
    function onSearchInput() {
      const resultsEl = document.getElementById('results');
      if (!inputVal) {
        resultsEl.innerHTML = '<div class="empty-state">輸入路線號碼開始搜尋</div>';
        return;
      }

      const q = inputVal.trim().toUpperCase();
      let matched = [];

      // 1. KMB 搜尋
      routesCache.kmb.forEach(r => {
        if (r.route === q) {
          matched.push({
            co: 'kmb',
            route: r.route,
            bound: r.bound,
            serviceType: r.service_type,
            dest: r.dest_tc
          });
        }
      });

      // 2. CTB 搜尋
      routesCache.ctb.forEach(r => {
        if (r.route === q) {
          matched.push({
            co: 'ctb',
            route: r.route,
            bound: 'inbound', // 預設值，後續帶入車站
            dest: r.dest_tc
          });
        }
      });

      renderSearchResults(matched);
    }

    function renderSearchResults(list) {
      const resultsEl = document.getElementById('results');
      resultsEl.innerHTML = '';

      if (list.length === 0) {
        resultsEl.innerHTML = '<div class="empty-state">' + (isDataLoaded ? '未找到相關路線' : '資料載入中，請稍後...') + '</div>';
        return;
      }

      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'result-item';
        const plate = 'plate-' + item.co;
        const coName = item.co === 'kmb' ? '九巴' : '城巴';

        div.innerHTML = `
          <div class="result-num ${plate}">${item.route}</div>
          <div class="result-info">
            <div class="result-dest">往 ${item.dest}</div>
            <div class="result-co">${coName}</div>
          </div>
          <div class="result-arrow">›</div>
        `;

        div.addEventListener('click', () => selectRoute(item));
        resultsEl.appendChild(div);
      });
    }

    // 選擇路線 -> 顯示車站列表
    async function selectRoute(item) {
      state.co = item.co;
      state.route = item.route;
      state.bound = item.bound;
      state.serviceType = item.serviceType || '1';

      switchPage('pageStops');
      document.getElementById('stopsTitle').textContent = `${item.route} - 選擇車站`;
      const stopListEl = document.getElementById('stopList');
      stopListEl.innerHTML = '<div class="loading-state">載入車站中...</div>';

      try {
        let stops = [];
        if (state.co === 'kmb') {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${state.route}/${state.bound === 'O' ? 'outbound' : 'inbound'}/${state.serviceType}`).then(r => r.json());
          
          // 取得站名詳情
          const stopDetails = await Promise.all(res.data.map(s => 
            fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${s.stop}`).then(r => r.json())
          ));

          stops = res.data.map((s, idx) => ({
            seq: s.seq,
            stopId: s.stop,
            name: stopDetails[idx].data.name_tc
          }));
        } else if (state.co === 'ctb') {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/citybus-nwfb/route-stop/ctb/${state.route}/outbound`).then(r => r.json());
          
          const stopDetails = await Promise.all(res.data.map(s => 
            fetch(`https://data.etabus.gov.hk/v1/transport/citybus-nwfb/stop/${s.stop}`).then(r => r.json())
          ));

          stops = res.data.map((s, idx) => ({
            seq: s.seq,
            stopId: s.stop,
            name: stopDetails[idx].data.name_tc
          }));
        }

        renderStops(stops);
      } catch (e) {
        stopListEl.innerHTML = '<div class="loading-state">無法取得車站清單</div>';
      }
    }

    function renderStops(stops) {
      const stopListEl = document.getElementById('stopList');
      stopListEl.innerHTML = '';

      stops.forEach(s => {
        const div = document.createElement('div');
        div.className = 'stop-item';
        div.innerHTML = `
          <div class="stop-seq">${s.seq}</div>
          <div class="stop-name">${s.name}</div>
          <div class="result-arrow">›</div>
        `;
        div.addEventListener('click', () => selectStop(s));
        stopListEl.appendChild(div);
      });
    }

    // 選擇車站 -> 查看 ETA 到站時間
    function selectStop(stop) {
      state.stopId = stop.stopId;
      state.stopName = stop.name;

      switchPage('pageEta');
      const etaRoute = document.getElementById('etaRoute');
      etaRoute.textContent = state.route;
      etaRoute.className = `eta-route-num plate-${state.co}`;
      document.getElementById('etaStopName').textContent = state.stopName;

      fetchETA();
    }

    // 極速取得 ETA 到站時間
    async function fetchETA() {
      const rowsEl = document.getElementById('etaRows');
      rowsEl.innerHTML = '<div class="loading-state">更新到站時間...</div>';

      try {
        let url = '';
        if (state.co === 'kmb') {
          url = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${state.stopId}/${state.route}/${state.serviceType}`;
        } else {
          url = `https://data.etabus.gov.hk/v1/transport/citybus-nwfb/eta/ctb/${state.stopId}/${state.route}`;
        }

        const res = await fetch(url).then(r => r.json());
        const etas = res.data || [];

        rowsEl.innerHTML = '';
        if (etas.length === 0) {
          rowsEl.innerHTML = '<div class="loading-state">暫無到站班次</div>';
          return;
        }

        etas.slice(0, 3).forEach(item => {
          if (!item.eta) return;

          const etaTime = new Date(item.eta);
          const diffMins = Math.round((etaTime - new Date()) / 60000);

          let minsText = '';
          let colorClass = '';

          if (diffMins <= 0) {
            minsText = '即將到站 / 已到達';
            colorClass = 'arrived';
          } else {
            minsText = `${diffMins} 分鐘`;
            if (diffMins <= 3) colorClass = 'soon';
          }

          const timeStr = etaTime.toTimeString().substring(0, 5);

          const row = document.createElement('div');
          row.className = 'eta-row';
          row.innerHTML = `
            <div class="eta-mins ${colorClass}">${minsText}</div>
            <div class="eta-clock">預計 ${timeStr}</div>
          `;
          rowsEl.appendChild(row);
        });

      } catch (e) {
        rowsEl.innerHTML = '<div class="loading-state">無法載入到站時間</div>';
      }
    }

    // 自動刷新切換
    function toggleAuto() {
      state.auto = !state.auto;
      const btn = document.getElementById('btnAuto');

      if (state.auto) {
        btn.classList.add('active-refresh');
        btn.textContent = '⏸ 停止自動刷新';
        state.timer = setInterval(fetchETA, 10000); // 10秒自動更新
      } else {
        btn.classList.remove('active-refresh');
        btn.textContent = '▶ 自動刷新';
        clearInterval(state.timer);
      }
    }

    // 頁面切換控制
    function switchPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');

      if (pageId !== 'pageEta' && state.timer) {
        clearInterval(state.timer);
        state.auto = false;
        document.getElementById('btnAuto').classList.remove('active-refresh');
        document.getElementById('btnAuto').textContent = '▶ 自動刷新';
      }
    }

    function goSearch() { switchPage('pageSearch'); }
    function goStops() { switchPage('pageStops'); }
  </script>
</body>
</html>
