        if (res.ok) {
          const j = await res.json();
          if (j) return j;
        }
      } catch (e) {
        console.warn('GMB direct failed', e.message || e);
      }
      try {
        const proxy = 'https://r.jina.ai/' + url;
        const res = await fetch(proxy, { cache: 'no-store' });
        const text = await res.text();
        // jina 回傳可能夾雜 Markdown，抽出 JSON
        const m = text.match(/\{[\s\S]*\}/);
        if (m) return JSON.parse(m[0]);
      } catch (e) {
        console.warn('GMB proxy failed', e.message || e);
      }
      return null;
    }

    function gmbItemsFromStatic(code) {
      const found = [];
      const list = (typeof GMB_STATIC !== 'undefined' ? GMB_STATIC : []).filter(
        x => String(x.r || '').toUpperCase() === code
      );
      list.forEach(rd => {
        const desc = (rd.desc && String(rd.desc).trim() && !/^正常班次/.test(rd.desc))
          ? String(rd.desc).trim() : '';
        const dirs = (rd.dirs && rd.dirs.length) ? rd.dirs : [{ s: 1, o: '', d: code }];
        dirs.forEach(d => {
          const bound = d.s === 1 ? 'out' : 'in';
          found.push({
            route: code,
            co: 'gmb',
            region: rd.g,
            bound,
            gmbRouteId: rd.id,
            gmbRouteSeq: d.s || (bound === 'out' ? 1 : 2),
            needsDetail: false,
            orig: d.o || '',
            dest: d.d || '',
            gmbDesc: desc,
            directions: dirs.map(x => ({
              bound: x.s === 1 ? 'out' : 'in',
              orig: x.o || '',
              dest: x.d || '',
              route_seq: x.s
            }))
          });
        });
      });
      return found;
    }

    async function fetchGmbOnDemand(routeCode) {
      const code = String(routeCode || '').toUpperCase().trim();
      if (!code) return [];
      const cached = gmbCache.get(code);
      if (cached && cached.items.length && (Date.now() - cached.ts < 30 * 60 * 1000)) {
        return cached.items.slice();
      }
      // 完全本機靜態資料，不依賴網絡／CORS
      const found = gmbItemsFromStatic(code);
      if (found.length) {
        gmbCache.set(code, { items: found, ts: Date.now() });
      }
      return found.slice();
    }

    function sortSearchMatches(matches, query) {
      matches.sort((a, b) => {
        const aExact = a.route.toUpperCase() === query ? 0 : 1;
        const bExact = b.route.toUpperCase() === query ? 0 : 1;
        if (aExact !== bExact) return aExact - bExact;
        if (aExact === 0 && bExact === 0) {
          const aG = a.co === 'gmb' ? 0 : 1;
          const bG = b.co === 'gmb' ? 0 : 1;
          if (aG !== bG) return aG - bG;
        }
        const cmp = a.route.localeCompare(b.route, 'en', { numeric: true });
        if (cmp !== 0) return cmp;
        if (a.bound === 'out' && b.bound === 'in') return -1;
        if (a.bound === 'in' && b.bound === 'out') return 1;
        if (a.co === 'gmb' && b.co === 'gmb') {
          return (a.region || '').localeCompare(b.region || '');
        }
        return 0;
      });
      return matches;
    }

    function gmbPlaceholdersFromIndex(query) {
      if (typeof GMB_INDEX === 'undefined' || !GMB_INDEX[query]) return [];
      return GMB_INDEX[query].map(region => ({
        route: query,
        co: 'gmb',
        region,
        bound: 'out',
        needsDetail: true,
        orig: '',
        dest: '',
        gmbRouteId: null,
        gmbRouteSeq: 1
      }));
    }

    function collectLocalMatches(query) {
      let matches = routesLoaded
        ? ALL_ROUTES.filter(r => r.route.toUpperCase().startsWith(query))
        : [];
      // 去掉未完成的 exact 小巴，稍後用 live / index 補上
      matches = matches.filter(m => !(m.co === 'gmb' && m.route.toUpperCase() === query));
      const cached = gmbCache.get(query);
      if (cached && cached.items && cached.items.length) {
        matches = cached.items.concat(matches);
      } else {
        matches = gmbPlaceholdersFromIndex(query).concat(matches);
      }
      return sortSearchMatches(matches, query).slice(0, 50);
    }

    let gmbSearchTimer = null;

    function searchRoute(val) {
      const el = document.getElementById('results');
      const query = val.trim().toUpperCase();
      searchSeq++;
      el.innerHTML = '';
      if (!query) { renderHome(); return; }

      // 本機巴士路線 + 內建小巴靜態資料（file:// 無需 API）
      let matches = routesLoaded
        ? ALL_ROUTES.filter(r => r.route.toUpperCase().startsWith(query))
        : [];
      matches = matches.filter(m => !(m.co === 'gmb' && m.route.toUpperCase() === query));
      const gmbLive = gmbItemsFromStatic(query);
      if (gmbLive.length) matches = gmbLive.concat(matches);
      matches = sortSearchMatches(matches, query).slice(0, 50);

      if (matches.length === 0) {
        el.innerHTML = `<div class="empty-state">找不到「${query}」路線<br><small style="opacity:.7">小巴請輸入完整號碼（如 26、46、16A）</small></div>`;
        return;
      }
      renderSearchResultList(el, matches, query, matches.length >= 50);
    }

    function renderSearchResultList(el, matches, query, truncated) {
      let gmbSectionAdded = false;
      let otherSectionAdded = false;
      const frag = document.createDocumentFragment();
      matches.forEach(item => {
        if (item.co === 'gmb' && !gmbSectionAdded) {
          const t = document.createElement('div');
          t.className = 'section-title';
          t.innerHTML = '<span>專線小巴</span>';
          frag.appendChild(t);
          gmbSectionAdded = true;
        }
        if (item.co !== 'gmb' && gmbSectionAdded && !otherSectionAdded) {
          const t = document.createElement('div');
          t.className = 'section-title';
          t.innerHTML = '<span>巴士／其他</span>';
          frag.appendChild(t);
          otherSectionAdded = true;
        }

        const div = document.createElement('div');
        div.className = 'result-item';
        const plate = plateClass(item);

        let destText, coText;
        if (item.co === 'gmb') {
          const regionLabel = { HKI: '港島', KLN: '九龍', NT: '新界' }[item.region] || item.region || '';
          if (item.dest) {
            destText = `往 ${item.dest}`;
          } else if (item.orig) {
            destText = `往 ${item.orig}`;
          } else {
            destText = regionLabel ? `專線小巴 · ${regionLabel}` : '專線小巴';
          }
          const desc = item.gmbDesc ? ` · ${item.gmbDesc}` : '';
          coText = regionLabel
            ? `專線小巴 · ${regionLabel}${desc}`
            : `專線小巴${desc}`;
        } else if (item.co === 'mtrbus') {
          destText = item.dest ? `往 ${item.dest}` : (item.orig || '港鐵巴士');
          coText = item.orig && item.dest
            ? `${item.orig} · 港鐵巴士`
            : '港鐵巴士';
        } else {
          if (item.dest) {
            destText = `往 ${item.dest}`;
            coText = item.orig
              ? `${item.orig} · ${CO_NAMES[item.co] || item.co}`
              : (CO_NAMES[item.co] || item.co);
          } else if (item.orig) {
            destText = `往 ${item.orig}`;
            coText = CO_NAMES[item.co] || item.co;
          } else {
            destText = '—';
            coText = CO_NAMES[item.co] || item.co;
          }
        }

        div.innerHTML = `
          <div class="result-num ${plate}">${item.route}</div>
          <div class="result-info">
            <div class="result-dest">${destText}</div>
            <div class="result-co">${coText}</div>
          </div>
          <div class="result-arrow">›</div>
        `;

        if ((item.co === 'kmb' || item.co === 'lwb' || item.co === 'ctb') && item.bound) {
          div.addEventListener('click', () => {
            selectRouteDirection(
              item.route, item.co, item.bound, item.dest,
              null, null, null, item.service_type || '1', null
            );
          });
        } else if (item.co === 'gmb') {
          div.addEventListener('click', async () => {
            // 已有完整資料 → 直接入站
            if (item.gmbRouteId && item.dest) {
              selectRouteDirection(
                item.route, item.co, item.bound || 'out', item.dest,
                item.region, item.gmbRouteId,
                item.gmbRouteSeq || (item.bound === 'in' ? 2 : 1),
                '1', null
              );
              return;
            }
            // 否則先拉詳情再進入
            el.innerHTML = '<div class="loading-state">載入小巴路線中...</div>';
            try {
              const live = await fetchGmbOnDemand(item.route);
              const same = live.filter(g =>
                (!item.region || g.region === item.region) &&
                (!item.bound || g.bound === item.bound)
              );
              const pick = same[0] || live[0];
              if (pick && pick.gmbRouteId) {
                selectRouteDirection(
                  pick.route, 'gmb', pick.bound || 'out', pick.dest || pick.route,
                  pick.region, pick.gmbRouteId, pick.gmbRouteSeq || 1, '1', null
                );
              } else if (live.length) {
                // 多區結果：回到搜尋列表展示
                renderSearchResultList(el, live, item.route, false);
              } else {
                el.innerHTML = `<div class="empty-state">無法載入小巴 ${item.route}<br><small>請檢查網絡後再試</small></div>`;
              }
            } catch (e) {
              console.warn(e);
              el.innerHTML = `<div class="empty-state">載入小巴失敗<br><small>${e.message || ''}</small></div>`;
            }
          });
        } else if (item.co === 'mtrbus') {
          div.addEventListener('click', () => {
            selectRouteDirection(
              item.route, item.co, item.bound || 'out', item.dest || item.route,
              null, null, null, '1', null
            );
          });
        } else if (item.co === 'nlb' && item.nlbRouteId) {
          div.addEventListener('click', () => {
            selectRouteDirection(
              item.route, item.co, 'out', item.dest || item.route,
              null, null, null, '1', item.nlbRouteId
            );
          });
        } else {
          div.addEventListener('click', () => expandRouteDirections(item));
        }
        frag.appendChild(div);
      });

      el.appendChild(frag);
      if (truncated) {
        const tip = document.createElement('div');
        tip.className = 'empty-state';
        tip.style.padding = '16px';
        tip.innerHTML = `<small style="opacity:.7">結果過多，僅顯示前 50 筆<br>請輸入更完整路線號以縮小範圍</small>`;
        el.appendChild(tip);
      }
    }

    async function expandRouteDirections(item) {
      if (item.co === 'nlb' && item.nlbRouteId) {
        selectRouteDirection(
          item.route, item.co, 'out', item.dest || item.route,
          null, null, null, '1', item.nlbRouteId
        );
        return;
      }
      if (item.co === 'mtrbus') {
        selectRouteDirection(
          item.route, item.co, item.bound || 'out', item.dest || item.route,
          null, null, null, '1', null
        );
        return;
      }
      // 小巴：用 on-demand 拉齊所有區／方向
      if (item.co === 'gmb') {
        const el = document.getElementById('results');
        el.innerHTML = '<div class="loading-state">載入小巴路線中...</div>';
        try {
          const live = await fetchGmbOnDemand(item.route);
          if (!live.length) {
            el.innerHTML = `<div class="empty-state">找不到小巴 ${item.route}<br><small>請檢查網絡或稍後再試</small></div>`;
            return;
          }
          // 若指定了 region，優先該區；否則顯示全部
          const list = item.region
            ? (live.filter(g => g.region === item.region).length
                ? live.filter(g => g.region === item.region)
                : live)
            : live;
          el.innerHTML = '';
          renderSearchResultList(el, list, item.route, false);
        } catch (e) {
          el.innerHTML = `<div class="empty-state">載入小巴失敗<br><small>${e.message || ''}</small></div>`;
        }
        return;
      }

      const el = document.getElementById('results');
      el.innerHTML = `<div class="section-title">請選擇 ${item.route} 方向</div><div class="loading-state">載入方向資料中...</div>`;

      let directions = [];
      if (item.directions && item.directions.length > 0) {
        directions = item.directions;
      } else if (item.orig || item.dest) {
        directions = [
          { bound: 'out', orig: item.orig, dest: item.dest, route_seq: 1 },
          { bound: 'in', orig: item.dest, dest: item.orig, route_seq: 2 }
        ];
      } else {
        directions = [{ bound: 'out', orig: '', dest: item.route || '—', route_seq: 1 }];
      }

      el.innerHTML = `<div class="section-title">請選擇 ${item.route} 方向</div>`;
      directions.forEach(d => {
        const div = document.createElement('div');
        div.className = 'result-item';
        const plate = plateClass(item);
        div.innerHTML = `
          <div class="result-num ${plate}">${item.route}</div>
          <div class="result-info">
            <div class="result-dest">往 ${d.dest || '—'}</div>
            <div class="result-co">起點: ${d.orig || '—'}</div>
          </div>
          <div class="result-arrow">›</div>
        `;
        div.addEventListener('click', () => {
          selectRouteDirection(
            item.route, item.co, d.bound, d.dest,
            item.region || null, item.gmbRouteId || null, d.route_seq,
            item.service_type || '1', item.nlbRouteId || null
          );
        });
        el.appendChild(div);
      });
    }

    function selectRouteDirection(route, co, bound, dest, region, gmbRouteId, gmbRouteSeq, serviceType, nlbRouteId) {
      state.route = route;
      state.co = co;
      state.bound = bound;
      state.region = region || null;
      state.directionLabel = dest;
      state.gmbRouteId = gmbRouteId || null;
      state.gmbRouteSeq = gmbRouteSeq || (bound === 'out' ? 1 : 2);
      state.service_type = serviceType || '1';
      state.nlbRouteId = nlbRouteId || null;
      state.stopId = null;
      state.stopName = null;

      addHistory({
        route, co, bound, dest, region: region || null,
        gmbRouteId: gmbRouteId || null, gmbRouteSeq: gmbRouteSeq || null,
        service_type: serviceType || '1', nlbRouteId: nlbRouteId || null
      });

      updateHeaderFavBtns();

      document.getElementById('stopsTitle').textContent = `${route} - 往 ${dest}`;
      const backBtn = document.querySelector('#pageEta .back-btn');
      if (backBtn) backBtn.setAttribute('onclick', 'goStops()');
      showPage('pageStops');
      renderStops();
    }

    // ========== 真實車站列表 ==========
    async function renderStops() {
      const listEl = document.getElementById('stopList');
      listEl.innerHTML = '<div class="loading-state">載入車站列表中...</div>';

      try {
        let stops = [];
        const co = state.co;
        const route = state.route;
        const dir = state.bound === 'out' ? 'outbound' : 'inbound';

        if (co === 'kmb' || co === 'lwb') {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${dir}/${state.service_type}`);
          const json = await res.json();
          if (json.data && json.data.length) {
            const stopIds = json.data.map(s => s.stop);
            const detailMap = {};
            await Promise.all(stopIds.map(async id => {
              try {
                const sr = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${id}`);
                const sj = await sr.json();
                if (sj.data) {
                  detailMap[id] = {
                    name: sj.data.name_tc || sj.data.name_en || id,
                    lat: parseFloat(sj.data.lat),
                    lng: parseFloat(sj.data.long)
                  };
                }
              } catch {}
            }));
            stops = json.data.map(s => ({
              id: s.stop,
              name: (detailMap[s.stop] && detailMap[s.stop].name) || s.stop,
              seq: parseInt(s.seq, 10),
              lat: detailMap[s.stop] ? detailMap[s.stop].lat : null,
              lng: detailMap[s.stop] ? detailMap[s.stop].lng : null
            })).sort((a, b) => a.seq - b.seq);
          }
        } else if (co === 'ctb') {
          const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/${dir}`);
          const json = await res.json();
          if (json.data && json.data.length) {
            const stopIds = json.data.map(s => s.stop);
            const detailMap = {};
            await Promise.all(stopIds.map(async id => {
              try {
                const sr = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${id}`);
                const sj = await sr.json();
                if (sj.data) {
                  detailMap[id] = {
                    name: sj.data.name_tc || sj.data.name_en || id,
                    lat: parseFloat(sj.data.lat),
                    lng: parseFloat(sj.data.long)
                  };
                }
              } catch {}
            }));
            stops = json.data.map(s => ({
              id: s.stop,
              name: (detailMap[s.stop] && detailMap[s.stop].name) || s.stop,
              seq: s.seq,
              lat: detailMap[s.stop] ? detailMap[s.stop].lat : null,
              lng: detailMap[s.stop] ? detailMap[s.stop].lng : null
            })).sort((a, b) => a.seq - b.seq);
          }
        } else if (co === 'gmb') {
          // 若缺少 route_id，先向三區／指定區域查路線詳情
          // 若缺 route_id，從靜態資料補上
          if (!state.gmbRouteId && state.route) {
            const staticItems = gmbItemsFromStatic(String(state.route).toUpperCase());
            const match = staticItems.find(x =>
              (!state.region || x.region === state.region) &&
              (!state.bound || x.bound === state.bound)
            ) || staticItems[0];
            if (match) {
              state.gmbRouteId = match.gmbRouteId;
              state.gmbRouteSeq = match.gmbRouteSeq || state.gmbRouteSeq;
              state.region = state.region || match.region;
            }
          }

          const routeId = state.gmbRouteId;
          const seq = Number(state.gmbRouteSeq) || (state.bound === 'in' ? 2 : 1);
          if (routeId) {
            const seqsToTry = [seq, seq === 1 ? 2 : 1];
            for (const trySeq of seqsToTry) {
              const json = await gmbApiFetch(
                `https://data.etagmb.gov.hk/route-stop/${routeId}/${trySeq}`
              );
              const routeStops = (json && json.data && json.data.route_stops) || [];
              if (routeStops.length) {
                state.gmbRouteSeq = trySeq;
                stops = routeStops.map(s => ({
                  id: String(s.stop_id),
                  name: s.name_tc || s.name_en || String(s.stop_id),
                  seq: s.stop_seq,
                  lat: null,
                  lng: null
                })).sort((a, b) => a.seq - b.seq);
                // 補座標（並行，最多 20 站以免過慢）
                await Promise.all(stops.slice(0, 40).map(async st => {
                  try {
                    const j = await gmbApiFetch(`https://data.etagmb.gov.hk/stop/${st.id}`);
                    const c = j && j.data && j.data.coordinates && j.data.coordinates.wgs84;
                    if (c) {
                      st.lat = parseFloat(c.latitude);
                      st.lng = parseFloat(c.longitude);
                    }
                  } catch {}
                }));
                break;
              }
            }
          }
        } else if (co === 'nlb' && state.nlbRouteId) {
          const res = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list&routeId=${state.nlbRouteId}`);
          const json = await res.json();
          if (json.stops && json.stops.length) {
            stops = json.stops.map((s, idx) => ({
              id: String(s.stopId),
              name: s.stopName_c || s.stopName_e || String(s.stopId),
              seq: idx + 1,
              lat: s.latitude ? parseFloat(s.latitude) : (s.lat ? parseFloat(s.lat) : null),
              lng: s.longitude ? parseFloat(s.longitude) : (s.long ? parseFloat(s.long) : null)
            }));
          }
        } else if (co === 'mtrbus') {
          // 依方向取內建車站列表（O=out 往目的地，I=in 回程），同序號去重
          const dirKey = (state.bound === 'in' ? 'I' : 'O');
          const key = state.route + '_' + dirKey;
          let list = (typeof MTR_STOPS !== 'undefined' && MTR_STOPS[key]) ? MTR_STOPS[key] : [];
          if (!list.length) {
            list = (typeof MTR_STOPS !== 'undefined' && MTR_STOPS[state.route + '_' + (dirKey === 'O' ? 'I' : 'O')]) || [];
          }
          const seenSeq = new Set();
          stops = [];
          list.forEach(s => {
            if (seenSeq.has(s.s)) return;
            seenSeq.add(s.s);
            stops.push({ id: s.i, name: s.n, seq: s.s });
          });
          stops.sort((a, b) => a.seq - b.seq);
        }

        listEl.innerHTML = '';
        if (stops.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              此路線暫無車站資料<br>
              <small style="opacity:.7">可能非服務時間，或 API 暫時無法連線</small><br>
              <button class="eta-btn" style="margin-top:16px;max-width:160px;display:inline-block" onclick="renderStops()">重新載入</button>
            </div>`;
          state.currentStops = [];
          return;
        }

        // 若有 GPS，計算距離並標示最近站
        if (state.userLat != null && state.userLng != null) {
          stops.forEach(s => {
            if (s.lat != null && s.lng != null) {
              s.distM = haversineM(state.userLat, state.userLng, s.lat, s.lng);
            }
          });
        }
        let nearestId = null;
        const withDist = stops.filter(s => s.distM != null);
        if (withDist.length) {
          withDist.sort((a, b) => a.distM - b.distM);
          nearestId = withDist[0].id;
        }

        // 依方向排序並重新編號 1..n
        stops.sort((a, b) => (a.seq || 0) - (b.seq || 0));
        stops.forEach((s, i) => { s.displaySeq = i + 1; });
        state.currentStops = stops;

        const boundText = state.bound === 'in' ? '回程' : '去程';
        document.getElementById('stopsTitle').textContent =
          `${state.route} ${boundText} · 往 ${state.directionLabel || ''}`;

        stops.forEach((s, i) => {
          const wrap = document.createElement('div');
          wrap.className = 'stop-item-wrap' + (s.id === nearestId ? ' nearest' : '');
          wrap.dataset.stopId = s.id;
          const distHtml = (s.distM != null)
            ? `<div class="stop-dist">${s.distM < 1000 ? Math.round(s.distM) + ' m' : (s.distM / 1000).toFixed(1) + ' km'}</div>`
            : '';
          const secFare = (state._sectionFares && state._sectionFares[i] != null)
            ? state._sectionFares[i] : null;
          const isLast = i === stops.length - 1;
          const fareHtml = isLast && secFare == null
            ? '<div class="stop-fare-tags" data-stop-fare><span class="stop-fare-tag none">總站</span></div>'
            : `<div data-stop-fare>${fareTagsHtml(secFare, state.route)}</div>`;
          wrap.innerHTML = `
            <div class="stop-item">
              <div class="stop-seq">${s.displaySeq}</div>
              <div class="stop-name">${s.name}</div>
              ${distHtml}
              <div class="stop-actions">
                <button type="button" class="stop-journey-btn" title="車程" aria-label="查看車程">⏱</button>
                <button type="button" class="stop-more-btn" title="更多" aria-label="車站功能">☰</button>
              </div>
              <div class="result-arrow">›</div>
            </div>
            ${fareHtml}
            <div class="stop-inline-eta" data-inline-eta></div>
          `;
          wrap.querySelector('.stop-item').addEventListener('click', (e) => {
            if (e.target.closest('.stop-actions')) return;
            selectStopOnList(s, wrap);
          });
          wrap.querySelector('.stop-journey-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            openJourneyPage(s);
          });
          wrap.querySelector('.stop-more-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            openStopActionSheet(s);
          });
          listEl.appendChild(wrap);
        });

        // 更新地圖（只含此方向車站）
        setTimeout(() => updateRouteMap(stops, nearestId), 50);
        await updateFareDisplay();
      } catch (e) {
        console.error('renderStops error', e);
        const isTimeout = e.name === 'AbortError';
        listEl.innerHTML = `
          <div class="empty-state">
            ${isTimeout ? '載入逾時' : '載入車站失敗'}<br>
            <small style="opacity:.7">請檢查網絡後再試</small><br>
            <button class="eta-btn" style="margin-top:16px;max-width:160px;display:inline-block" onclick="renderStops()">重新載入</button>
          </div>`;
      }
    }

    // ========== 地圖 / GPS（OpenStreetMap + Leaflet，免費無需 API Key） ==========
    let routeMap = null;
    let mapStopsLayer = null;
    let mapRouteLine = null;
    let mapUserMarker = null;
    let mapVisible = true;

    function haversineM(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function ensureRouteMap() {
      if (routeMap) return routeMap;
      if (typeof L === 'undefined') {
        document.getElementById('mapStatusText').textContent = '地圖庫載入失敗';
        return null;
      }
      const el = document.getElementById('routeMap');
      if (!el) return null;
      el.innerHTML = '';
      routeMap = L.map(el, {
        zoomControl: false,
        attributionControl: true
      }).setView([22.3193, 114.1694], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(routeMap);
      L.control.zoom({ position: 'topleft' }).addTo(routeMap);
      mapStopsLayer = L.layerGroup().addTo(routeMap);
      return routeMap;
    }

    function toggleMapPanel() {
      mapVisible = !mapVisible;
      const wrap = document.getElementById('mapWrap');
      wrap.classList.toggle('collapsed', !mapVisible);
      if (mapVisible && routeMap) {
        setTimeout(() => { routeMap.invalidateSize(); fitRouteBounds(); }, 200);
      }
    }

    // 以 OSRM 沿道路路徑繪製（非直線）；過長時分段請求
    async function fetchRoadPath(latlngs) {
      if (!latlngs || latlngs.length < 2) return latlngs || [];
      // 簡化過密站點，避免 URL 過長（最多約 80 個 waypoint）
      let pts = latlngs;
      if (pts.length > 80) {
        const step = Math.ceil(pts.length / 80);
        pts = pts.filter((_, i) => i === 0 || i === pts.length - 1 || i % step === 0);
      }
      const chunks = [];
      const chunkSize = 40; // 每段最多 40 點
      for (let i = 0; i < pts.length - 1; i += chunkSize - 1) {
        chunks.push(pts.slice(i, Math.min(i + chunkSize, pts.length)));
      }
      const all = [];
      for (const chunk of chunks) {
        if (chunk.length < 2) continue;
        const coordStr = chunk.map(p => `${p[1]},${p[0]}`).join(';'); // lng,lat
        const url = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson&continue_straight=true`;
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('osrm ' + res.status);
          const json = await res.json();
          const coords = json.routes && json.routes[0] && json.routes[0].geometry
            && json.routes[0].geometry.coordinates;
          if (coords && coords.length) {
            // geojson 為 [lng,lat] → Leaflet [lat,lng]
            const path = coords.map(c => [c[1], c[0]]);
            if (all.length && path.length) path.shift(); // 避免段接點重複
            all.push(...path);
          }
        } catch (e) {
          console.warn('OSRM path failed, use straight segment', e);
          all.push(...chunk);
        }
      }
      return all.length >= 2 ? all : latlngs;
    }

    async function updateRouteMap(stops, nearestId) {
      const map = ensureRouteMap();
      if (!map) return;
      setTimeout(() => map.invalidateSize(), 100);

      // 方向標籤：只顯示目前所選方向
      const dirBadge = document.getElementById('mapDirBadge');
      if (dirBadge) {
        const dirLabel = state.directionLabel || '';
        const boundText = state.bound === 'in' ? '回程' : '去程';
        dirBadge.textContent = dirLabel
          ? `${state.route || ''} ${boundText} · 往 ${dirLabel}`
          : `${state.route || ''} · ${boundText}`;
      }

      if (mapStopsLayer) mapStopsLayer.clearLayers();
      if (mapRouteLine) {
        map.removeLayer(mapRouteLine);
        mapRouteLine = null;
      }

      // 依目前方向排序後重新編號 1..n（分開方向顯示）
      const ordered = (stops || []).slice().sort((a, b) => (a.seq || 0) - (b.seq || 0));
      ordered.forEach((s, idx) => { s.displaySeq = idx + 1; });

      const latlngs = [];
      ordered.forEach(s => {
        if (s.lat == null || s.lng == null || isNaN(s.lat) || isNaN(s.lng)) return;
        latlngs.push([s.lat, s.lng]);
        const isNear = s.id === nearestId;
        const num = s.displaySeq || s.seq;
        const icon = L.divIcon({
          className: '',
          html: `<div class="stop-marker-icon${isNear ? ' active' : ''}">${num}</div>`,
          iconSize: [isNear ? 30 : 26, isNear ? 30 : 26],
          iconAnchor: [isNear ? 15 : 13, isNear ? 15 : 13]
        });
        const m = L.marker([s.lat, s.lng], { icon });
        const safeId = String(s.id).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        m.bindPopup(
          `<b>${num}. ${s.name}</b><br>` +
          `<small>${state.bound === 'in' ? '回程' : '去程'} · 往 ${state.directionLabel || ''}</small><br>` +
          `<button type="button" onclick="selectStopById('${safeId}')" ` +
          `style="margin-top:6px;padding:4px 10px;border:none;background:#00A0E9;color:#fff;border-radius:6px;cursor:pointer">查看到站</button>`
        );
        m.on('click', () => {
          document.querySelectorAll('.stop-item-wrap').forEach(el => {
            el.classList.toggle('selected-stop', el.dataset.stopId === String(s.id));
          });
        });
        mapStopsLayer.addLayer(m);
      });

      // 沿實際行車路線繪製（OSRM），失敗則退回直線
      if (latlngs.length >= 2) {
        const statusEl = document.getElementById('mapStatusText');
        const boundText = state.bound === 'in' ? '回程' : '去程';
        if (statusEl) statusEl.textContent = `${boundText} · 繪製行車路線中…`;
        const roadPath = await fetchRoadPath(latlngs);
        if (mapRouteLine) { map.removeLayer(mapRouteLine); mapRouteLine = null; }
        mapRouteLine = L.polyline(roadPath, {
          color: '#E4002B',
          weight: 5,
          opacity: 0.9,
          lineJoin: 'round',
          lineCap: 'round'
        }).addTo(map);
      }

      if (state.userLat != null && state.userLng != null) {
        if (mapUserMarker) map.removeLayer(mapUserMarker);
        mapUserMarker = L.circleMarker([state.userLat, state.userLng], {
          radius: 8,
          color: '#fff',
          weight: 2,
          fillColor: '#007AFF',
          fillOpacity: 1
        }).addTo(map).bindPopup('我的位置');
      }

      const n = latlngs.length;
      const boundText = state.bound === 'in' ? '回程' : '去程';
      document.getElementById('mapStatusText').textContent =
        n ? `${boundText} · ${n} 站 · 沿道路` : `${boundText} · 暫無座標`;

      if (latlngs.length) {
        const bounds = L.latLngBounds(latlngs);
        if (state.userLat != null) bounds.extend([state.userLat, state.userLng]);
        map.fitBounds(bounds.pad(0.15));
      }
    }

    function fitRouteBounds() {
      if (!routeMap || !state.currentStops) return;
      const pts = state.currentStops
        .filter(s => s.lat != null && s.lng != null)
        .map(s => [s.lat, s.lng]);
      if (!pts.length) return;
      const b = L.latLngBounds(pts);
      if (state.userLat != null) b.extend([state.userLat, state.userLng]);
      routeMap.fitBounds(b.pad(0.15));
    }

    function locateUser() {
      const btn = document.getElementById('btnGps');
      const status = document.getElementById('mapStatusText');
      if (!navigator.geolocation) {
        status.textContent = '此裝置不支援 GPS';
        return;
      }
      btn.classList.add('active');
      status.textContent = '定位中…';
      navigator.geolocation.getCurrentPosition(
        pos => {
          state.userLat = pos.coords.latitude;
          state.userLng = pos.coords.longitude;
          btn.classList.remove('active');
          status.textContent = '已定位 · 計算距離中';
          const map = ensureRouteMap();
          if (mapUserMarker && map) map.removeLayer(mapUserMarker);
          if (map) {
            mapUserMarker = L.circleMarker([state.userLat, state.userLng], {
              radius: 8, color: '#fff', weight: 2, fillColor: '#007AFF', fillOpacity: 1
            }).addTo(map).bindPopup('我的位置');
            map.setView([state.userLat, state.userLng], 16);
          }
          if (state.currentStops && state.currentStops.length) renderStopsFromCache();
        },
        err => {
          btn.classList.remove('active');
          status.textContent = err.code === 1 ? '請允許位置權限' : '定位失敗';
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
      );
    }

    function renderStopsFromCache() {
      const stops = state.currentStops || [];
      if (!stops.length) return;
      const listEl = document.getElementById('stopList');
      if (state.userLat != null) {
        stops.forEach(s => {
          if (s.lat != null && s.lng != null) {
            s.distM = haversineM(state.userLat, state.userLng, s.lat, s.lng);
          }
        });
      }
      let nearestId = null;
      const withDist = stops.filter(s => s.distM != null);
      if (withDist.length) {
        withDist.sort((a, b) => a.distM - b.distM);
        nearestId = withDist[0].id;
      }
      stops.sort((a, b) => (a.seq || 0) - (b.seq || 0));
      stops.forEach((s, i) => { s.displaySeq = i + 1; });
      listEl.innerHTML = '';
      stops.forEach((s, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'stop-item-wrap' + (s.id === nearestId ? ' nearest' : '');
        wrap.dataset.stopId = s.id;
        const distHtml = (s.distM != null)
          ? `<div class="stop-dist">${s.distM < 1000 ? Math.round(s.distM) + ' m' : (s.distM / 1000).toFixed(1) + ' km'}</div>`
          : '';
        const secFare = (state._sectionFares && state._sectionFares[i] != null)
          ? state._sectionFares[i] : null;
        const isLast = i === stops.length - 1;
        const fareHtml = isLast && secFare == null
          ? '<div class="stop-fare-tags" data-stop-fare><span class="stop-fare-tag none">總站</span></div>'
          : `<div data-stop-fare>${fareTagsHtml(secFare, state.route)}</div>`;
        wrap.innerHTML = `
          <div class="stop-item">
            <div class="stop-seq">${s.displaySeq}</div>
            <div class="stop-name">${s.name}</div>
            ${distHtml}
            <div class="stop-actions">
              <button type="button" class="stop-journey-btn" title="車程" aria-label="查看車程">⏱</button>
              <button type="button" class="stop-more-btn" title="更多" aria-label="車站功能">☰</button>
            </div>
            <div class="result-arrow">›</div>
          </div>
          ${fareHtml}
          <div class="stop-inline-eta" data-inline-eta></div>
        `;
        wrap.querySelector('.stop-item').addEventListener('click', (e) => {
          if (e.target.closest('.stop-actions')) return;
          selectStopOnList(s, wrap);
        });
        wrap.querySelector('.stop-journey-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          openJourneyPage(s);
        });
        wrap.querySelector('.stop-more-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          openStopActionSheet(s);
        });
        listEl.appendChild(wrap);
      });
      updateRouteMap(stops, nearestId);
      // 異步補上車費（不阻塞列表）
      updateFareDisplay().catch(e => console.warn('fare update', e));
    }

    function selectStopById(id) {
      const s = (state.currentStops || []).find(x => String(x.id) === String(id));
      if (!s) return;
      const wrap = document.querySelector(`.stop-item-wrap[data-stop-id="${CSS.escape(String(s.id))}"]`);
      if (wrap) selectStopOnList(s, wrap);
      else selectStop(s);
    }

    function formatEtaDisplay(e, now) {
      const t = new Date(e.eta);
      let mins = (typeof e.gmbDiff === 'number')
        ? e.gmbDiff
        : Math.round((t.getTime() - now) / 60000);
      let minClass = '';
      let minText;
      if (e.gmbScheduled && mins <= 0) {
        minText = '預定';
        minClass = 'soon';
      } else if (mins <= 0) {
        minText = '即將到站';
        minClass = 'arrived';
      } else {
        minText = `${mins} 分鐘`;
        if (mins <= 2) minClass = 'arrived';
        else if (mins <= 5) minClass = 'soon';
      }
      const timeStr = t.toTimeString().substring(0, 5);
      return { mins, minText, minClass, timeStr, rmk: e.rmk || '' };
    }

    async function selectStopOnList(stop, wrapEl, opts) {
      opts = opts || {};
      const quiet = !!opts.quiet;
      // 在車站列表內展開到站，方便快速切換其他站（保留路線圖）
      if (!quiet) {
        document.querySelectorAll('.stop-item-wrap').forEach(el => {
          el.classList.remove('selected-stop');
          const box = el.querySelector('[data-inline-eta]');
          if (box) box.innerHTML = '';
        });
        wrapEl.classList.add('selected-stop');
        state.stopId = stop.id;
        state.stopName = stop.name;
        state.selectedStop = stop;

        // 地圖聚焦此站
        if (routeMap && stop.lat != null && stop.lng != null) {
          routeMap.setView([stop.lat, stop.lng], 17);
          if (mapStopsLayer) {
            mapStopsLayer.eachLayer(layer => {
              if (layer.getPopup && layer.getPopup()) {
                const c = layer.getPopup().getContent() || '';
                if (c.includes(String(stop.name))) layer.openPopup();
              }
            });
          }
        }
      }

      const box = wrapEl.querySelector('[data-inline-eta]');
      if (box) {
        if (!quiet || !box.querySelector('.inline-eta-row')) {
          box.innerHTML = '<div class="inline-eta-loading">載入到站時間…</div>';
        }
        try {
          const etas = await fetchEtaDataForStop(stop.id);
          if (!wrapEl.classList.contains('selected-stop')) return; // 已改選其他站
          if (!etas.length) {
            box.innerHTML = '<div class="inline-eta-empty">暫時沒有到站資料</div>';
          } else {
            const now = Date.now();
            box.innerHTML = etas.slice(0, 4).map((e, idx) => {
              const d = formatEtaDisplay(e, now);
              // 第1班綠色，第2~4班藍色
              const colorStyle = idx === 0 ? 'color:var(--green)' : 'color:#007AFF';
              return `<div class="inline-eta-row">
                <span class="inline-eta-mins" style="${colorStyle}">${d.minText}</span>
                <span class="inline-eta-time" style="${colorStyle}">${d.timeStr}</span>
                ${d.rmk ? `<span class="inline-eta-rmk">${d.rmk}</span>` : ''}
              </div>`;
            }).join('') + `
              <div class="inline-eta-actions">
                <button type="button" onclick='openEtaPage(${JSON.stringify(String(stop.id))})'>詳細頁面</button>
                <button type="button" onclick="refreshInlineEta()">刷新</button>
              </div>`;
          }
        } catch (err) {
          console.warn(err);
          if (!quiet) box.innerHTML = '<div class="inline-eta-empty">載入失敗，請再試</div>';
        }
      }
    }

    function refreshInlineEta(opts) {
      opts = opts || {};
      const stop = state.selectedStop;
      if (!stop) return;
      const wrap = document.querySelector(`.stop-item-wrap[data-stop-id="${CSS.escape(String(stop.id))}"]`);
      if (wrap) selectStopOnList(stop, wrap, opts);
    }

    function openEtaPage(stopId) {
      const s = (state.currentStops || []).find(x => String(x.id) === String(stopId))
        || state.selectedStop;
      if (s) selectStop(s);
    }

    // ——— 到站頁地圖（顯示所選車站實際位置）———
    let etaMap = null;
    let etaStopMarker = null;
    let etaUserMarker = null;
    let etaRouteLine = null;
    let etaStopsLayer = null;

    function ensureEtaMap() {
      if (etaMap) return etaMap;
      if (typeof L === 'undefined') return null;
      const el = document.getElementById('etaMap');
      if (!el) return null;
      el.innerHTML = '';
      etaMap = L.map(el, { zoomControl: false, attributionControl: true })
        .setView([22.3193, 114.1694], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(etaMap);
      L.control.zoom({ position: 'topleft' }).addTo(etaMap);
      etaStopsLayer = L.layerGroup().addTo(etaMap);
      return etaMap;
    }

    async function updateEtaStopMap(stop) {
      const map = ensureEtaMap();
      if (!map) return;
      setTimeout(() => map.invalidateSize(), 120);

      if (etaStopMarker) { map.removeLayer(etaStopMarker); etaStopMarker = null; }
      if (etaUserMarker) { map.removeLayer(etaUserMarker); etaUserMarker = null; }
      if (etaRouteLine) { map.removeLayer(etaRouteLine); etaRouteLine = null; }
      if (etaStopsLayer) etaStopsLayer.clearLayers();

      // 紅色行車路線（全線），車站標記只顯示所選站
      const stops = (state.currentStops || []).filter(s =>
        s.lat != null && s.lng != null && !isNaN(s.lat) && !isNaN(s.lng)
      );
      const latlngs = stops.map(s => [s.lat, s.lng]);
      if (latlngs.length >= 2) {
        try {
          const roadPath = await fetchRoadPath(latlngs);
          etaRouteLine = L.polyline(roadPath, {
            color: '#E4002B',
            weight: 5,
            opacity: 0.9,
            lineJoin: 'round',
            lineCap: 'round'
          }).addTo(map);
        } catch (e) {
          etaRouteLine = L.polyline(latlngs, {
            color: '#E4002B', weight: 5, opacity: 0.85
          }).addTo(map);
        }
      }

      const hasStop = stop && stop.lat != null && stop.lng != null && !isNaN(stop.lat) && !isNaN(stop.lng);
      if (hasStop) {
        const num = stop.displaySeq || stop.seq || '';
        const icon = L.divIcon({
          className: '',
          html: `<div class="stop-marker-icon active">${num || '站'}</div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });
        const dest = state.directionLabel || '';
        etaStopMarker = L.marker([stop.lat, stop.lng], { icon })
          .addTo(map)
          .bindPopup(
            `<b>${num}. ${stop.name || ''}</b>` +
            (dest ? `<br>往 ${dest}` : ''),
            { autoClose: false, closeOnClick: false }
          );
        // 聚焦所選站並自動打開氣泡（如附圖）
        map.setView([stop.lat, stop.lng], 17);
        setTimeout(() => {
          try { etaStopMarker.openPopup(); } catch (_) {}
        }, 180);
      } else if (latlngs.length) {
        map.fitBounds(L.latLngBounds(latlngs).pad(0.15));
      } else if (state.userLat != null) {
        map.setView([state.userLat, state.userLng], 16);
      } else {
        map.setView([22.3193, 114.1694], 12);
      }

      if (state.userLat != null && state.userLng != null) {
        etaUserMarker = L.circleMarker([state.userLat, state.userLng], {
          radius: 8, color: '#fff', weight: 2, fillColor: '#007AFF', fillOpacity: 1
        }).addTo(map).bindPopup('我的位置');
      }
    }

    function locateUserOnEta() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        pos => {
          state.userLat = pos.coords.latitude;
          state.userLng = pos.coords.longitude;
          const stop = (state.currentStops || []).find(x => String(x.id) === String(state.stopId));
          updateEtaStopMap(stop || { id: state.stopId, name: state.stopName });
        },
        () => {},
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    }

    function selectStop(stop) {
      state.stopId = stop.id;
      state.stopName = stop.name;
      state.selectedStop = stop;
      document.getElementById('etaRoute').textContent = state.route;
      document.getElementById('etaRoute').className = `eta-route-num ${plateClass({ co: state.co, region: state.region })}`;
      document.getElementById('etaDest').textContent = `往 ${state.directionLabel}`;
      const num = stop.displaySeq || stop.seq;
      document.getElementById('etaStopName').textContent =
        num != null ? `📍 ${num}. ${state.stopName}` : `📍 ${state.stopName}`;
      document.getElementById('etaCo').textContent = CO_NAMES[state.co] || state.co;
      showPage('pageEta');
      // 顯示該站在地圖上的實際位置
      setTimeout(() => updateEtaStopMap(stop), 80);
      updateFareDisplay();
      // 強制自動更新（立即拉一次 + 每 15 秒）
      startAutoRefresh(true);
    }

    // ========== 真實 ETA ==========
    async function fetchEtaDataForStop(stopId) {
      await fetchETA({
        silent: true,
        stopId: stopId,
        co: state.co,
        route: state.route,
        service_type: state.service_type,
        gmbRouteId: state.gmbRouteId,
        gmbRouteSeq: state.gmbRouteSeq,
        nlbRouteId: state.nlbRouteId,
        bound: state.bound,
        region: state.region
      });
      return (state._lastEtas || []).slice();
    }

    // 到站請求序號，避免舊請求覆蓋新結果；自動刷新不閃爍 loading
    let _etaFetchGen = 0;

    async function fetchETA(opts) {
      opts = opts || {};
      const silent = opts.silent != null ? !!opts.silent : !!state._etaSilent;
      const isAuto = !!opts.isAuto;
      const co = opts.co != null ? opts.co : state.co;
      const route = opts.route != null ? opts.route : state.route;
      const stopId = opts.stopId != null ? opts.stopId : state.stopId;
      const service_type = opts.service_type != null ? opts.service_type : state.service_type;
      const gmbRouteId = opts.gmbRouteId != null ? opts.gmbRouteId : state.gmbRouteId;
      const gmbRouteSeq = opts.gmbRouteSeq != null ? opts.gmbRouteSeq : state.gmbRouteSeq;
      const nlbRouteId = opts.nlbRouteId != null ? opts.nlbRouteId : state.nlbRouteId;
      const bound = opts.bound != null ? opts.bound : state.bound;
      const region = opts.region != null ? opts.region : state.region;

      const rowsEl = document.getElementById('etaRows');
      const infoEl = document.getElementById('etaInfo');
      // 手動／首次載入才顯示 loading；自動刷新直接換內容，避免閃爍
      if (!silent && !isAuto && rowsEl) {
        rowsEl.innerHTML = '<div class="loading-state">更新到站時間...</div>';
      }

      // silent 請求不佔 UI 序號，避免打斷到站頁自動刷新
      const gen = silent ? -1 : ++_etaFetchGen;

      try {
        let etas = [];

        if (co === 'kmb' || co === 'lwb') {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${stopId}/${route}/${service_type}`);
          const json = await res.json();
          if (json.data) {
            etas = json.data
              .filter(e => e.eta)
              .map(e => ({
                eta: e.eta,
                rmk: e.rmk_tc || e.rmk_en || '',
                dest: e.dest_tc || e.dest_en || ''
              }));
          }
        } else if (co === 'ctb') {
          const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${route}`);
          const json = await res.json();
          if (json.data) {
            etas = json.data
              .filter(e => e.eta)
              .map(e => ({
                eta: e.eta,
                rmk: e.rmk_tc || e.rmk_en || '',
                dest: e.dest_tc || e.dest_en || ''
              }));
          }
        } else if (co === 'gmb') {
          // 小巴 ETA（直連無 CORS，失敗時走代理）
          const wantSeq = Number(gmbRouteSeq) || (bound === 'in' ? 2 : 1);
          let gmbEtaList = [];
          if (gmbRouteId) {
            const json = await gmbApiFetch(
              `https://data.etagmb.gov.hk/eta/route-stop/${gmbRouteId}/${stopId}`
            );
            if (json && json.data && Array.isArray(json.data)) gmbEtaList = json.data;
          }
          if (!gmbEtaList.length) {
            const json = await gmbApiFetch(`https://data.etagmb.gov.hk/eta/stop/${stopId}`);
            if (json && json.data && Array.isArray(json.data)) {
              gmbEtaList = json.data.filter(item => {
                if (gmbRouteId && item.route_id && item.route_id !== gmbRouteId) return false;
                return true;
              });
            }
          }
          gmbEtaList.forEach(item => {
            // 只取目前所選方向（route_seq）
            if (item.route_seq != null && Number(item.route_seq) !== wantSeq) return;
            if (item.enabled === false) return;
            if (!item.eta || !item.eta.length) return;
            item.eta.forEach(e => {
              // diff = 距離到站分鐘數；timestamp = 預計到站時刻
              const diff = (typeof e.diff === 'number') ? e.diff : null;
              let etaIso = e.timestamp || null;
              if (!etaIso && diff != null) {
                etaIso = new Date(Date.now() + Math.max(0, diff) * 60000).toISOString();
              }
              if (!etaIso) return;
              const rmk = e.remarks_tc || e.remarks_en || '';
              // 「未開出」：用 scheduled 標記，顯示備註而非「即將到站」
              const scheduled = /未開出|Scheduled/i.test(rmk);
              etas.push({
                eta: etaIso,
                rmk: rmk || (diff != null ? `${diff} 分鐘` : ''),
                dest: '',
                gmbDiff: diff,
                gmbScheduled: scheduled
              });
            });
          });
        } else if (co === 'nlb' && nlbRouteId) {
          const res = await fetch(
            `https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&routeId=${nlbRouteId}&stopId=${stopId}&language=zh`
          );
          const json = await res.json();
          if (json.estimatedArrivals) {
            json.estimatedArrivals.forEach(e => {
              if (e.estimatedArrivalTime) {
                const iso = e.estimatedArrivalTime.replace(' ', 'T') + '+08:00';
                etas.push({
                  eta: iso,
                  rmk: e.routeVariantName || '',
                  dest: ''
                });
              }
            });
          }
        } else if (co === 'mtrbus') {
          // 港鐵巴士：只顯示所選車站的到站／開出時間
          // 108000 = API 表示無實時／已離開，應改用 departureTimeInSecond
          const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ language: 'zh', routeName: route })
          });
          const json = await res.json();
          if (json.busStop && json.busStop.length) {
            // 精確匹配 → 後綴匹配 → 第一個有有效班次的站
            let target = json.busStop.find(bs => bs.busStopId === stopId);
            if (!target) {
              target = json.busStop.find(bs => stopId && bs.busStopId && (
                bs.busStopId.endsWith(stopId.replace(/^.*-/, '-')) ||
                stopId.endsWith(bs.busStopId.replace(/^.*-/, '-'))
              ));
            }
            if (!target || !target.bus || !target.bus.length) {
              target = json.busStop.find(bs => {
                if (!bs.bus || !bs.bus.length) return false;
                return bs.bus.some(b => {
                  const a = parseInt(b.arrivalTimeInSecond || '108000', 10);
                  const d = parseInt(b.departureTimeInSecond || '108000', 10);
                  return (a > 0 && a < 108000) || (d > 0 && d < 108000);
                });
              }) || json.busStop[0];
            }
            if (target && target.bus) {
              const seenBus = new Set();
              target.bus.forEach(b => {
                let arr = parseInt(b.arrivalTimeInSecond, 10);
                let dep = parseInt(b.departureTimeInSecond, 10);
                if (isNaN(arr)) arr = 108000;
                if (isNaN(dep)) dep = 108000;
                // 優先有效到站秒數，否則用開出秒數；0 視為即將到站
                let sec = 108000;
                if (arr >= 0 && arr < 108000) sec = arr;
                else if (dep >= 0 && dep < 108000) sec = dep;
                else return;
                const key = (b.busId || '') + '_' + sec;
                if (seenBus.has(key)) return;
                seenBus.add(key);
                const t = new Date(Date.now() + Math.max(0, sec) * 1000);
                const text = b.arrivalTimeText || b.departureTimeText || '';
                etas.push({
                  eta: t.toISOString(),
                  rmk: [b.busId ? `車號 ${b.busId}` : '', text].filter(Boolean).join(' · ') || '',
                  dest: ''
                });
              });
            }
          }
        }

        etas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
        etas = etas.slice(0, 4); // 最近 4 班
        // silent：只回傳資料，不碰畫面；仍寫入 _lastEtas 供呼叫端讀取
        if (silent) {
          state._lastEtas = etas;
          return;
        }
        // 非 silent：僅最新請求可更新畫面與快取
        if (gen !== _etaFetchGen) return;
        state._lastEtas = etas;
        // 自動刷新時若使用者已換站，勿覆蓋畫面
        if (String(state.stopId) !== String(stopId)) return;
        if (!rowsEl) return;

        rowsEl.innerHTML = '';
        if (etas.length === 0) {
          rowsEl.innerHTML = `
            <div class="no-eta">
              暫時沒有到站資料<br>
              <small>可能非服務時間或資料暫缺</small><br>
              <button class="eta-btn" style="margin-top:12px;max-width:140px;display:inline-block" onclick="fetchETA()">再試一次</button>
            </div>`;
        } else {
          const now = Date.now();
          etas.forEach((e, idx) => {
            const d = formatEtaDisplay(e, now);
            const div = document.createElement('div');
            div.className = 'eta-row';
            // 第1班綠色，第2~4班藍色
            const colorStyle = idx === 0 ? 'color:var(--green)' : 'color:#007AFF';
            div.innerHTML = `
              <div class="eta-time-pair" style="align-items:flex-start">
                <div class="eta-time-label">倒數</div>
                <div class="eta-mins" style="${colorStyle}">${d.minText}</div>
                <div class="eta-rmk">${d.rmk || ('班次 ' + (idx + 1))}</div>
              </div>
              <div class="eta-time-pair">
                <div class="eta-time-label">預計到站</div>
                <div class="eta-clock" style="${colorStyle}">${d.timeStr}</div>
              </div>
            `;
            rowsEl.appendChild(div);
          });
        }
        const updatedStr = new Date().toTimeString().substring(0, 8);
        if (infoEl) infoEl.textContent = `最後更新時間: ${updatedStr}`;
      } catch (e) {
        console.error('fetchETA error', e);
        if (silent) {
          state._lastEtas = [];
          return;
        }
        if (gen !== _etaFetchGen) return;
        state._lastEtas = [];
        if (String(state.stopId) !== String(stopId)) return;
        // 自動刷新失敗時保留舊資料，只更新提示
        const isTimeout = e.name === 'AbortError';
        if (isAuto && rowsEl && rowsEl.querySelector('.eta-row')) {
          if (infoEl) infoEl.textContent = (isTimeout ? '自動更新逾時' : '自動更新失敗') + ' · ' + new Date().toTimeString().substring(0, 8);
          return;
        }
        if (rowsEl) rowsEl.innerHTML = `
          <div class="no-eta">
            ${isTimeout ? '連線逾時' : '無法取得到站資料'}<br>
            <small>請檢查網絡後再試</small><br>
            <button class="eta-btn" style="margin-top:12px;max-width:140px;display:inline-block" onclick="fetchETA()">再試一次</button>
          </div>`;
        if (infoEl) infoEl.textContent = '';
      }
    }

    // ========== 全域強制自動更新到站時間（所有相關頁面，每 15 秒）==========
    const ETA_AUTO_MS = 15000;

    function getActivePageId() {
      const p = document.querySelector('.page.active');
      return p ? p.id : null;
    }

    function pageNeedsEtaAuto(pageId) {
      return pageId === 'pageEta' || pageId === 'pageFavs' ||
        pageId === 'pageStops' || pageId === 'pageNearby';
    }

    function stopAutoRefresh() {
      if (state.timer) {
        clearInterval(state.timer);
        state.timer = null;
      }
      state.auto = false;
    }

    /** 依目前頁面刷新到站時間；isAuto=true 時避免整頁 loading 閃爍 */
    function refreshActivePageEta(isAuto) {
      const pageId = getActivePageId();
      if (!pageNeedsEtaAuto(pageId)) return;
      if (pageId === 'pageEta') {
        if (!state.stopId) return;
        fetchETA({ isAuto: !!isAuto });
      } else if (pageId === 'pageFavs') {
        refreshAllFavEtas();
      } else if (pageId === 'pageStops') {
        if (state.selectedStop &&
            document.querySelector('.stop-item-wrap.selected-stop')) {
          refreshInlineEta({ quiet: !!isAuto });
        }
      } else if (pageId === 'pageNearby') {
        if (_nearbyStops && _nearbyStops.length) {
          selectNearbyStop(_nearbySelectedIdx, { quiet: !!isAuto });
        }
      }
    }

    function startAutoRefresh(immediate) {
      stopAutoRefresh();
      const pageId = getActivePageId();
      if (!pageNeedsEtaAuto(pageId)) return;
      state.auto = true;
      if (immediate !== false) {
        refreshActivePageEta(false);
      }
      state.timer = setInterval(() => {
        if (!state.auto) return;
        if (document.visibilityState === 'hidden') return;
        refreshActivePageEta(true);
      }, ETA_AUTO_MS);
    }

    // 從背景回到前景：立刻刷新目前頁的到站時間
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (!pageNeedsEtaAuto(getActivePageId())) return;
      refreshActivePageEta(true);
    });

    // ========== 鄰近車站（500 米，多公司）==========
    let _nearbyStops = [];
    let _nearbySelectedIdx = 0;

    function shortStopName(name) {
      if (!name) return '車站';
      // 去掉括號內站碼以節省空間，保留主要站名
      let n = String(name).replace(/\s*\([A-Z]{1,3}\d{1,4}\)\s*$/i, '').trim();
      if (n.length > 10) n = n.slice(0, 10) + '…';
      return n;
    }

    function coLabel(co) {
      const m = { kmb: '九巴', lwb: '龍運', ctb: '城巴', nlb: '嶼巴', gmb: '小巴', mtr: '港鐵', mtrbus: '港鐵巴士' };
      return m[String(co || '').toLowerCase()] || String(co || '').toUpperCase();
    }

    function openNearbyPage() {
      showPage('pageNearby');
      document.getElementById('nearbyStatus').textContent = '定位中…';
      document.getElementById('nearbyStopsBar').innerHTML = '';
      document.getElementById('nearbyStopTitle').textContent = '—';
      document.getElementById('nearbyRouteList').innerHTML = '<div class="nearby-empty">正在取得位置…</div>';
      if (!navigator.geolocation) {
        document.getElementById('nearbyStatus').textContent = '此裝置不支援定位';
        document.getElementById('nearbyRouteList').innerHTML = '<div class="nearby-empty">無法定位</div>';
        return;
      }
      navigator.geolocation.getCurrentPosition(
        async pos => {
          state.userLat = pos.coords.latitude;
          state.userLng = pos.coords.longitude;
          await loadNearbyStops(state.userLat, state.userLng);
        },
        err => {
          document.getElementById('nearbyStatus').textContent =
            err.code === 1 ? '請允許位置權限後重試' : '定位失敗，請重試';
          document.getElementById('nearbyRouteList').innerHTML =
            '<div class="nearby-empty"><button type="button" class="header-nearby-entry" onclick="openNearbyPage()">重新定位</button></div>';
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
      );
    }

    async function loadNearbyStops(lat, lng) {
      const status = document.getElementById('nearbyStatus');
      status.textContent = '載入站點資料…';
      try {
        const { stopList } = await ensureStopIndex();
        status.textContent = '搜尋 500 米內車站…';
        const RADIUS = 500;
        const nearby = [];
        for (const [id, info] of Object.entries(stopList)) {
          const loc = info.location || {};
          const slat = parseFloat(loc.lat), slng = parseFloat(loc.lng);
          if (isNaN(slat) || isNaN(slng)) continue;
          const d = haversineM(lat, lng, slat, slng);
          if (d <= RADIUS) {
            nearby.push({
              id,
              name: (info.name && (info.name.zh || info.name.en)) || id,
              lat: slat,
              lng: slng,
              distM: d
            });
          }
        }
        nearby.sort((a, b) => a.distM - b.distM);
        _nearbyStops = nearby.slice(0, 25);
        _nearbySelectedIdx = 0;
        if (!_nearbyStops.length) {
          status.textContent = '附近 500 米沒有巴士站';
          document.getElementById('nearbyStopsBar').innerHTML = '';
          document.getElementById('nearbyStopTitle').textContent = '—';
          document.getElementById('nearbyRouteList').innerHTML =
            '<div class="nearby-empty">請走近巴士站後再試</div>';
          return;
        }
        status.textContent = `找到 ${_nearbyStops.length} 個車站（500 米內）· 距離由近至遠`;
        renderNearbyStopChips();
        selectNearbyStop(0);
      } catch (e) {
        console.warn(e);
        status.textContent = '載入站點失敗';
        document.getElementById('nearbyRouteList').innerHTML =
          '<div class="nearby-empty">請檢查網絡後重試</div>';
      }
    }

    function renderNearbyStopChips() {
      const bar = document.getElementById('nearbyStopsBar');
      bar.innerHTML = '';
      _nearbyStops.forEach((s, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'nearby-stop-chip' + (i === _nearbySelectedIdx ? ' active' : '');
        const dist = s.distM < 1000 ? Math.round(s.distM) + '米' : (s.distM / 1000).toFixed(1) + 'km';
        btn.innerHTML = `<div class="chip-code">${shortStopName(s.name)}</div><div class="chip-dist">🚶 ${dist}</div>`;
        btn.title = s.name;
        btn.onclick = () => selectNearbyStop(i);
        bar.appendChild(btn);
      });
    }

    async function fetchRoutesAtStop(stopId) {
      const { stopMap, routeList } = await ensureStopIndex();
      const pairs = stopMap[stopId] || [];
      // pairs: [["kmb","xxx"], ["ctb","001"]]
      const routeMap = new Map(); // key route|co|dir

      // 從 routeList 反查經過此站的路線
      for (const [key, info] of Object.entries(routeList)) {
        const cos = info.co || [];
        const stopsByCo = info.stops || {};
        let hit = false;
        let hitCo = null;
        for (const c of cos) {
          const arr = stopsByCo[c] || [];
          if (arr.includes(stopId) || arr.some(x => String(x) === String(stopId))) {
            hit = true;
            hitCo = c;
            break;
          }
        }
        // 也比對 stopMap 的 operator id
        if (!hit && pairs.length) {
          for (const c of cos) {
            const arr = stopsByCo[c] || [];
            for (const [, opId] of pairs) {
              if (arr.includes(opId) || arr.some(x => String(x) === String(opId))) {
                hit = true;
                hitCo = c;
                break;
              }
            }
            if (hit) break;
          }
        }
        if (!hit) continue;
        const route = info.route || key.split('+')[0];
        const dest = (info.dest && (info.dest.zh || info.dest.en)) || '';
        const bound = (info.bound && (info.bound[hitCo] || Object.values(info.bound)[0])) || '';
        const dir = String(bound).toUpperCase().startsWith('I') ? 'I' : 'O';
        const co = String(hitCo || cos[0] || 'kmb').toLowerCase();
        const rkey = `${route}|${co}|${dir}|${dest}`;
        if (!routeMap.has(rkey)) {
          routeMap.set(rkey, {
            route, co, dir, dest,
            service_type: String(info.serviceType || 1),
            nlbId: info.nlbId || null,
            gtfsId: info.gtfsId || null,
            etas: []
          });
        }
      }

      // 拉取各公司 ETA
      const tasks = [];
      for (const [co, opId] of pairs) {
        const c = String(co).toLowerCase();
        if (c === 'kmb' || c === 'lwb') {
          tasks.push((async () => {
            try {
              const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${opId}`);
              const json = await res.json();
              (json.data || []).forEach(e => {
                const route = e.route;
                const dir = e.dir || 'O';
                const dest = e.dest_tc || e.dest_en || '';
                const co2 = (e.co || 'KMB').toLowerCase();
                const rkey = `${route}|${co2}|${dir}|${dest}`;
                // fuzzy match existing
                let found = routeMap.get(rkey);
                if (!found) {
                  for (const [k, v] of routeMap) {
                    if (v.route === route && (v.co === co2 || v.co === 'kmb' || v.co === 'lwb') && v.dir === dir) {
                      found = v; break;
                    }
                  }
                }
                if (!found) {
                  found = {
                    route, co: co2, dir, dest,
                    service_type: String(e.service_type || 1),
                    etas: []
                  };
                  routeMap.set(rkey, found);
                }
                if (e.eta) found.etas.push(e.eta);
              });
            } catch (_) {}
          })());
        } else if (c === 'ctb') {
          tasks.push((async () => {
            try {
              const res = await fetch(`https://rt.data.gov.hk/v1/transport/batch/stop-eta/CTB/${opId}`);
              const json = await res.json();
              (json.data || []).forEach(e => {
                const route = e.route;
                const dir = e.dir || 'O';
                const dest = e.dest || e.dest_tc || '';
                const rkey = `${route}|ctb|${dir}|${dest}`;
                let found = routeMap.get(rkey);
                if (!found) {
                  for (const [k, v] of routeMap) {
                    if (v.route === route && v.co === 'ctb' && v.dir === dir) { found = v; break; }
                  }
                }
                if (!found) {
                  found = { route, co: 'ctb', dir, dest, service_type: '1', etas: [] };
                  routeMap.set(rkey, found);
                }
                if (e.eta) found.etas.push(e.eta);
              });
            } catch (_) {}
          })());
        } else if (c === 'nlb') {
          tasks.push((async () => {
            try {
              const res = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&routeId=0&stopId=${opId}&language=zh`);
              // NLB ETA 需 routeId；改用 stop-route batch
            } catch (_) {}
            try {
              const res = await fetch(`https://rt.data.gov.hk/v1/transport/batch/stop-route/NLB/${opId}`);
              const json = await res.json();
              (json.data || []).forEach(e => {
                const route = e.route || e.routeName;
                if (!route) return;
                const dir = e.dir || 'O';
                const dest = e.routeName || '';
                const rkey = `${route}|nlb|${dir}|${dest}`;
                if (!routeMap.has(rkey)) {
                  routeMap.set(rkey, {
                    route, co: 'nlb', dir, dest: dest || route,
                    service_type: '1', nlbId: e.routeId || null, etas: []
                  });
                }
              });
            } catch (_) {}
          })());
        }
      }
      await Promise.all(tasks);

      // GMB：若 stopMap 有 gmb，用 routeList 已反查到的路線即可（ETA 需 route id）
      return Array.from(routeMap.values());
    }

    async function selectNearbyStop(idx, opts) {
      opts = opts || {};
      const quiet = !!opts.quiet;
      _nearbySelectedIdx = idx;
      if (!quiet) renderNearbyStopChips();
      const s = _nearbyStops[idx];
      if (!s) return;
      const dist = s.distM < 1000 ? Math.round(s.distM) + ' 米' : (s.distM / 1000).toFixed(1) + ' km';
      document.getElementById('nearbyStopTitle').textContent = `${s.name} · ${dist}`;
      const list = document.getElementById('nearbyRouteList');
      if (!quiet) list.innerHTML = '<div class="nearby-empty">載入路線…</div>';
      try {
        const routes = await fetchRoutesAtStop(s.id);
        const now = Date.now();
        routes.sort((a, b) => {
          const ae = a.etas[0] ? new Date(a.etas[0]).getTime() : Infinity;
          const be = b.etas[0] ? new Date(b.etas[0]).getTime() : Infinity;
          if (ae !== be) return ae - be;
          return String(a.route).localeCompare(String(b.route), 'en', { numeric: true });
        });
        if (!routes.length) {
          list.innerHTML = '<div class="nearby-empty">此站暫時沒有路線資料</div>';
          return;
        }
        list.innerHTML = '';
        routes.forEach(r => {
          const row = document.createElement('div');
          row.className = 'nearby-route-row';
          let etaText = '暫時沒有預定班次';
          let etaCls = '';
          if (r.etas.length) {
            const mins = Math.round((new Date(r.etas[0]).getTime() - now) / 60000);
            if (mins <= 0) { etaText = '即將到站'; etaCls = 'has'; }
            else { etaText = mins + ' 分鐘'; etaCls = 'has'; }
            if (r.etas.length > 1) {
              const m2 = Math.round((new Date(r.etas[1]).getTime() - now) / 60000);
              if (m2 > 0) etaText += ` / ${m2}分`;
            }
          }
          const plate = plateClass({ co: r.co, region: r.region });
          row.innerHTML = `
            <div class="nearby-route-num ${plate}">${r.route}</div>
            <div class="nearby-route-dest">往 ${r.dest || '—'}<br><span>${coLabel(r.co)}</span></div>
            <div class="nearby-route-eta ${etaCls}">${etaText}</div>
          `;
          row.onclick = () => openNearbyRoute(r, s);
          list.appendChild(row);
        });
      } catch (e) {
        console.warn(e);
        if (!quiet) list.innerHTML = '<div class="nearby-empty">載入失敗，請重試</div>';
      }
    }

    function openNearbyRoute(r, stop) {
      const bound = (r.dir === 'I' || r.dir === 'inbound') ? 'in' : 'out';
      let co = String(r.co || 'kmb').toLowerCase();
      if (co === 'mtr') co = 'mtrbus';
      selectRouteDirection(
        r.route,
        co,
        bound,
        r.dest,
        null,
        r.gtfsId || null,
        null,
        r.service_type || '1',
        r.nlbId || null
      );
      setTimeout(() => {
        const found = (state.currentStops || []).find(x =>
          String(x.id) === String(stop.id) ||
          (x.name && stop.name && x.name.replace(/\s/g,'') === stop.name.replace(/\s/g,''))
        );
        if (found) selectStop(found);
      }, 700);
    }

    function coShortName(co) {
      // 正確兩字簡稱（上字→下字）
      const m = {
        kmb: '九巴',
        lwb: '龍運',
        ctb: '城巴',
        nlb: '嶼巴',
        gmb: '小巴',
        mtrbus: '港鐵'
      };
      return m[co] || '巴士';

    /** 直排 HTML：每個字獨立一行，避免 writing-mode 在 iOS 反序 */

    function favCardClass(item) {
      if (item.co === 'gmb' && item.region) {
        const r = String(item.region).toUpperCase();
        if (r === 'HKI') return 'co-gmb-hki';
        if (r === 'KLN') return 'co-gmb-kln';
        if (r === 'NT') return 'co-gmb-nt';
        return 'co-gmb';

    function etaAnimClass(mins) {
      if (mins == null || isNaN(mins)) return 'eta-green';
      if (mins <= 0) return 'eta-blink-ryg';   // 0 分鐘：紅黃綠
      if (mins <= 5) return 'eta-blink-yg';    // 1~5：黃綠
      if (mins <= 10) return 'eta-blink-gr';   // 6~10：綠紅
      return 'eta-green';                      // >10：綠
    }
    function formatFavMins(e, now) {
      const t = new Date(e.eta);
      let mins = (typeof e.gmbDiff === 'number')
        ? e.gmbDiff
        : Math.round((t.getTime() - now) / 60000);
      if (e.gmbScheduled && mins <= 0) {
        return { text: '預定', cls: 'eta-green', mins: 999 };
      }
      if (mins <= 0) {
        return { text: '即將到站', cls: etaAnimClass(0), mins: 0 };
      }
      return { text: mins + ' 分鐘', cls: etaAnimClass(mins), mins };
    }

    async function refreshAllFavEtas() {
      const favs = getFavs().filter(f => f.stopId != null);
      const list = document.getElementById('favsList');
      if (!list || !favs.length) return;
      const now = Date.now();
      // 逐張更新（避免一次打爆 API）
      for (let i = 0; i < favs.length; i++) {
        const item = favs[i];
        const card = list.querySelector(`[data-fav-idx="${i}"]`);
        if (!card) continue;
        const mainEl = card.querySelector('.fav-eta-main');
        const subEl = card.querySelector('.fav-eta-sub');
        try {
          const etas = await fetchEtaForFavItem(item);
          if (!etas.length) {
            mainEl.className = 'fav-eta-main empty';
            mainEl.textContent = '無班次';
            subEl.innerHTML = '<span class="fav-eta-chip">-</span><span class="fav-eta-chip">-</span>';
          } else {
            const ds = etas.map(e => formatFavMins(e, now));
            mainEl.className = 'fav-eta-main ' + (ds[0].cls || 'eta-green');
            mainEl.textContent = ds[0].text;
            const chips = ds.slice(1, 3);
            while (chips.length < 2) chips.push({ text: '-' });
            subEl.innerHTML = chips.map(d =>
              `<span class="fav-eta-chip">${String(d.text).replace(' 分鐘', '分鐘')}</span>`
            ).join('');
          }
        } catch {
          mainEl.className = 'fav-eta-main empty';
          mainEl.textContent = '—';
        }
      }
    }

    async function openFavItem(item) {
      state.route = item.route;

          id: item.stopId,

          displaySeq: item.displaySeq,

          lat: item.lat,
          lng: item.lng

    // ========== 車程頁（由上車站估計下游到達時間） ==========
    function estimateSegmentMinutes(a, b) {
      if (!a || !b || a.lat == null || b.lat == null) return 2;
      const m = haversineM(a.lat, a.lng, b.lat, b.lng);
      // 市區巴士平均約 18 km/h（含停站），另加約 20 秒停站
      const mins = (m / 1000) / 18 * 60 + 0.35;
      return Math.max(1, Math.round(mins));
    }

    function formatClock(d) {
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return hh + ':' + mm;
    }

    async function openJourneyPage(boardStop) {
      const stops = state.currentStops || [];
      if (!stops.length || !boardStop) return;
      const boardIdx = stops.findIndex(s => String(s.id) === String(boardStop.id));
      if (boardIdx < 0) return;

      showPage('pageJourney');
      const listEl = document.getElementById('journeyList');
      const metaEl = document.getElementById('journeyMeta');
      listEl.innerHTML = '<div class="journey-empty">計算車程中…</div>';

      // 取上車站首班 ETA 作為出發時間基準
      let departAt = new Date(Date.now() + 3 * 60000); // 後備：約 3 分鐘後
      let etaLabel = '';
      try {
        await fetchETA({
          silent: true,
          stopId: boardStop.id,
          co: state.co,
          route: state.route,
          bound: state.bound,
          service_type: state.service_type,
          gmbRouteId: state.gmbRouteId,
          gmbRouteSeq: state.gmbRouteSeq,
          nlbRouteId: state.nlbRouteId,
          region: state.region
        });
        const etas = state._lastEtas || [];
        if (etas.length && etas[0].eta) {
          departAt = new Date(etas[0].eta);
          if (departAt.getTime() < Date.now() - 30000) {
            departAt = new Date(Date.now() + 60000);
          }
          etaLabel = '（參考首班預計 ' + formatClock(departAt) + ' 開出）';
        }
      } catch (_) {}

      metaEl.textContent =
        `${state.route} 往 ${state.directionLabel || ''} · 由「${boardStop.name}」上車` + etaLabel +
        ' · 車程為站距估算，實際以路面情況為準';

      // 累計車程
      const rows = [];
      let cum = 0;
      for (let i = boardIdx; i < stops.length; i++) {
        if (i > boardIdx) {
          cum += estimateSegmentMinutes(stops[i - 1], stops[i]);
        }
        const arrive = new Date(departAt.getTime() + cum * 60000);
        rows.push({ stop: stops[i], idx: i, cum, arrive, isBoard: i === boardIdx });
      }

      listEl.innerHTML = '';
      rows.forEach((r, ri) => {
        const div = document.createElement('div');
        div.className = 'journey-row' + (r.isBoard ? ' is-board' : ' is-after');
        const seq = r.stop.displaySeq || (r.idx + 1);
        const name = r.stop.name || '';
        const sub = r.isBoard
          ? '上車站'
          : `車程: <strong>${r.cum}</strong> 分鐘`;
        const timeIcon = r.isBoard ? '🚌' : '🚏';
        div.innerHTML = `
          <div class="journey-rail"><div class="journey-dot"></div></div>
          <div class="journey-body">
            <div class="journey-stop-name">${seq}. ${name}</div>
            <div class="journey-sub">${sub}</div>
          </div>
          <div class="journey-time">
            <span class="jt-icon">${timeIcon}</span>
            <span>${formatClock(r.arrive)}</span>
          </div>
        `;
        div.addEventListener('click', () => {
          selectStop(r.stop);
        });
        listEl.appendChild(div);
      });
    }

    // ========== 智能問路（跨公司）==========
    let _planFrom = null; // { kind, id, name, lat, lng }
    let _planTo = null;
    let _planFromStop = null;
    let _planToStop = null;
    let _planFocus = 'from'; // which input is being typed

    const LS_PLAN_PREFS = 'hkbus_plan_prefs_v1';
    let PLAN_PREFS = {
      alightM: 400,

    function loadPlanPrefs() {
      try {
        const o = JSON.parse(localStorage.getItem(LS_PLAN_PREFS) || '{}');
        if (typeof o.alightM === 'number') PLAN_PREFS.alightM = Math.max(0, Math.min(1000, o.alightM));
        if (typeof o.maxTransfers === 'number') PLAN_PREFS.maxTransfers = Math.max(0, Math.min(4, o.maxTransfers));
        if (typeof o.showNRoute === 'boolean') PLAN_PREFS.showNRoute = o.showNRoute;
        if (o.theme === 'day' || o.theme === 'night' || o.theme === 'system') PLAN_PREFS.theme = o.theme;
      } catch (_) {}
      applyAppTheme(PLAN_PREFS.theme);
    }

    function applyAppTheme(theme) {
      const root = document.documentElement;
      let mode = theme || 'system';
      if (mode === 'system') {
        mode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'night' : 'day';
      }
      root.setAttribute('data-theme', mode);
      document.body.classList.toggle('theme-night', mode === 'night');
      // header
      const headers = document.querySelectorAll('.header, .plan-header, .favs-header, .nearby-header');
      headers.forEach(h => {
        if (mode === 'night') h.style.background = '#1f6feb';
        else h.style.background = '';
      });
    }

    function planFormatDepartLabel() {
      if (!_planDepartAt) return '現在出發';
      const d = _planDepartAt;
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
      const sameDay = d.toDateString() === now.toDateString();
      const tom = new Date(now); tom.setDate(tom.getDate() + 1);
      if (sameDay) return '今天 ' + hm + ' 出發';
      if (d.toDateString() === tom.toDateString()) return '明天 ' + hm + ' 出發';
      return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm + ' 出發';
    }
