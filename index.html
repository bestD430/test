<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港巴士到站時間</title>
  <style>
    :root {
      --primary: #00A0E9;
      --primary-dark: #0088cc;
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #e5e5ea;
      --green: #34c759;
      --amber: #ff9500;
      --red: #ff3b30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }
    .header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 14px 16px 12px;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: 1px;
    }
    .search-box {
      background: white;
      padding: 12px 16px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.2rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #fafafa;
      font-family: inherit;
      letter-spacing: 1px;
      text-align: center;
      font-weight: 600;
    }
    .search-input:focus { border-color: var(--primary); background: white; }
    .search-input::placeholder { color: #c7c7cc; font-weight: 400; letter-spacing: 0; }
    .results {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .result-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 12px;
      transition: background 0.1s;
    }
    .result-item:active { background: #f2f2f7; }
    .result-num {
      font-size: 1.5rem;
      font-weight: 700;
      min-width: 64px;
      text-align: center;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .plate-kmb { background: #E4002B; color: #fff; }
    .plate-lwb { background: #FF6200; color: #fff; }
    .plate-ctb { background: #FFD100; color: #1a1a1a; }
    .plate-nlb { background: #007A3D; color: #fff; }
    .plate-gmb { background: #00A651; color: #fff; }
    .plate-gmb-hki { background: #5AC8FA; color: #1a1a1a; }
    .plate-gmb-kln { background: #39FF14; color: #1a1a1a; }
    .plate-gmb-nt  { background: #C5A3FF; color: #1a1a1a; }
    .plate-mtrbus { background: #0077C8; color: #fff; }
    .result-info { flex: 1; min-width: 0; }
    .result-dest {
      font-size: 0.98rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-co {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .result-arrow {
      color: #c7c7cc;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .empty-state, .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .keypad {
      flex-shrink: 0;
      background: #5a6570;
      padding: 8px 6px 6px;
      user-select: none;
    }
    .weather-bar {
      flex-shrink: 0;
      background: #1c1c1e;
      color: #f2f2f7;
      padding: 8px 12px 10px;
      font-size: 0.78rem;
      border-top: 1px solid #3a3a3c;
    }
    .weather-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .weather-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .weather-temp {
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .weather-meta {
      flex: 1;
      min-width: 0;
      line-height: 1.35;
    }
    .weather-meta .wx-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #aeaeb2;
    }
    .weather-meta .wx-line strong {
      color: #f2f2f7;
      font-weight: 600;
    }
    .weather-warns {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .wx-warn-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      background: #ff3b30;
      color: #fff;
    }
    .wx-warn-badge.yellow { background: #ffcc00; color: #1a1a1a; }
    .wx-warn-badge.amber { background: #ff9500; color: #1a1a1a; }
    .wx-warn-badge.red { background: #ff3b30; color: #fff; }
    .wx-warn-badge.black { background: #1c1c1e; color: #fff; border: 1px solid #aeaeb2; }
    .wx-warn-badge.blue { background: #007aff; color: #fff; }
    .wx-forecast {
      margin-top: 5px;
      color: #8e8e93;
      font-size: 0.72rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .weather-bar.wx-loading { color: #8e8e93; text-align: center; padding: 12px; }
    .key-row {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
      justify-content: center;
    }
    .key-row:last-child { margin-bottom: 0; }
    .key {
      flex: 1;
      max-width: 72px;
      height: 46px;
      border: none;
      border-radius: 8px;
      background: white;
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      transition: background 0.08s, transform 0.05s;
    }
    .key:active {
      background: #d1d1d6;
      transform: scale(0.96);
    }
    .key-letter {
      max-width: 48px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.05rem;
      background: #d8dce0;
      color: #1c1c1e;
      flex: 0 0 42px;
    }
    .key-letter:active { background: #b0b6bc; }
    .key-func {
      background: #8e99a4;
      color: white;
      font-size: 1.1rem;
    }
    .key-func:active { background: #6d7883; }
    .keypad-main {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .num-pad {
      flex: 1.15;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .letter-pad {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .page { display: none; flex-direction: column; height: 100%; }
    .page.active { display: flex; }
    .page-header {
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 8px;
      flex-shrink: 0;
      gap: 4px;
    }
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.4rem;
      padding: 4px 10px;
      cursor: pointer;
      line-height: 1;
    }
    .page-title {
      flex: 1;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      margin-right: 36px;
    }
    .stop-list, .eta-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .stop-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stop-item:active { background: #f2f2f7; }
    .stop-seq {
      font-size: 0.85rem;
      color: var(--muted);
      min-width: 28px;
      font-weight: 600;
    }
    .stop-name { font-size: 0.98rem; font-weight: 500; flex: 1; }
    .eta-header-info {
      background: #1c1c1e;
      color: white;
      padding: 16px;
    }
    .eta-route-num {
      font-size: 2.1rem;
      font-weight: 700;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .eta-dest-text { font-size: 0.95rem; color: #aeaeb2; margin-top: 4px; }
    .eta-stop-text { font-size: 0.9rem; margin-top: 8px; }
    .eta-co-badge {
      display: inline-block;
      background: #3a3a3c;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.72rem;
      margin-top: 6px;
    }
    .eta-rows { padding: 8px 0; }
    .eta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .eta-mins {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }
    .eta-mins.soon { color: var(--amber); }
    .eta-mins.arrived { color: var(--red); }
    .eta-clock {
      font-size: 0.88rem;
      color: var(--muted);
      text-align: right;
    }
    .eta-rmk {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .eta-toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: white;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .eta-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #f2f2f7;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .eta-btn:active { background: #e5e5ea; }
    .eta-btn.active-refresh {
      background: var(--primary);
      color: white;
    }
    .eta-refresh-info {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 6px 16px 10px;
      background: white;
    }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
    }
    .section-title .clear-link {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      padding: 2px 4px;
    }
    .fav-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      flex-shrink: 0;
      color: #c7c7cc;
      transition: color 0.15s, transform 0.1s;
    }
    .fav-btn.on { color: #ff9500; }
    .fav-btn:active { transform: scale(0.9); }
    .result-item .fav-btn { margin-left: auto; }
    .home-hint {
      text-align: center;
      padding: 28px 20px 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .page-header .fav-btn {
      color: rgba(255,255,255,0.7);
      font-size: 1.3rem;
      margin-right: 4px;
    }
    .page-header .fav-btn.on { color: #ffd60a; }
    .no-eta {
      text-align: center;
      padding: 30px 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="page active" id="pageSearch">
      <div class="header">香港巴士到站時間</div>
      <div class="search-box">
        <input type="text" class="search-input" id="routeInput" placeholder="輸入路線號碼" readonly inputmode="none">
      </div>
      <div class="results" id="results"></div>
      <div class="keypad" id="keypad">
        <div class="keypad-main">
          <div class="num-pad">
            <div class="key-row">
              <button class="key" data-k="1">1</button>
              <button class="key" data-k="2">2</button>
              <button class="key" data-k="3">3</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="4">4</button>
              <button class="key" data-k="5">5</button>
              <button class="key" data-k="6">6</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="7">7</button>
              <button class="key" data-k="8">8</button>
              <button class="key" data-k="9">9</button>
            </div>
            <div class="key-row">
              <button class="key key-func" data-k="clear">✕</button>
              <button class="key" data-k="0">0</button>
              <button class="key key-func" data-k="back">⌫</button>
            </div>
          </div>
          <div class="letter-pad" id="letterKeys">
            <div class="key-row"><button class="key key-letter" data-k="A">A</button><button class="key key-letter" data-k="B">B</button><button class="key key-letter" data-k="C">C</button><button class="key key-letter" data-k="D">D</button></div>
            <div class="key-row"><button class="key key-letter" data-k="E">E</button><button class="key key-letter" data-k="F">F</button><button class="key key-letter" data-k="H">H</button><button class="key key-letter" data-k="K">K</button></div>
            <div class="key-row"><button class="key key-letter" data-k="M">M</button><button class="key key-letter" data-k="N">N</button><button class="key key-letter" data-k="P">P</button><button class="key key-letter" data-k="R">R</button></div>
            <div class="key-row"><button class="key key-letter" data-k="S">S</button><button class="key key-letter" data-k="T">T</button><button class="key key-letter" data-k="W">W</button><button class="key key-letter" data-k="X">X</button></div>
          </div>
        </div>
      </div>
      <div class="weather-bar wx-loading" id="weatherBar">載入天氣資料...</div>
    </div>

    <div class="page" id="pageStops">
      <div class="page-header">
        <button class="back-btn" onclick="goSearch()">‹</button>
        <div class="page-title" id="stopsTitle">選擇車站</div>
        <button class="fav-btn" id="stopsFavBtn" onclick="toggleFavFromStops()" title="收藏此路線">☆</button>
      </div>
      <div class="stop-list" id="stopList">
        <div class="loading-state">載入車站中...</div>
      </div>
    </div>

    <div class="page" id="pageEta">
      <div class="page-header">
        <button class="back-btn" onclick="goStops()">‹</button>
        <div class="page-title">預計到站</div>
        <button class="fav-btn" id="etaFavBtn" onclick="toggleFavFromStops()" title="收藏此路線">☆</button>
      </div>
      <div class="eta-area" id="etaArea">
        <div class="eta-header-info">
          <div class="eta-route-num" id="etaRoute">—</div>
          <div class="eta-dest-text" id="etaDest">—</div>
          <div class="eta-stop-text" id="etaStopName">—</div>
          <div class="eta-co-badge" id="etaCo">—</div>
        </div>
        <div class="eta-rows" id="etaRows"></div>
        <div class="eta-refresh-info" id="etaInfo"></div>
      </div>
      <div class="eta-toolbar">
        <button class="eta-btn" onclick="fetchETA()">🔄 刷新</button>
        <button class="eta-btn" id="btnAuto" onclick="toggleAuto()">▶ 自動刷新</button>
      </div>
    </div>
  </div>

  <script>
    const CO_NAMES = {
      kmb: '九巴', lwb: '龍運巴士', ctb: '城巴', nlb: '嶼巴',
      gmb: '專線小巴', mtrbus: '港鐵巴士'
    };

    function plateClass(item) {
      if (item.co === 'gmb' && item.region) {
        const r = (item.region || '').toUpperCase();
        if (r === 'HKI') return 'plate-gmb-hki';
        if (r === 'KLN') return 'plate-gmb-kln';
        if (r === 'NT')  return 'plate-gmb-nt';
      }
      return 'plate-' + (item.co || 'kmb');
    }

    let ALL_ROUTES = [];
    let routesLoaded = false;

    const LOCAL_FALLBACK = [
      { route: '1A', co: 'kmb', bound: 'out', orig: '中秀茂坪', dest: '尖沙咀碼頭', service_type: '1' },
      { route: '1A', co: 'kmb', bound: 'in', orig: '尖沙咀碼頭', dest: '中秀茂坪', service_type: '1' },
      { route: '16', co: 'kmb', bound: 'out', orig: '藍田(廣田邨)', dest: '旺角(柏景灣)', service_type: '1' },
      { route: '16', co: 'kmb', bound: 'in', orig: '旺角(柏景灣)', dest: '藍田(廣田邨)', service_type: '1' },
      { route: '101', co: 'kmb', bound: 'out', orig: '堅尼地城', dest: '觀塘(裕民坊)', service_type: '1' },
      { route: 'E31', co: 'lwb', bound: 'out', orig: '荃灣(愉景新城)', dest: '逸東邨', service_type: '1' },
      { route: 'A11', co: 'ctb', orig: '北角碼頭', dest: '機場' }
    ];

    async function fetchJSON(url, options = {}, timeoutMs = 12000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        if (!res.ok) {
          const err = new Error(`HTTP ${res.status}`);
          err.status = res.status;
          throw err;
        }
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    function isLwbRoute(route) {
      const r = String(route || '').toUpperCase();
      if (/^A(3[0-9]|4[0-9]|5[0-9])/.test(r)) return true;
      if (/^E(3[1-9]|4[0-9])/.test(r)) return true;
      if (/^S(1|64|65)/.test(r)) return true;
      if (/^NA(3[0-9]|4[0-9])/.test(r)) return true;
      if (r === 'R8' || r === 'X1') return true;
      return false;
    }

    async function loadKmbRoutes() {
      try {
        const json = await fetchJSON('https://data.etabus.gov.hk/v1/transport/kmb/route/');
        if (!json.data) return [];
        const map = new Map();
        json.data.forEach(r => {
          const apiCo = (r.co || '').toLowerCase();
          const co = (apiCo === 'lwb' || isLwbRoute(r.route)) ? 'lwb' : 'kmb';
          const bound = (r.bound === 'I' || r.bound === 'i') ? 'in' : 'out';
          const st = String(r.service_type || '1');
          const key = r.route + '_' + co + '_' + bound + '_' + st;
          if (!map.has(key)) {
            map.set(key, {
              route: r.route,
              co,
              bound,
              orig: r.orig_tc || r.orig_en || '',
              dest: r.dest_tc || r.dest_en || '',
              service_type: st
            });
          }
        });
        return Array.from(map.values());
      } catch (e) {
        console.warn('KMB route load failed', e);
        return [];
      }
    }

    async function loadCtbRoutes() {
      try {
        let json;
        try {
          json = await fetchJSON('https://rt.data.gov.hk/v2/transport/citybus/route/CTB');
        } catch {
          json = await fetchJSON('https://rt.data.gov.hk/v1/transport/citybus-nwfb/route/ctb');
        }
        if (!json.data) return [];
        const list = [];
        const seen = new Set();
        json.data.forEach(r => {
          if (seen.has(r.route)) return;
          seen.add(r.route);
          const orig = r.orig_tc || r.orig_en || '';
          const dest = r.dest_tc || r.dest_en || '';
          list.push({ route: r.route, co: 'ctb', bound: 'out', orig, dest });
          if (orig || dest) {
            list.push({ route: r.route, co: 'ctb', bound: 'in', orig: dest, dest: orig });
          }
        });
        return list;
      } catch (e) {
        console.warn('CTB route load failed', e);
        return [];
      }
    }

    async function loadGmbRoutes() {
      try {
        const json = await fetchJSON('https://data.etagmb.gov.hk/route');
        if (!json.data || !json.data.routes) return [];
        const routes = [];
        for (const [region, codes] of Object.entries(json.data.routes)) {
          codes.forEach(code => {
            routes.push({
              route: code, co: 'gmb', region,
              orig: '', dest: '', needsDetail: true
            });
          });
        }
        const map = new Map();
        routes.forEach(r => {
          const key = r.route + '_' + r.region + '_gmb';
          if (!map.has(key)) map.set(key, r);
        });
        return Array.from(map.values());
      } catch (e) {
        console.warn('GMB route load failed', e);
        return [];
      }
    }

    const MTR_BUS_STATIC = [

    async function initApp() {
      initKeypad();
      loadWeather();
      
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<div class="loading-state">載入路線資料中...</div>';

      try {
        const [kmb, ctb, gmb] = await Promise.all([
          loadKmbRoutes(),
          loadCtbRoutes(),
          loadGmbRoutes()
        ]);
        ALL_ROUTES = [...kmb, ...ctb, ...gmb, ...MTR_BUS_STATIC];
      } catch (e) {
        console.error('路線資料載入失敗，使用備用資料', e);
        ALL_ROUTES = LOCAL_FALLBACK;
      }
      
      routesLoaded = true;
      handleSearchInput('');
    }

    // ========== 天氣模組修復 ==========
    async function loadWeather() {
      const weatherBar = document.getElementById('weatherBar');
      try {
        const [wxData, warnData] = await Promise.all([
          fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
          fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc')
        ]);

        let temp = '--';
        if (wxData.temperature && wxData.temperature.data) {
          const hk = wxData.temperature.data.find(t => t.place === '香港天文台') || wxData.temperature.data[0];
          if (hk) temp = hk.value;
        }

        let iconHtml = '';
        if (wxData.icon && wxData.icon.length > 0) {
          const iconCode = wxData.icon[0];
          iconHtml = `<img class="weather-icon" src="https://www.hko.gov.hk/images/HKO_flaticon/pic${iconCode}.png" alt="weather">`;
        }

        let warnsHtml = '';
        if (warnData) {
          Object.values(warnData).forEach(w => {
            if (w && w.name) {
              let colorClass = 'red';
              const name = w.name;
              if (name.includes('黃')) colorClass = 'yellow';
              else if (name.includes('紅') || name.includes('黃色暴雨')) colorClass = 'amber';
              else if (name.includes('黑')) colorClass = 'black';
              else if (name.includes('雷暴') || name.includes('強烈季候風')) colorClass = 'blue';
              warnsHtml += `<span class="wx-warn-badge ${colorClass}">${name}</span>`;
            }
          });
        }

        weatherBar.className = 'weather-bar';
        weatherBar.innerHTML = `
          <div class="weather-main">
            ${iconHtml}
            <div class="weather-temp">${temp}°C</div>
            <div class="weather-meta">
              <div class="wx-line">香港天文台即時天氣</div>
              ${warnsHtml ? `<div class="weather-warns">${warnsHtml}</div>` : ''}
            </div>
          </div>
        `;
      } catch (e) {
        console.warn('Weather update failed', e);
        weatherBar.className = 'weather-bar wx-loading';
        weatherBar.textContent = '天氣資料暫時未能更新';
      }
    }

    // ========== 虛擬鍵盤事件修正 ==========
    function initKeypad() {
      const keypad = document.getElementById('keypad');
      const input = document.getElementById('routeInput');

      keypad.addEventListener('click', (e) => {
        const btn = e.target.closest('button.key');
        if (!btn) return;
        
        const key = btn.dataset.k;
        if (!key) return;

        if (key === 'clear') {
          input.value = '';
        } else if (key === 'back') {
          input.value = input.value.slice(0, -1);
        } else {
          input.value += key;
        }
        
        handleSearchInput(input.value);
      });
    }

    function handleSearchInput(val) {
      const resultsDiv = document.getElementById('results');
      const query = val.trim().toUpperCase();

      if (!query) {
        resultsDiv.innerHTML = '<div class="home-hint">請使用下方鍵盤輸入路線號碼</div>';
        return;
      }

      const filtered = ALL_ROUTES.filter(r => r.route.toUpperCase().startsWith(query));

      if (filtered.length === 0) {
        resultsDiv.innerHTML = '<div class="empty-state">未有找到相關路線</div>';
        return;
      }

      let html = '';
      filtered.slice(0, 50).forEach((item, index) => {
        const coText = CO_NAMES[item.co] || item.co.toUpperCase();
        const destText = item.dest ? `往 ${item.dest}` : '';
        html += `
          <div class="result-item" onclick="selectRoute(${index})">
            <div class="result-num ${plateClass(item)}">${item.route}</div>
            <div class="result-info">
              <div class="result-dest">${destText}</div>
              <div class="result-co">${coText}</div>
            </div>
            <div class="result-arrow">›</div>
          </div>
        `;
      });
      resultsDiv.innerHTML = html;
      window.currentSearchResults = filtered.slice(0, 50);
    }

    function selectRoute(index) {
      const item = window.currentSearchResults[index];
      if (!item) return;
      alert(`已選擇路線: ${item.route} (往 ${item.dest || '未知'})`);
    }

    function goSearch() {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('pageSearch').classList.add('active');
    }

    function goStops() {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('pageStops').classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
