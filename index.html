            font-weight: 600;
            cursor: pointer;

        .theme-btn.active-pink {

            background: #fce4ec;
            color: #c2185b;

            font-weight: bold;

    <script>
        const media = document.getElementById('mediaPlayer');
        const videoContainer = document.getElementById('videoContainer');
        const statusCard = document.getElementById('statusCard');
        const currentChannelEl = document.getElementById('currentChannel');
        const currentStateEl = document.getElementById('currentState');
        const themeColorMeta = document.getElementById('themeColorMeta');
        let activeId = null;
        let hls = null;

        function setTheme(theme) {
            document.body.classList.remove('theme-pink', 'theme-blue');
            document.body.classList.add(theme === 'blue' ? 'theme-blue' : 'theme-pink');
            document.getElementById('btnPink').classList.toggle('active-pink', theme === 'pink');
            document.getElementById('btnBlue').classList.toggle('active-blue', theme === 'blue');

            const bgColor = theme === 'blue' ? '#9fc8e8' : '#f5c6d0';
            if (themeColorMeta) {
                themeColorMeta.setAttribute('content', bgColor);
            }

            try { localStorage.setItem('radioTheme', theme); } catch (e) {}
        }

        (function () {
            let saved = 'pink';
            try { saved = localStorage.getItem('radioTheme') || 'pink'; } catch (e) {}
            setTheme(saved);
        })();

        function destroyHls() {
            if (hls) {
                hls.destroy();
                hls = null;
            }
        }

        function playChannel(e, id, name, url, isVideo = false) {
            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.play-icon').forEach(icon => {
                if (icon.textContent !== '↗') icon.textContent = '▶';
            });

            e.currentTarget.classList.add('active');
            const icon = document.getElementById(`icon-${id}`);
            if (icon) icon.textContent = '🔊';

            currentChannelEl.textContent = name;
            currentStateEl.textContent = "連線中，請稍候...";
            statusCard.classList.remove('playing');

            activeId = id;

            if (isVideo) {
                videoContainer.classList.add('show');
            } else {
                videoContainer.classList.remove('show');
            }

            destroyHls();
            media.pause();
            media.removeAttribute('src');
            media.load();

            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90
                });
                hls.loadSource(url);
                hls.attachMedia(media);

                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    const playPromise = media.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            currentStateEl.textContent = "正在播放中 🟢";
                            statusCard.classList.add('playing');
                        }).catch(() => {
                            currentStateEl.textContent = "播放失敗，請再試一次";
                            statusCard.classList.remove('playing');
                        });
                    }
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        currentStateEl.textContent = "連線失敗，請再試一次";
                        statusCard.classList.remove('playing');
                        destroyHls();
                    }
                });

            } else if (media.canPlayType('application/vnd.apple.mpegurl')) {
                media.src = url;
                const playPromise = media.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        currentStateEl.textContent = "正在播放中 🟢";
                        statusCard.classList.add('playing');
                    }).catch(() => {
                        currentStateEl.textContent = "播放失敗，請再試一次";
                        statusCard.classList.remove('playing');
                    });
                }
            } else {
                currentStateEl.textContent = "此瀏覽器不支援此串流";
                statusCard.classList.remove('playing');
            }
        }

        function openOfficial(url) {
            stopAudio();
            currentChannelEl.textContent = "已開啟官方網頁";
            currentStateEl.textContent = "本頁播放已停止";
            window.open(url, '_blank');
        }

        function stopAudio() {
            destroyHls();
            media.pause();
            media.removeAttribute('src');
            media.load();
            activeId = null;

            videoContainer.classList.remove('show');

            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.play-icon').forEach(icon => {
                if (icon.textContent !== '↗') icon.textContent = '▶';
            });
            currentChannelEl.textContent = "已停止播放";
            currentStateEl.textContent = "請選擇上方電台播放";
            statusCard.classList.remove('playing');
        }

        media.addEventListener('pause', () => {
            if (activeId && !media.ended) {
                currentStateEl.textContent = "已暫停";
                statusCard.classList.remove('playing');
            }
        });
        media.addEventListener('playing', () => {
            currentStateEl.textContent = "正在播放中 🟢";
            statusCard.classList.add('playing');
        });
        media.addEventListener('error', () => {
            currentStateEl.textContent = "連線失敗，請再試一次";
            statusCard.classList.remove('playing');
        });
    </script>
</body>
</html>
