<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港巴士到站時間</title>
  <style>
    :root {
      --primary: #00A0E9;
      --primary-dark: #0088cc;
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #e5e5ea;
      --green: #34c759;
      --amber: #ff9500;
      --red: #ff3b30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }

    /* Header */
    .header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 14px 16px 12px;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: 1px;
    }

    /* Search input area */
    .search-box {
      background: white;
      padding: 12px 16px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.2rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #fafafa;
      font-family: inherit;
      letter-spacing: 1px;
      text-align: center;
      font-weight: 600;
    }
    .search-input:focus { border-color: var(--primary); background: white; }
    .search-input::placeholder { color: #c7c7cc; font-weight: 400; letter-spacing: 0; }

    /* Results list */
    .results {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .result-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 12px;
      transition: background 0.1s;
    }
    .result-item:active { background: #f2f2f7; }
    
    .result-num {
      font-size: 1.725rem;
      font-weight: 700;
      min-width: 64px;
      text-align: center;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    
    .plate-kmb { background: #E4002B; color: #fff; }          /* 九巴紅 */
    .plate-lwb { background: #F15A22; color: #fff; }          /* 龍運橙 */
    .plate-ctb { background: #FFD100; color: #1a1a1a; }       /* 城巴黃 */
    .plate-nlb { background: #007A3D; color: #fff; }          /* 嶼巴綠 */
    .plate-gmb { background: #00A651; color: #fff; }          /* 小巴綠 */
    .plate-mtrbus { background: #0077C8; color: #fff; }       /* 港鐵藍 */
    .result-info { flex: 1; min-width: 0; }
    .result-dest {
      font-size: 0.98rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-co {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .result-arrow {
      color: #c7c7cc;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .empty-state, .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .error-state {
      text-align: center;
      padding: 24px 20px;
      color: var(--red);
      font-size: 0.9rem;
    }

    /* Keypad */
    .keypad {
      flex-shrink: 0;
      background: #5a6570;
      padding: 8px 6px 10px;
      user-select: none;
    }
    .keypad-main {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .num-pad {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .letter-pad {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 200px;
      overflow-y: auto;
    }
    .key-row {
      display: flex;
      gap: 5px;
      justify-content: center;
    }
    .key {
      flex: 1;
      height: 44px;
      border: none;
      border-radius: 8px;
      background: white;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      touch-action: manipulation;
    }
    .key:active {
      background: #d1d1d6;
      transform: scale(0.96);
    }
    .key-letter {
      background: #d8dce0;
      color: #1c1c1e;
      font-size: 1rem;
      height: 44px;
    }
    .key-letter:active { background: #b0b6bc; }
    .key-func {
      background: #8e99a4;
      color: white;
      font-size: 1.1rem;
    }
    .key-func:active { background: #6d7883; }

    /* Sub pages */
    .page { display: none; flex-direction: column; height: 100%; }
    .page.active { display: flex; }

    .page-header {
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 8px;
      flex-shrink: 0;
      gap: 4px;
    }
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.4rem;
      padding: 4px 10px;
      cursor: pointer;
      line-height: 1;
    }
    .page-title {
      flex: 1;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      margin-right: 36px;
    }

    .stop-list, .eta-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .stop-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stop-item:active { background: #f2f2f7; }
    .stop-seq {
      font-size: 0.85rem;
      color: var(--muted);
      min-width: 28px;
      font-weight: 600;
    }
    .stop-name { font-size: 0.98rem; font-weight: 500; flex: 1; }

    .eta-header-info {
      background: #1c1c1e;
      color: white;
      padding: 16px;
    }
    .eta-route-num {
      font-size: 2.1rem;
      font-weight: 700;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .eta-route-num.plate-kmb { background: #E4002B; color: #fff; }
    .eta-route-num.plate-lwb { background: #F15A22; color: #fff; }
    .eta-route-num.plate-ctb { background: #FFD100; color: #1a1a1a; }
    .eta-route-num.plate-nlb { background: #007A3D; color: #fff; }
    .eta-route-num.plate-gmb { background: #00A651; color: #fff; }
    .eta-route-num.plate-mtrbus { background: #0077C8; color: #fff; }
    .eta-dest-text { font-size: 0.95rem; color: #aeaeb2; margin-top: 4px; }
    .eta-stop-text { font-size: 0.9rem; margin-top: 8px; }
    .eta-co-badge {
      display: inline-block;
      background: #3a3a3c;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.72rem;
      margin-top: 6px;
    }
    .eta-rows { padding: 8px 0; }
    .eta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .eta-mins {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--green);
    }
    .eta-toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: white;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .eta-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #f2f2f7;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- ========== PAGE: SEARCH ========== -->
    <div class="page active" id="pageSearch">
      <div class="header">搜尋</div>
      <div class="search-box">
        <input type="text" class="search-input" id="routeInput" placeholder="輸入路線號碼" readonly inputmode="none">
      </div>
      <div class="results" id="results">
        <div class="empty-state">輸入路線號碼開始搜尋</div>
      </div>
      <div class="keypad" id="keypad">
        <div class="keypad-main">
          <!-- 數字鍵盤 -->
          <div class="num-pad">
            <div class="key-row">
              <button class="key" data-k="1">1</button>
              <button class="key" data-k="2">2</button>
              <button class="key" data-k="3">3</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="4">4</button>
              <button class="key" data-k="5">5</button>
              <button class="key" data-k="6">6</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="7">7</button>
              <button class="key" data-k="8">8</button>
              <button class="key" data-k="9">9</button>
            </div>
            <div class="key-row">
              <button class="key key-func" data-k="clear">✕</button>
              <button class="key" data-k="0">0</button>
              <button class="key key-func" data-k="back">⌫</button>
            </div>
          </div>
          <!-- 英文字母鍵盤 -->
          <div class="letter-pad" id="letterKeys"></div>
        </div>
      </div>
    </div>

    <!-- ========== PAGE: STOPS ========== -->
    <div class="page" id="pageStops">
      <div class="page-header">
        <button class="back-btn" onclick="showPage('pageSearch')">‹</button>
        <div class="page-title" id="stopsTitle">選擇車站</div>
      </div>
      <div class="stop-list" id="stopList">
        <div class="loading-state">載入車站中...</div>
      </div>
    </div>

    <!-- ========== PAGE: ETA ========== -->
    <div class="page" id="pageEta">
      <div class="page-header">
        <button class="back-btn" onclick="showPage('pageStops')">‹</button>
        <div class="page-title">預計到站</div>
      </div>
      <div class="eta-area" id="etaArea">
        <div class="eta-header-info">
          <div class="eta-route-num" id="etaRoute">—</div>
          <div class="eta-dest-text" id="etaDest">—</div>
          <div class="eta-stop-text" id="etaStopName">—</div>
          <div class="eta-co-badge" id="etaCo">—</div>
        </div>
        <div class="eta-rows" id="etaRows"></div>
      </div>
      <div class="eta-toolbar">
        <button class="eta-btn" onclick="fetchETA()">🔄 刷新</button>
      </div>
    </div>

  </div>

  <script>
    const LETTERS = ['A','B','C','D','E','F','H','K','M','N','P','R','S','T','W','X'];
    const CO_NAMES = {
      kmb: '九巴',
      lwb: '龍運',
      ctb: '城巴',
      nlb: '嶼巴',
      gmb: '專線小巴',
      mtrbus: '港鐵巴士'
    };

    // 動態建構英文字盤 (每行 3-4 個按鈕)
    const letterBox = document.getElementById('letterKeys');
    for (let i = 0; i < LETTERS.length; i += 3) {
      const row = document.createElement('div');
      row.className = 'key-row';
      LETTERS.slice(i, i + 3).forEach(L => {
        const b = document.createElement('button');
        b.className = 'key key-letter';
        b.dataset.k = L;
        b.textContent = L;
        row.appendChild(b);
      });
      letterBox.appendChild(row);
    }

    let inputVal = '';
    let searchTimer = null;

    // 頁面切換控制
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    // 鍵盤點擊監聽事件
    document.getElementById('keypad').addEventListener('click', e => {
      const btn = e.target.closest('[data-k]');
      if (!btn) return;
      
      const k = btn.dataset.k;
      if (k === 'clear') {
        inputVal = '';
      } else if (k === 'back') {
        inputVal = inputVal.slice(0, -1);
      } else {
        if (inputVal.length >= 6) return;
        inputVal += k;
      }
      document.getElementById('routeInput').value = inputVal;
      scheduleSearch();
    });

    function scheduleSearch() {
      clearTimeout(searchTimer);
      if (!inputVal) {
        document.getElementById('results').innerHTML = '<div class="empty-state">輸入路線號碼開始搜尋</div>';
        return;
      }
      document.getElementById('results').innerHTML = '<div class="loading-state">搜尋中...</div>';
      searchTimer = setTimeout(() => doSearch(inputVal), 300);
    }

    async function doSearch(route) {
      route = route.toUpperCase();
      try {
        const results = await Promise.allSettled([
          searchKMB(route),
          searchCTB(route)
        ]);
        let all = [];
        results.forEach(r => { if (r.status === 'fulfilled') all = all.concat(r.value || []); });
        
        if (all.length === 0) {
          document.getElementById('results').innerHTML = '<div class="error-state">找不到路線「' + route + '」</div>';
          return;
        }
        renderResults(all, route);
      } catch (e) {
        document.getElementById('results').innerHTML = '<div class="error-state">搜尋失敗，請重試</div>';
      }
    }

    function renderResults(list, route) {
      const el = document.getElementById('results');
      el.innerHTML = '';
      list.forEach(m => {
        const div = document.createElement('div');
        div.className = 'result-item';
        const plate = 'plate-' + (m.co || 'kmb');
        div.innerHTML =
          '<div class="result-num ' + plate + '">' + route + '</div>' +
          '<div class="result-info">' +
            '<div class="result-dest">往 ' + m.dest + '</div>' +
            '<div class="result-co">' + CO_NAMES[m.co] + '</div>' +
          '</div>' +
          '<div class="result-arrow">›</div>';
        div.onclick = () => selectRoute(m, route);
        el.appendChild(div);
      });
    }

    async function searchKMB(route) {
      try {
        const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route/');
        if (!res.ok) return [];
        const data = (await res.json()).data || [];
        return data.filter(r => r.route.toUpperCase() === route).map(m => ({
          co: 'kmb', bound: m.bound, serviceType: m.service_type,
          dest: m.dest_tc
        }));
      } catch { return []; }
    }

    async function searchCTB(route) {
      try {
        const res = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route/CTB/' + route);
        if (!res.ok) return [];
        const json = await res.json();
        if (!json.data) return [];
        return [{
          co: 'ctb', bound: 'O', serviceType: '1',
          dest: json.data.dest_tc
        }];
      } catch { return []; }
    }

    function selectRoute(m, route) {
      showPage('pageStops');
      document.getElementById('stopsTitle').textContent = route + ' 往 ' + m.dest;
      document.getElementById('stopList').innerHTML = '<div class="empty-state">（車站載入範例）</div>';
    }

    function fetchETA() {
      // 預留 ETA 刷新邏輯
    }
  </script>
</body>
</html>
