  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    :root {
      --primary: #00A0E9;
      --primary-dark: #0088cc;
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #e5e5ea;
      --green: #34c759;
      --amber: #ff9500;
      --red: #ff3b30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }
    .header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 14px 16px 12px;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: 1px;
    }
    .search-box {
      background: white;
      padding: 12px 16px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.2rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #fafafa;
      font-family: inherit;
      letter-spacing: 1px;
      text-align: center;
      font-weight: 600;
    }
    .search-input:focus { border-color: var(--primary); background: white; }
    .search-input::placeholder { color: #c7c7cc; font-weight: 400; letter-spacing: 0; }
    .results {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .result-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 12px;
      transition: background 0.1s;
    }
    .result-item:active { background: #f2f2f7; }
    .result-num {
      font-size: 1.5rem;
      font-weight: 700;
      min-width: 64px;
      text-align: center;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .plate-kmb { background: #E4002B; color: #fff; }
    .plate-lwb { background: #FF6200; color: #fff; }
    .plate-ctb { background: #FFD100; color: #1a1a1a; }
    .plate-nlb { background: #007A3D; color: #fff; }
    .plate-gmb { background: #00A651; color: #fff; }
    .plate-gmb-hki { background: #5AC8FA; color: #1a1a1a; }
    .plate-gmb-kln { background: #39FF14; color: #1a1a1a; }
    .plate-gmb-nt  { background: #C5A3FF; color: #1a1a1a; }
    .plate-mtrbus { background: #0077C8; color: #fff; }
    .result-info { flex: 1; min-width: 0; }
    .result-dest {
      font-size: 0.98rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-co {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .result-arrow {
      color: #c7c7cc;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .empty-state, .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .keypad {
      flex-shrink: 0;
      background: #5a6570;
      padding: 8px 6px 6px;
      user-select: none;
    }
    .weather-bar {
      flex-shrink: 0;
      background: #1c1c1e;
      color: #f2f2f7;
      padding: 8px 12px 10px;
      font-size: 0.78rem;
      border-top: 1px solid #3a3a3c;
    }
    .weather-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .weather-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .weather-temp {
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .weather-meta {
      flex: 1;
      min-width: 0;
      line-height: 1.35;
    }
    .weather-meta .wx-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #aeaeb2;
    }
    .weather-meta .wx-line strong {
      color: #f2f2f7;
      font-weight: 600;
    }
    .weather-warns {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .wx-warn-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      background: #ff3b30;
      color: #fff;
    }
    .wx-warn-badge.yellow { background: #ffcc00; color: #1a1a1a; }
    .wx-warn-badge.amber { background: #ff9500; color: #1a1a1a; }
    .wx-warn-badge.red { background: #ff3b30; color: #fff; }
    .wx-warn-badge.black { background: #1c1c1e; color: #fff; border: 1px solid #aeaeb2; }
    .wx-warn-badge.blue { background: #007aff; color: #fff; }
    .wx-forecast {
      margin-top: 5px;
      color: #8e8e93;
      font-size: 0.72rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .weather-bar.wx-loading { color: #8e8e93; text-align: center; padding: 12px; }
    .key-row {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
      justify-content: center;
    }
    .key-row:last-child { margin-bottom: 0; }
    .key {
      flex: 1;
      max-width: 72px;
      height: 46px;
      border: none;
      border-radius: 8px;
      background: white;
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      transition: background 0.08s, transform 0.05s;
    }
    .key:active {
      background: #d1d1d6;
      transform: scale(0.96);
    }
    .key-letter {
      max-width: 48px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.05rem;
      background: #d8dce0;
      color: #1c1c1e;
      flex: 0 0 42px;
    }
    .key-letter:active { background: #b0b6bc; }
    .key-func {
      background: #8e99a4;
      color: white;
      font-size: 1.1rem;
    }
    .key-func:active { background: #6d7883; }
    .keypad-main {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .num-pad {
      flex: 1.15;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .letter-pad {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .page { display: none; flex-direction: column; height: 100%; }
    .page.active { display: flex; }
    .page-header {
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 8px;
      flex-shrink: 0;
      gap: 4px;
    }
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.4rem;
      padding: 4px 10px;
      cursor: pointer;
      line-height: 1;
    }
    .page-title {
      flex: 1;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      margin-right: 36px;
    }
    .stop-list, .eta-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
      min-height: 0;
    }
    .stops-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }
    .map-wrap {
      height: 42%;
      min-height: 180px;
      max-height: 320px;
      position: relative;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: #e8eef3;
    }

  <script>
    const CO_NAMES = {
      kmb: '九巴', lwb: '龍運巴士', ctb: '城巴', nlb: '嶼巴',
      gmb: '專線小巴', mtrbus: '港鐵巴士'
    };

    function plateClass(item) {
      if (item.co === 'gmb' && item.region) {
        const r = (item.region || '').toUpperCase();
        if (r === 'HKI') return 'plate-gmb-hki';
        if (r === 'KLN') return 'plate-gmb-kln';
        if (r === 'NT')  return 'plate-gmb-nt';
      }
      return 'plate-' + (item.co || 'kmb');
    }

    let ALL_ROUTES = [];
    let routesLoaded = false;

    const LOCAL_FALLBACK = [
      { route: '1A', co: 'kmb', bound: 'out', orig: '中秀茂坪', dest: '尖沙咀碼頭', service_type: '1' },
      { route: '1A', co: 'kmb', bound: 'in', orig: '尖沙咀碼頭', dest: '中秀茂坪', service_type: '1' },
      { route: '16', co: 'kmb', bound: 'out', orig: '藍田(廣田邨)', dest: '旺角(柏景灣)', service_type: '1' },
      { route: '16', co: 'kmb', bound: 'in', orig: '旺角(柏景灣)', dest: '藍田(廣田邨)', service_type: '1' },
      { route: '101', co: 'kmb', bound: 'out', orig: '堅尼地城', dest: '觀塘(裕民坊)', service_type: '1' },
      { route: 'E31', co: 'lwb', bound: 'out', orig: '荃灣(愉景新城)', dest: '逸東邨', service_type: '1' },
      { route: 'A11', co: 'ctb', orig: '北角碼頭', dest: '機場' }
    ];

    async function fetchJSON(url, options = {}, timeoutMs = 12000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        if (!res.ok) {
          const err = new Error(`HTTP ${res.status}`);
          err.status = res.status;
          throw err;
        }
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    // 龍運巴士路線辨識（KMB API 多數不帶 co 欄位）
    function isLwbRoute(route) {
      const r = String(route || '').toUpperCase();
      // 機場 A 線（龍運營運，不含城巴 A10–A29 等）
      if (/^A(3[0-9]|4[0-9]|5[0-9])/.test(r)) return true;
      // 北大嶼山對外 E 線
      if (/^E(3[1-9]|4[0-9])/.test(r)) return true;
      // 機場穿梭 S 線
      if (/^S(1|64|65)/.test(r)) return true;
      // 通宵機場 NA 線
      if (/^NA(3[0-9]|4[0-9])/.test(r)) return true;
      // 其他龍運：R8、X1 等
      if (r === 'R8' || r === 'X1') return true;
      return false;
    }

    // ========== 路線載入（修正：保留 KMB 雙方向） ==========
    async function loadKmbRoutes() {
      try {
        const json = await fetchJSON('https://data.etabus.gov.hk/v1/transport/kmb/route/');
        if (!json.data) return [];
        const map = new Map();
        json.data.forEach(r => {
          const apiCo = (r.co || '').toLowerCase();
          const co = (apiCo === 'lwb' || isLwbRoute(r.route)) ? 'lwb' : 'kmb';
          const bound = (r.bound === 'I' || r.bound === 'i') ? 'in' : 'out';
          const st = String(r.service_type || '1');
          // 以 route + co + bound + service_type 作為唯一鍵，保留雙方向
          const key = r.route + '_' + co + '_' + bound + '_' + st;
          if (!map.has(key)) {
            map.set(key, {
              route: r.route,
              co,
              bound,
              orig: r.orig_tc || r.orig_en || '',
              dest: r.dest_tc || r.dest_en || '',
              service_type: st
            });
          }
        });
        return Array.from(map.values());
      } catch (e) {
        console.warn('KMB route load failed', e);
        return [];
      }
    }

    async function loadCtbRoutes() {
      try {
        let json;
        try {
          json = await fetchJSON('https://rt.data.gov.hk/v2/transport/citybus/route/CTB');
        } catch {
          json = await fetchJSON('https://rt.data.gov.hk/v1/transport/citybus-nwfb/route/ctb');
        }
        if (!json.data) return [];
        const list = [];
        const seen = new Set();
        json.data.forEach(r => {
          if (seen.has(r.route)) return;
          seen.add(r.route);
          const orig = r.orig_tc || r.orig_en || '';
          const dest = r.dest_tc || r.dest_en || '';
          // 直接產生來回兩個方向，搜尋結果無需再選方向
          list.push({
            route: r.route, co: 'ctb', bound: 'out',
            orig, dest
          });
          if (orig || dest) {
            list.push({
              route: r.route, co: 'ctb', bound: 'in',
              orig: dest, dest: orig
            });
          }
        });
        return list;
      } catch (e) {
        console.warn('CTB route load failed', e);
        return [];
      }
    }

    async function loadGmbRoutes() {
      // 使用內建靜態資料（避免 CORS／本機 file:// 無法連 API）
      try {
        if (typeof GMB_STATIC === 'undefined' || !GMB_STATIC.length) return [];
        const routes = [];
        GMB_STATIC.forEach(rd => {
          const dirs = rd.dirs || [];
          if (dirs.length) {
            dirs.forEach(d => {
              routes.push({
                route: String(rd.r),
                co: 'gmb',
                region: rd.g,
                bound: d.s === 1 ? 'out' : 'in',
                gmbRouteId: rd.id,
                gmbRouteSeq: d.s || 1,
                orig: d.o || '',
                dest: d.d || '',
                needsDetail: false,
                gmbDesc: rd.desc || ''
              });
            });
          } else {
            routes.push({
              route: String(rd.r), co: 'gmb', region: rd.g,
              gmbRouteId: rd.id, orig: '', dest: '', needsDetail: false
            });
          }
        });
        return routes;
      } catch (e) {
        console.warn('GMB static load failed', e);
        return [];
      }
    }

    // 港鐵巴士路線（opendata.mtr.com.hk CSV 無 CORS，改用內建清單）
    const MTR_BUS_STATIC = [
{ route: 'K12', co: 'mtrbus', bound: 'out', orig: '大埔墟站', dest: '八號花園' },
      { route: 'K12', co: 'mtrbus', bound: 'in', orig: '八號花園', dest: '大埔墟站' },
      { route: 'K14', co: 'mtrbus', bound: 'out', orig: '大埔超級城', dest: '大埔墟站' },
      { route: 'K17', co: 'mtrbus', bound: 'out', orig: '大埔墟站', dest: '富善' },
      { route: 'K17', co: 'mtrbus', bound: 'in', orig: '富善', dest: '大埔墟站' },
      { route: 'K18', co: 'mtrbus', bound: 'out', orig: '大埔墟站', dest: '廣福' },
      { route: 'K18', co: 'mtrbus', bound: 'in', orig: '廣福', dest: '大埔墟站' },
      { route: 'K51', co: 'mtrbus', bound: 'out', orig: '富泰', dest: '大欖' },
      { route: 'K51', co: 'mtrbus', bound: 'in', orig: '大欖', dest: '富泰' },
      { route: 'K51A', co: 'mtrbus', bound: 'out', orig: '富泰', dest: '掃管笏村' },
      { route: 'K51A', co: 'mtrbus', bound: 'in', orig: '掃管笏村', dest: '富泰' },
      { route: 'K52', co: 'mtrbus', bound: 'out', orig: '悅湖山莊', dest: '龍鼓灘' },
      { route: 'K52', co: 'mtrbus', bound: 'in', orig: '龍鼓灘', dest: '悅湖山莊' },
      { route: 'K52A', co: 'mtrbus', bound: 'out', orig: '屯門站 (輕鐵屯門站)', dest: '曾咀 (曾咀靈灰安置所)' },
      { route: 'K52A', co: 'mtrbus', bound: 'in', orig: '曾咀 (曾咀靈灰安置所)', dest: '屯門站 (輕鐵屯門站)' },

    async function loadMtrBusRoutes() {
      // 優先嘗試線上 CSV（若未來開放 CORS），失敗則用內建清單
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 6000);
        const res = await fetch('https://opendata.mtr.com.hk/data/mtr_bus_routes.csv', { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = (await res.text()).replace(/^\uFEFF/, '');
        const lines = text.trim().split('\n');
        if (lines.length < 2) throw new Error('empty');
        const map = new Map();
        for (let i = 1; i < lines.length; i++) {
          const cols = parseCSVLine(lines[i]);
          if (cols.length < 3) continue;
          const routeId = cols[0].trim();
          const nameChi = cols[1].trim();
          if (!map.has(routeId)) {
            let orig = '', dest = '';
            const parts = nameChi.split('至');
            if (parts.length >= 2) {
              orig = parts[0].trim();
              dest = parts.slice(1).join('至').replace(/\(循環線\)/g, '').trim();
            } else dest = nameChi;
            map.set(routeId, { route: routeId, co: 'mtrbus', orig, dest });
          }
        }
        const list = Array.from(map.values());
        if (list.length > 0) return list;
      } catch (e) {
        console.warn('MTR Bus online load failed, using static list', e);
      }
      return MTR_BUS_STATIC.slice();
    }

    async function loadNlbRoutes() {
      try {
        const json = await fetchJSON('https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list');
        if (!json.routes) return [];
        return json.routes.map(r => {
          const name = r.routeName_c || r.routeName_e || '';
          let orig = '', dest = '';
          const parts = name.split(/\s*>\s*/);
          if (parts.length >= 2) {
            orig = parts[0].trim();
            dest = parts[1].trim();
          } else {
            dest = name;
          }
          return {
            route: r.routeNo,
            co: 'nlb',
            orig,
            dest,
            nlbRouteId: r.routeId
          };
        });
      } catch (e) {
        console.warn('NLB route load failed', e);
        return [];
      }
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') inQuotes = !inQuotes;
        else if (c === ',' && !inQuotes) { result.push(current); current = ''; }
        else current += c;
      }
      result.push(current);
      return result;
    }

    async function loadAllRoutes() {
      const el = document.getElementById('results');
      el.innerHTML = '<div class="loading-state">正在載入路線資料...</div>';
      const results = await Promise.allSettled([
        loadKmbRoutes(), loadCtbRoutes(), loadGmbRoutes(), loadMtrBusRoutes(), loadNlbRoutes()
      ]);
      const labels = ['九巴/龍運', '城巴', '專線小巴', '港鐵巴士', '嶼巴'];
      const failed = [];
      const arrays = results.map((r, i) => {
        if (r.status === 'fulfilled') return r.value || [];
        failed.push(labels[i]);
        return [];
      });
      const [kmb, ctb, gmb, mtrbus, nlb] = arrays;
      ALL_ROUTES = [...kmb, ...ctb, ...gmb, ...mtrbus, ...nlb];
      if (ALL_ROUTES.length === 0) {
        ALL_ROUTES = LOCAL_FALLBACK.slice();
        console.warn('Using local fallback routes');
        el.innerHTML = '<div class="empty-state">無法載入路線資料<br><small style="opacity:.7">請檢查網絡後重新整理頁面<br>目前使用備用路線</small></div>';
        setTimeout(() => { routesLoaded = true; renderHome(); }, 1500);
        routesLoaded = true;
        return;
      }
      if (failed.length) {
        console.warn('部分資料來源載入失敗:', failed.join(', '));
      }
      const seen = new Set();
      ALL_ROUTES = ALL_ROUTES.filter(r => {
        const k = r.route + '_' + r.co + (r.bound ? '_' + r.bound : '') + (r.service_type ? '_' + r.service_type : '') + (r.region ? '_' + r.region : '') + (r.nlbRouteId ? '_' + r.nlbRouteId : '');
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
      ALL_ROUTES.sort((a, b) => {
        const cmp = a.route.localeCompare(b.route, 'en', { numeric: true });
        if (cmp !== 0) return cmp;
        // 同一路線：out 在前、in 在後
        if (a.bound === 'out' && b.bound === 'in') return -1;
        if (a.bound === 'in' && b.bound === 'out') return 1;
        return (a.service_type || '1').localeCompare(b.service_type || '1');
      });
      routesLoaded = true;
      console.log('Loaded routes:', ALL_ROUTES.length);
      renderHome();
    }

    // ========== 收藏 & 歷史 ==========
    const LS_FAV = 'hkbus_fav_v1', LS_HIST = 'hkbus_hist_v1';
    const HIST_MAX = 20, FAV_MAX = 30;

    function loadJSON(key, fallback) {
      try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : fallback; }
      catch { return fallback; }
    }
    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }
    function routeKey(m) {
      return `${m.route}_${m.co}_${m.bound || 'out'}${m.region ? '_' + m.region : ''}${m.service_type ? '_' + m.service_type : ''}`;
    }
    function getFavs() { return loadJSON(LS_FAV, []); }
    function getHist() { return loadJSON(LS_HIST, []); }
    function isFav(m) {
      const k = routeKey(m);
      return getFavs().some(f => routeKey(f) === k);
    }
    function toggleFav(m) {
      let list = getFavs();
      const k = routeKey(m);
      const idx = list.findIndex(f => routeKey(f) === k);
      if (idx >= 0) list.splice(idx, 1);
      else { list.unshift(m); if (list.length > FAV_MAX) list = list.slice(0, FAV_MAX); }
      saveJSON(LS_FAV, list);
    }
    function addHistory(m) {
      let list = getHist();
      const k = routeKey(m);
      list = list.filter(f => routeKey(f) !== k);
      list.unshift(m);
      if (list.length > HIST_MAX) list = list.slice(0, HIST_MAX);
      saveJSON(LS_HIST, list);
    }
    function clearHistory() { saveJSON(LS_HIST, []); if (!inputVal) renderHome(); }
    function clearFavs() {
      if (!confirm('確定清除全部收藏？')) return;
      saveJSON(LS_FAV, []);
      if (!inputVal) renderHome();
      updateHeaderFavBtns();
    }
    function updateHeaderFavBtns() {
      if (!state.route || !state.co) return;
      const on = isFav(state);
      ['stopsFavBtn', 'etaFavBtn'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) { btn.textContent = on ? '★' : '☆'; btn.classList.toggle('on', on); }
      });
    }
    function toggleFavFromStops() {
      if (!state.route) return;
      toggleFav({
        route: state.route, co: state.co, bound: state.bound,
        dest: state.directionLabel, region: state.region,
        service_type: state.service_type
      });
      updateHeaderFavBtns();
    }

    function renderSavedItem(item, el) {
      const div = document.createElement('div');
      div.className = 'result-item';
      const plate = plateClass(item);
      const starOn = isFav(item);
      div.innerHTML = `
        <div class="result-num ${plate}">${item.route}</div>
        <div class="result-info">

    // 由靜態資料建立 route → regions 索引
    const GMB_INDEX = (() => {
      const idx = {};
      (typeof GMB_STATIC !== 'undefined' ? GMB_STATIC : []).forEach(x => {
        const c = String(x.r || '').toUpperCase();
        if (!idx[c]) idx[c] = [];
        if (x.g && idx[c].indexOf(x.g) < 0) idx[c].push(x.g);
      });
      return idx;
    })();

    let searchSeq = 0;
    const gmbCache = new Map(); // routeCode -> { items, ts }

    // 小巴 API 無 CORS：本機 file:// 會被瀏覽器攔截。
    // 路線搜尋改用內建 GMB_STATIC；車站／ETA 直連失敗時用 jina 代理。
    async function gmbApiFetch(url) {
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (res.ok) {
          const j = await res.json();
          if (j) return j;
        }
      } catch (e) {
        console.warn('GMB direct failed', e.message || e);
      }
      try {
        const proxy = 'https://r.jina.ai/' + url;
        const res = await fetch(proxy, { cache: 'no-store' });
        const text = await res.text();
        // jina 回傳可能夾雜 Markdown，抽出 JSON
        const m = text.match(/\{[\s\S]*\}/);
        if (m) return JSON.parse(m[0]);
      } catch (e) {
        console.warn('GMB proxy failed', e.message || e);
      }
      return null;
    }

    function gmbItemsFromStatic(code) {
      const found = [];
      const list = (typeof GMB_STATIC !== 'undefined' ? GMB_STATIC : []).filter(
        x => String(x.r || '').toUpperCase() === code
      );
      list.forEach(rd => {
        const desc = (rd.desc && String(rd.desc).trim() && !/^正常班次/.test(rd.desc))
          ? String(rd.desc).trim() : '';
        const dirs = (rd.dirs && rd.dirs.length) ? rd.dirs : [{ s: 1, o: '', d: code }];
        dirs.forEach(d => {
          const bound = d.s === 1 ? 'out' : 'in';
          found.push({
            route: code,
            co: 'gmb',
            region: rd.g,
            bound,
            gmbRouteId: rd.id,
            gmbRouteSeq: d.s || (bound === 'out' ? 1 : 2),
            needsDetail: false,
            orig: d.o || '',
            dest: d.d || '',
            gmbDesc: desc,
            directions: dirs.map(x => ({
              bound: x.s === 1 ? 'out' : 'in',
              orig: x.o || '',
              dest: x.d || '',
              route_seq: x.s
            }))
          });
        });
      });
      return found;
    }

    async function fetchGmbOnDemand(routeCode) {
      const code = String(routeCode || '').toUpperCase().trim();
      if (!code) return [];
      const cached = gmbCache.get(code);
      if (cached && cached.items.length && (Date.now() - cached.ts < 30 * 60 * 1000)) {
        return cached.items.slice();
      }
      // 完全本機靜態資料，不依賴網絡／CORS
      const found = gmbItemsFromStatic(code);
      if (found.length) {
        gmbCache.set(code, { items: found, ts: Date.now() });
      }
      return found.slice();
    }

    function sortSearchMatches(matches, query) {
      matches.sort((a, b) => {
        const aExact = a.route.toUpperCase() === query ? 0 : 1;
        const bExact = b.route.toUpperCase() === query ? 0 : 1;
        if (aExact !== bExact) return aExact - bExact;
        if (aExact === 0 && bExact === 0) {
          const aG = a.co === 'gmb' ? 0 : 1;
          const bG = b.co === 'gmb' ? 0 : 1;
          if (aG !== bG) return aG - bG;
        }
        const cmp = a.route.localeCompare(b.route, 'en', { numeric: true });
        if (cmp !== 0) return cmp;
        if (a.bound === 'out' && b.bound === 'in') return -1;
        if (a.bound === 'in' && b.bound === 'out') return 1;
        if (a.co === 'gmb' && b.co === 'gmb') {
          return (a.region || '').localeCompare(b.region || '');
        }
        return 0;
      });
      return matches;
    }

    function gmbPlaceholdersFromIndex(query) {
      if (typeof GMB_INDEX === 'undefined' || !GMB_INDEX[query]) return [];
      return GMB_INDEX[query].map(region => ({
        route: query,
        co: 'gmb',
        region,
        bound: 'out',
        needsDetail: true,
        orig: '',
        dest: '',
        gmbRouteId: null,
        gmbRouteSeq: 1
      }));
    }

    function collectLocalMatches(query) {
      let matches = routesLoaded
        ? ALL_ROUTES.filter(r => r.route.toUpperCase().startsWith(query))
        : [];
      // 去掉未完成的 exact 小巴，稍後用 live / index 補上
      matches = matches.filter(m => !(m.co === 'gmb' && m.route.toUpperCase() === query));
      const cached = gmbCache.get(query);
      if (cached && cached.items && cached.items.length) {
        matches = cached.items.concat(matches);
      } else {
        matches = gmbPlaceholdersFromIndex(query).concat(matches);
      }
      return sortSearchMatches(matches, query).slice(0, 50);
    }

    let gmbSearchTimer = null;

    function searchRoute(val) {
      const el = document.getElementById('results');
      const query = val.trim().toUpperCase();
      searchSeq++;
      el.innerHTML = '';
      if (!query) { renderHome(); return; }

      // 本機巴士路線 + 內建小巴靜態資料（file:// 無需 API）
      let matches = routesLoaded
        ? ALL_ROUTES.filter(r => r.route.toUpperCase().startsWith(query))
        : [];
      matches = matches.filter(m => !(m.co === 'gmb' && m.route.toUpperCase() === query));
      const gmbLive = gmbItemsFromStatic(query);
      if (gmbLive.length) matches = gmbLive.concat(matches);
      matches = sortSearchMatches(matches, query).slice(0, 50);

      if (matches.length === 0) {
        el.innerHTML = `<div class="empty-state">找不到「${query}」路線<br><small style="opacity:.7">小巴請輸入完整號碼（如 26、46、16A）</small></div>`;
        return;
      }
      renderSearchResultList(el, matches, query, matches.length >= 50);
    }

    function renderSearchResultList(el, matches, query, truncated) {
      let gmbSectionAdded = false;
      let otherSectionAdded = false;
      const frag = document.createDocumentFragment();
      matches.forEach(item => {
        if (item.co === 'gmb' && !gmbSectionAdded) {
          const t = document.createElement('div');
          t.className = 'section-title';
          t.innerHTML = '<span>專線小巴</span>';
          frag.appendChild(t);
          gmbSectionAdded = true;
        }
        if (item.co !== 'gmb' && gmbSectionAdded && !otherSectionAdded) {
          const t = document.createElement('div');
          t.className = 'section-title';
          t.innerHTML = '<span>巴士／其他</span>';
          frag.appendChild(t);
          otherSectionAdded = true;
        }

        const div = document.createElement('div');
        div.className = 'result-item';
        const plate = plateClass(item);

        let destText, coText;
        if (item.co === 'gmb') {
          const regionLabel = { HKI: '港島', KLN: '九龍', NT: '新界' }[item.region] || item.region || '';
          if (item.dest) {
            destText = `往 ${item.dest}`;
          } else if (item.orig) {
            destText = `往 ${item.orig}`;
          } else {
            destText = regionLabel ? `專線小巴 · ${regionLabel}` : '專線小巴';
          }
          const desc = item.gmbDesc ? ` · ${item.gmbDesc}` : '';
          coText = regionLabel
            ? `專線小巴 · ${regionLabel}${desc}`
            : `專線小巴${desc}`;
        } else if (item.co === 'mtrbus') {
          destText = item.dest ? `往 ${item.dest}` : (item.orig || '港鐵巴士');
          coText = item.orig && item.dest
            ? `${item.orig} · 港鐵巴士`
            : '港鐵巴士';
        } else {
          if (item.dest) {
            destText = `往 ${item.dest}`;
            coText = item.orig
              ? `${item.orig} · ${CO_NAMES[item.co] || item.co}`
              : (CO_NAMES[item.co] || item.co);
          } else if (item.orig) {
            destText = `往 ${item.orig}`;
            coText = CO_NAMES[item.co] || item.co;
          } else {
            destText = '—';
            coText = CO_NAMES[item.co] || item.co;
          }
        }

        div.innerHTML = `
          <div class="result-num ${plate}">${item.route}</div>
          <div class="result-info">
            <div class="result-dest">${destText}</div>
            <div class="result-co">${coText}</div>
          </div>
          <div class="result-arrow">›</div>
        `;

        if ((item.co === 'kmb' || item.co === 'lwb' || item.co === 'ctb') && item.bound) {
          div.addEventListener('click', () => {
            selectRouteDirection(
              item.route, item.co, item.bound, item.dest,
              null, null, null, item.service_type || '1', null
            );
          });
        } else if (item.co === 'gmb') {
          div.addEventListener('click', async () => {
            // 已有完整資料 → 直接入站
            if (item.gmbRouteId && item.dest) {
              selectRouteDirection(
                item.route, item.co, item.bound || 'out', item.dest,
                item.region, item.gmbRouteId,
                item.gmbRouteSeq || (item.bound === 'in' ? 2 : 1),
                '1', null
              );
              return;
            }
            // 否則先拉詳情再進入
            el.innerHTML = '<div class="loading-state">載入小巴路線中...</div>';
            try {
              const live = await fetchGmbOnDemand(item.route);
              const same = live.filter(g =>
                (!item.region || g.region === item.region) &&
                (!item.bound || g.bound === item.bound)
              );
              const pick = same[0] || live[0];
              if (pick && pick.gmbRouteId) {
                selectRouteDirection(
                  pick.route, 'gmb', pick.bound || 'out', pick.dest || pick.route,
                  pick.region, pick.gmbRouteId, pick.gmbRouteSeq || 1, '1', null
                );
              } else if (live.length) {
                // 多區結果：回到搜尋列表展示
                renderSearchResultList(el, live, item.route, false);
              } else {
                el.innerHTML = `<div class="empty-state">無法載入小巴 ${item.route}<br><small>請檢查網絡後再試</small></div>`;
              }
            } catch (e) {
              console.warn(e);
              el.innerHTML = `<div class="empty-state">載入小巴失敗<br><small>${e.message || ''}</small></div>`;
            }
          });
        } else if (item.co === 'mtrbus') {
          div.addEventListener('click', () => {
            selectRouteDirection(
              item.route, item.co, item.bound || 'out', item.dest || item.route,
              null, null, null, '1', null
            );
          });
        } else if (item.co === 'nlb' && item.nlbRouteId) {
          div.addEventListener('click', () => {
            selectRouteDirection(
              item.route, item.co, 'out', item.dest || item.route,
              null, null, null, '1', item.nlbRouteId
            );
          });
        } else {
          div.addEventListener('click', () => expandRouteDirections(item));
        }
        frag.appendChild(div);
      });

      el.appendChild(frag);
      if (truncated) {
        const tip = document.createElement('div');
        tip.className = 'empty-state';
        tip.style.padding = '16px';
        tip.innerHTML = `<small style="opacity:.7">結果過多，僅顯示前 50 筆<br>請輸入更完整路線號以縮小範圍</small>`;
        el.appendChild(tip);
      }
    }

    async function expandRouteDirections(item) {
      if (item.co === 'nlb' && item.nlbRouteId) {
        selectRouteDirection(
          item.route, item.co, 'out', item.dest || item.route,
          null, null, null, '1', item.nlbRouteId
        );
        return;
      }
      if (item.co === 'mtrbus') {
        selectRouteDirection(
          item.route, item.co, item.bound || 'out', item.dest || item.route,
          null, null, null, '1', null
        );
        return;
      }
      // 小巴：用 on-demand 拉齊所有區／方向
      if (item.co === 'gmb') {
        const el = document.getElementById('results');
        el.innerHTML = '<div class="loading-state">載入小巴路線中...</div>';
        try {
          const live = await fetchGmbOnDemand(item.route);
          if (!live.length) {
            el.innerHTML = `<div class="empty-state">找不到小巴 ${item.route}<br><small>請檢查網絡或稍後再試</small></div>`;
            return;
          }
          // 若指定了 region，優先該區；否則顯示全部
          const list = item.region
            ? (live.filter(g => g.region === item.region).length
                ? live.filter(g => g.region === item.region)
                : live)
            : live;
          el.innerHTML = '';
          renderSearchResultList(el, list, item.route, false);
        } catch (e) {
          el.innerHTML = `<div class="empty-state">載入小巴失敗<br><small>${e.message || ''}</small></div>`;
        }
        return;
      }

      const el = document.getElementById('results');
      el.innerHTML = `<div class="section-title">請選擇 ${item.route} 方向</div><div class="loading-state">載入方向資料中...</div>`;

      let directions = [];
      if (item.directions && item.directions.length > 0) {
        directions = item.directions;
      } else if (item.orig || item.dest) {
        directions = [
          { bound: 'out', orig: item.orig, dest: item.dest, route_seq: 1 },
          { bound: 'in', orig: item.dest, dest: item.orig, route_seq: 2 }
        ];
      } else {
        directions = [{ bound: 'out', orig: '', dest: item.route || '—', route_seq: 1 }];
      }

      el.innerHTML = `<div class="section-title">請選擇 ${item.route} 方向</div>`;
      directions.forEach(d => {
        const div = document.createElement('div');
        div.className = 'result-item';
        const plate = plateClass(item);
        div.innerHTML = `
          <div class="result-num ${plate}">${item.route}</div>
          <div class="result-info">
            <div class="result-dest">往 ${d.dest || '—'}</div>
            <div class="result-co">起點: ${d.orig || '—'}</div>
          </div>
          <div class="result-arrow">›</div>
        `;
        div.addEventListener('click', () => {
          selectRouteDirection(
            item.route, item.co, d.bound, d.dest,
            item.region || null, item.gmbRouteId || null, d.route_seq,
            item.service_type || '1', item.nlbRouteId || null
          );
        });
        el.appendChild(div);
      });
    }

    function selectRouteDirection(route, co, bound, dest, region, gmbRouteId, gmbRouteSeq, serviceType, nlbRouteId) {
      state.route = route;
      state.co = co;
      state.bound = bound;
      state.region = region || null;
      state.directionLabel = dest;
      state.gmbRouteId = gmbRouteId || null;
      state.gmbRouteSeq = gmbRouteSeq || (bound === 'out' ? 1 : 2);
      state.service_type = serviceType || '1';
      state.nlbRouteId = nlbRouteId || null;
      state.stopId = null;
      state.stopName = null;

      addHistory({
        route, co, bound, dest, region: region || null,
        gmbRouteId: gmbRouteId || null, gmbRouteSeq: gmbRouteSeq || null,
        service_type: serviceType || '1', nlbRouteId: nlbRouteId || null
      });

      updateHeaderFavBtns();

      document.getElementById('stopsTitle').textContent = `${route} - 往 ${dest}`;
      const backBtn = document.querySelector('#pageEta .back-btn');
      if (backBtn) backBtn.setAttribute('onclick', 'goStops()');
      showPage('pageStops');
      renderStops();
    }

    // ========== 真實車站列表 ==========
    async function renderStops() {
      const listEl = document.getElementById('stopList');
      listEl.innerHTML = '<div class="loading-state">載入車站列表中...</div>';

      try {
        let stops = [];
        const co = state.co;
        const route = state.route;
        const dir = state.bound === 'out' ? 'outbound' : 'inbound';

        if (co === 'kmb' || co === 'lwb') {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${dir}/${state.service_type}`);
          const json = await res.json();
          if (json.data && json.data.length) {
            const stopIds = json.data.map(s => s.stop);
            const detailMap = {};
            await Promise.all(stopIds.map(async id => {
              try {
                const sr = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${id}`);
                const sj = await sr.json();
                if (sj.data) {
                  detailMap[id] = {
                    name: sj.data.name_tc || sj.data.name_en || id,
                    lat: parseFloat(sj.data.lat),
                    lng: parseFloat(sj.data.long)
                  };
                }
              } catch {}
            }));
            stops = json.data.map(s => ({
              id: s.stop,
              name: (detailMap[s.stop] && detailMap[s.stop].name) || s.stop,
              seq: parseInt(s.seq, 10),
              lat: detailMap[s.stop] ? detailMap[s.stop].lat : null,
              lng: detailMap[s.stop] ? detailMap[s.stop].lng : null
            })).sort((a, b) => a.seq - b.seq);
          }
        } else if (co === 'ctb') {
          const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/${dir}`);
          const json = await res.json();
          if (json.data && json.data.length) {
            const stopIds = json.data.map(s => s.stop);
            const detailMap = {};
            await Promise.all(stopIds.map(async id => {
              try {
                const sr = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${id}`);
                const sj = await sr.json();
                if (sj.data) {
                  detailMap[id] = {
                    name: sj.data.name_tc || sj.data.name_en || id,
                    lat: parseFloat(sj.data.lat),
                    lng: parseFloat(sj.data.long)
                  };
                }
              } catch {}
            }));
            stops = json.data.map(s => ({
              id: s.stop,
              name: (detailMap[s.stop] && detailMap[s.stop].name) || s.stop,
              seq: s.seq,
              lat: detailMap[s.stop] ? detailMap[s.stop].lat : null,
              lng: detailMap[s.stop] ? detailMap[s.stop].lng : null
            })).sort((a, b) => a.seq - b.seq);
          }
        } else if (co === 'gmb') {
          // 若缺少 route_id，先向三區／指定區域查路線詳情
          // 若缺 route_id，從靜態資料補上
          if (!state.gmbRouteId && state.route) {
            const staticItems = gmbItemsFromStatic(String(state.route).toUpperCase());
            const match = staticItems.find(x =>
              (!state.region || x.region === state.region) &&
              (!state.bound || x.bound === state.bound)
            ) || staticItems[0];
            if (match) {
              state.gmbRouteId = match.gmbRouteId;
              state.gmbRouteSeq = match.gmbRouteSeq || state.gmbRouteSeq;
              state.region = state.region || match.region;
            }
          }

          const routeId = state.gmbRouteId;
          const seq = Number(state.gmbRouteSeq) || (state.bound === 'in' ? 2 : 1);
          if (routeId) {
            const seqsToTry = [seq, seq === 1 ? 2 : 1];
            for (const trySeq of seqsToTry) {
              const json = await gmbApiFetch(
                `https://data.etagmb.gov.hk/route-stop/${routeId}/${trySeq}`
              );
              const routeStops = (json && json.data && json.data.route_stops) || [];
              if (routeStops.length) {
                state.gmbRouteSeq = trySeq;
                stops = routeStops.map(s => ({
                  id: String(s.stop_id),
                  name: s.name_tc || s.name_en || String(s.stop_id),
                  seq: s.stop_seq,
                  lat: null,
                  lng: null
                })).sort((a, b) => a.seq - b.seq);
                // 補座標（並行，最多 20 站以免過慢）
                await Promise.all(stops.slice(0, 40).map(async st => {
                  try {
                    const j = await gmbApiFetch(`https://data.etagmb.gov.hk/stop/${st.id}`);
                    const c = j && j.data && j.data.coordinates && j.data.coordinates.wgs84;
                    if (c) {
                      st.lat = parseFloat(c.latitude);
                      st.lng = parseFloat(c.longitude);
                    }
                  } catch {}
                }));
                break;
              }
            }
          }
        } else if (co === 'nlb' && state.nlbRouteId) {
          const res = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list&routeId=${state.nlbRouteId}`);
          const json = await res.json();
          if (json.stops && json.stops.length) {
            stops = json.stops.map((s, idx) => ({
              id: String(s.stopId),
              name: s.stopName_c || s.stopName_e || String(s.stopId),
              seq: idx + 1,
              lat: s.latitude ? parseFloat(s.latitude) : (s.lat ? parseFloat(s.lat) : null),
              lng: s.longitude ? parseFloat(s.longitude) : (s.long ? parseFloat(s.long) : null)
            }));
          }
        } else if (co === 'mtrbus') {
          // 依方向取內建車站列表（O=out 往目的地，I=in 回程），同序號去重
          const dirKey = (state.bound === 'in' ? 'I' : 'O');
          const key = state.route + '_' + dirKey;
          let list = (typeof MTR_STOPS !== 'undefined' && MTR_STOPS[key]) ? MTR_STOPS[key] : [];
          if (!list.length) {
            list = (typeof MTR_STOPS !== 'undefined' && MTR_STOPS[state.route + '_' + (dirKey === 'O' ? 'I' : 'O')]) || [];
          }
          const seenSeq = new Set();
          stops = [];
          list.forEach(s => {
            if (seenSeq.has(s.s)) return;
            seenSeq.add(s.s);
            stops.push({ id: s.i, name: s.n, seq: s.s });
          });
          stops.sort((a, b) => a.seq - b.seq);
        }

        listEl.innerHTML = '';
        if (stops.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              此路線暫無車站資料<br>
              <small style="opacity:.7">可能非服務時間，或 API 暫時無法連線</small><br>
              <button class="eta-btn" style="margin-top:16px;max-width:160px;display:inline-block" onclick="renderStops()">重新載入</button>
            </div>`;
          state.currentStops = [];
          return;
        }

        // 若有 GPS，計算距離並標示最近站
        if (state.userLat != null && state.userLng != null) {
          stops.forEach(s => {
            if (s.lat != null && s.lng != null) {
              s.distM = haversineM(state.userLat, state.userLng, s.lat, s.lng);
            }
          });
        }
        let nearestId = null;
        const withDist = stops.filter(s => s.distM != null);
        if (withDist.length) {
          withDist.sort((a, b) => a.distM - b.distM);
          nearestId = withDist[0].id;
        }

        // 依方向排序並重新編號 1..n
        stops.sort((a, b) => (a.seq || 0) - (b.seq || 0));
        stops.forEach((s, i) => { s.displaySeq = i + 1; });
        state.currentStops = stops;

        const boundText = state.bound === 'in' ? '回程' : '去程';
        document.getElementById('stopsTitle').textContent =
          `${state.route} ${boundText} · 往 ${state.directionLabel || ''}`;

        stops.forEach(s => {
          const wrap = document.createElement('div');
          wrap.className = 'stop-item-wrap' + (s.id === nearestId ? ' nearest' : '');
          wrap.dataset.stopId = s.id;
          const distHtml = (s.distM != null)
            ? `<div class="stop-dist">${s.distM < 1000 ? Math.round(s.distM) + ' m' : (s.distM / 1000).toFixed(1) + ' km'}</div>`
            : '';
          wrap.innerHTML = `
            <div class="stop-item">
              <div class="stop-seq">${s.displaySeq}</div>
              <div class="stop-name">${s.name}</div>
              ${distHtml}
              <div class="result-arrow">›</div>
            </div>
            <div class="stop-inline-eta" data-inline-eta></div>
          `;
          wrap.querySelector('.stop-item').addEventListener('click', () => selectStopOnList(s, wrap));
          listEl.appendChild(wrap);
        });

        // 更新地圖（只含此方向車站）
        setTimeout(() => updateRouteMap(stops, nearestId), 50);
      } catch (e) {
        console.error('renderStops error', e);
        const isTimeout = e.name === 'AbortError';
        listEl.innerHTML = `
          <div class="empty-state">
            ${isTimeout ? '載入逾時' : '載入車站失敗'}<br>
            <small style="opacity:.7">請檢查網絡後再試</small><br>
            <button class="eta-btn" style="margin-top:16px;max-width:160px;display:inline-block" onclick="renderStops()">重新載入</button>
          </div>`;
      }
    }

    // ========== 地圖 / GPS（OpenStreetMap + Leaflet，免費無需 API Key） ==========
    let routeMap = null;
    let mapStopsLayer = null;
    let mapRouteLine = null;
    let mapUserMarker = null;
    let mapVisible = true;

    function haversineM(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function ensureRouteMap() {
      if (routeMap) return routeMap;
      if (typeof L === 'undefined') {
        document.getElementById('mapStatusText').textContent = '地圖庫載入失敗';
        return null;
      }
      const el = document.getElementById('routeMap');
      if (!el) return null;
      el.innerHTML = '';
      routeMap = L.map(el, {
        zoomControl: false,
        attributionControl: true
      }).setView([22.3193, 114.1694], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(routeMap);
      L.control.zoom({ position: 'topleft' }).addTo(routeMap);
      mapStopsLayer = L.layerGroup().addTo(routeMap);
      return routeMap;
    }

    function toggleMapPanel() {
      mapVisible = !mapVisible;
      const wrap = document.getElementById('mapWrap');
      wrap.classList.toggle('collapsed', !mapVisible);
      if (mapVisible && routeMap) {
        setTimeout(() => { routeMap.invalidateSize(); fitRouteBounds(); }, 200);
      }
    }

    // 以 OSRM 沿道路路徑繪製（非直線）；過長時分段請求
    async function fetchRoadPath(latlngs) {
      if (!latlngs || latlngs.length < 2) return latlngs || [];
      // 簡化過密站點，避免 URL 過長（最多約 80 個 waypoint）
      let pts = latlngs;
      if (pts.length > 80) {
        const step = Math.ceil(pts.length / 80);
        pts = pts.filter((_, i) => i === 0 || i === pts.length - 1 || i % step === 0);
      }
      const chunks = [];
      const chunkSize = 40; // 每段最多 40 點
      for (let i = 0; i < pts.length - 1; i += chunkSize - 1) {
        chunks.push(pts.slice(i, Math.min(i + chunkSize, pts.length)));
      }
      const all = [];
      for (const chunk of chunks) {
        if (chunk.length < 2) continue;
        const coordStr = chunk.map(p => `${p[1]},${p[0]}`).join(';'); // lng,lat
        const url = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson&continue_straight=true`;
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('osrm ' + res.status);
          const json = await res.json();
          const coords = json.routes && json.routes[0] && json.routes[0].geometry
            && json.routes[0].geometry.coordinates;
          if (coords && coords.length) {
            // geojson 為 [lng,lat] → Leaflet [lat,lng]
            const path = coords.map(c => [c[1], c[0]]);
            if (all.length && path.length) path.shift(); // 避免段接點重複
            all.push(...path);
          }
        } catch (e) {
          console.warn('OSRM path failed, use straight segment', e);
          all.push(...chunk);
        }
      }
      return all.length >= 2 ? all : latlngs;
    }

    async function updateRouteMap(stops, nearestId) {
      const map = ensureRouteMap();
      if (!map) return;
      setTimeout(() => map.invalidateSize(), 100);

      // 方向標籤：只顯示目前所選方向
      const dirBadge = document.getElementById('mapDirBadge');
      if (dirBadge) {
        const dirLabel = state.directionLabel || '';
        const boundText = state.bound === 'in' ? '回程' : '去程';
        dirBadge.textContent = dirLabel
          ? `${state.route || ''} ${boundText} · 往 ${dirLabel}`
          : `${state.route || ''} · ${boundText}`;
      }

      if (mapStopsLayer) mapStopsLayer.clearLayers();
      if (mapRouteLine) {
        map.removeLayer(mapRouteLine);
        mapRouteLine = null;
      }

      // 依目前方向排序後重新編號 1..n（分開方向顯示）
      const ordered = (stops || []).slice().sort((a, b) => (a.seq || 0) - (b.seq || 0));
      ordered.forEach((s, idx) => { s.displaySeq = idx + 1; });

      const latlngs = [];
      ordered.forEach(s => {
        if (s.lat == null || s.lng == null || isNaN(s.lat) || isNaN(s.lng)) return;
        latlngs.push([s.lat, s.lng]);
        const isNear = s.id === nearestId;
        const num = s.displaySeq || s.seq;
        const icon = L.divIcon({
          className: '',
          html: `<div class="stop-marker-icon${isNear ? ' active' : ''}">${num}</div>`,
          iconSize: [isNear ? 30 : 26, isNear ? 30 : 26],
          iconAnchor: [isNear ? 15 : 13, isNear ? 15 : 13]
        });
        const m = L.marker([s.lat, s.lng], { icon });
        const safeId = String(s.id).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        m.bindPopup(
          `<b>${num}. ${s.name}</b><br>` +
          `<small>${state.bound === 'in' ? '回程' : '去程'} · 往 ${state.directionLabel || ''}</small><br>` +
          `<button type="button" onclick="selectStopById('${safeId}')" ` +
          `style="margin-top:6px;padding:4px 10px;border:none;background:#00A0E9;color:#fff;border-radius:6px;cursor:pointer">查看到站</button>`
        );
        m.on('click', () => {
          document.querySelectorAll('.stop-item-wrap').forEach(el => {
            el.classList.toggle('selected-stop', el.dataset.stopId === String(s.id));
          });
        });
        mapStopsLayer.addLayer(m);
      });

      // 沿實際行車路線繪製（OSRM），失敗則退回直線
      if (latlngs.length >= 2) {
        const statusEl = document.getElementById('mapStatusText');
        const boundText = state.bound === 'in' ? '回程' : '去程';
        if (statusEl) statusEl.textContent = `${boundText} · 繪製行車路線中…`;
        const roadPath = await fetchRoadPath(latlngs);
        if (mapRouteLine) { map.removeLayer(mapRouteLine); mapRouteLine = null; }
        mapRouteLine = L.polyline(roadPath, {
          color: '#E4002B',
          weight: 5,
          opacity: 0.9,
          lineJoin: 'round',
          lineCap: 'round'
        }).addTo(map);
      }

      if (state.userLat != null && state.userLng != null) {
        if (mapUserMarker) map.removeLayer(mapUserMarker);
        mapUserMarker = L.circleMarker([state.userLat, state.userLng], {
          radius: 8,
          color: '#fff',
          weight: 2,
          fillColor: '#007AFF',
          fillOpacity: 1
        }).addTo(map).bindPopup('我的位置');
      }

      const n = latlngs.length;
      const boundText = state.bound === 'in' ? '回程' : '去程';
      document.getElementById('mapStatusText').textContent =
        n ? `${boundText} · ${n} 站 · 沿道路` : `${boundText} · 暫無座標`;

      if (latlngs.length) {
        const bounds = L.latLngBounds(latlngs);
        if (state.userLat != null) bounds.extend([state.userLat, state.userLng]);
        map.fitBounds(bounds.pad(0.15));
      }
    }

    function fitRouteBounds() {
      if (!routeMap || !state.currentStops) return;
      const pts = state.currentStops
        .filter(s => s.lat != null && s.lng != null)
        .map(s => [s.lat, s.lng]);
      if (!pts.length) return;
      const b = L.latLngBounds(pts);
      if (state.userLat != null) b.extend([state.userLat, state.userLng]);
      routeMap.fitBounds(b.pad(0.15));
    }

    function locateUser() {
      const btn = document.getElementById('btnGps');
      const status = document.getElementById('mapStatusText');
      if (!navigator.geolocation) {
        status.textContent = '此裝置不支援 GPS';
        return;
      }
      btn.classList.add('active');
      status.textContent = '定位中…';
      navigator.geolocation.getCurrentPosition(
        pos => {
          state.userLat = pos.coords.latitude;
          state.userLng = pos.coords.longitude;
          btn.classList.remove('active');
          status.textContent = '已定位 · 計算距離中';
          const map = ensureRouteMap();
          if (mapUserMarker && map) map.removeLayer(mapUserMarker);
          if (map) {
            mapUserMarker = L.circleMarker([state.userLat, state.userLng], {
              radius: 8, color: '#fff', weight: 2, fillColor: '#007AFF', fillOpacity: 1
            }).addTo(map).bindPopup('我的位置');
            map.setView([state.userLat, state.userLng], 16);
          }
          if (state.currentStops && state.currentStops.length) renderStopsFromCache();
        },
        err => {
          btn.classList.remove('active');
          status.textContent = err.code === 1 ? '請允許位置權限' : '定位失敗';
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
      );
    }

    function renderStopsFromCache() {
      const stops = state.currentStops || [];
      if (!stops.length) return;
      const listEl = document.getElementById('stopList');
      if (state.userLat != null) {
        stops.forEach(s => {
          if (s.lat != null && s.lng != null) {
            s.distM = haversineM(state.userLat, state.userLng, s.lat, s.lng);
          }
        });
      }
      let nearestId = null;
      const withDist = stops.filter(s => s.distM != null);
      if (withDist.length) {
        withDist.sort((a, b) => a.distM - b.distM);
        nearestId = withDist[0].id;
      }
      stops.sort((a, b) => (a.seq || 0) - (b.seq || 0));
      stops.forEach((s, i) => { s.displaySeq = i + 1; });
      listEl.innerHTML = '';
      stops.forEach(s => {
        const wrap = document.createElement('div');
        wrap.className = 'stop-item-wrap' + (s.id === nearestId ? ' nearest' : '');
        wrap.dataset.stopId = s.id;
        const distHtml = (s.distM != null)
          ? `<div class="stop-dist">${s.distM < 1000 ? Math.round(s.distM) + ' m' : (s.distM / 1000).toFixed(1) + ' km'}</div>`
          : '';
        wrap.innerHTML = `
          <div class="stop-item">
            <div class="stop-seq">${s.displaySeq}</div>
            <div class="stop-name">${s.name}</div>
            ${distHtml}
            <div class="result-arrow">›</div>
          </div>
          <div class="stop-inline-eta" data-inline-eta></div>
        `;
        wrap.querySelector('.stop-item').addEventListener('click', () => selectStopOnList(s, wrap));
        listEl.appendChild(wrap);
      });
      updateRouteMap(stops, nearestId);
    }

    function selectStopById(id) {
      const s = (state.currentStops || []).find(x => String(x.id) === String(id));
      if (!s) return;
      const wrap = document.querySelector(`.stop-item-wrap[data-stop-id="${CSS.escape(String(s.id))}"]`);
      if (wrap) selectStopOnList(s, wrap);
      else selectStop(s);
    }

    function formatEtaDisplay(e, now) {
      const t = new Date(e.eta);
      let mins = (typeof e.gmbDiff === 'number')
        ? e.gmbDiff
        : Math.round((t.getTime() - now) / 60000);
      let minClass = '';
      let minText;
      if (e.gmbScheduled && mins <= 0) {
        minText = '預定';
        minClass = 'soon';
      } else if (mins <= 0) {
        minText = '即將到站';
        minClass = 'arrived';
      } else {
        minText = `${mins} 分鐘`;
        if (mins <= 2) minClass = 'arrived';
        else if (mins <= 5) minClass = 'soon';
      }
      const timeStr = t.toTimeString().substring(0, 5);
      return { mins, minText, minClass, timeStr, rmk: e.rmk || '' };
    }

    async function selectStopOnList(stop, wrapEl) {
      // 在車站列表內展開到站，方便快速切換其他站（保留路線圖）
      document.querySelectorAll('.stop-item-wrap').forEach(el => {
        el.classList.remove('selected-stop');
        const box = el.querySelector('[data-inline-eta]');
        if (box) box.innerHTML = '';
      });
      wrapEl.classList.add('selected-stop');
      state.stopId = stop.id;
      state.stopName = stop.name;
      state.selectedStop = stop;

      // 地圖聚焦此站
      if (routeMap && stop.lat != null && stop.lng != null) {
        routeMap.setView([stop.lat, stop.lng], 17);
        if (mapStopsLayer) {
          mapStopsLayer.eachLayer(layer => {
            if (layer.getPopup && layer.getPopup()) {
              const c = layer.getPopup().getContent() || '';
              if (c.includes(String(stop.name))) layer.openPopup();
            }
          });
        }
      }

      const box = wrapEl.querySelector('[data-inline-eta]');
      if (box) {
        box.innerHTML = '<div class="inline-eta-loading">載入到站時間…</div>';
        try {
          const etas = await fetchEtaDataForStop(stop.id);
          if (!wrapEl.classList.contains('selected-stop')) return; // 已改選其他站
          if (!etas.length) {
            box.innerHTML = '<div class="inline-eta-empty">暫時沒有到站資料</div>';
          } else {
            const now = Date.now();
            box.innerHTML = etas.slice(0, 4).map((e, idx) => {
              const d = formatEtaDisplay(e, now);
              // 第1班綠色，第2~4班藍色
              const colorStyle = idx === 0 ? 'color:var(--green)' : 'color:#007AFF';
              return `<div class="inline-eta-row">
                <span class="inline-eta-mins" style="${colorStyle}">${d.minText}</span>
                <span class="inline-eta-time" style="${colorStyle}">${d.timeStr}</span>
                ${d.rmk ? `<span class="inline-eta-rmk">${d.rmk}</span>` : ''}
              </div>`;
            }).join('') + `
              <div class="inline-eta-actions">
                <button type="button" onclick='openEtaPage(${JSON.stringify(String(stop.id))})'>詳細頁面</button>
                <button type="button" onclick="refreshInlineEta()">刷新</button>
              </div>`;
          }
        } catch (err) {
          console.warn(err);
          box.innerHTML = '<div class="inline-eta-empty">載入失敗，請再試</div>';
        }
      }
    }

    function refreshInlineEta() {
      const stop = state.selectedStop;
      if (!stop) return;
      const wrap = document.querySelector(`.stop-item-wrap[data-stop-id="${CSS.escape(String(stop.id))}"]`);
      if (wrap) selectStopOnList(stop, wrap);
    }

    function openEtaPage(stopId) {
      const s = (state.currentStops || []).find(x => String(x.id) === String(stopId))
        || state.selectedStop;
      if (s) selectStop(s);
    }

    // ——— 到站頁地圖（顯示所選車站實際位置）———
    let etaMap = null;
    let etaStopMarker = null;
    let etaUserMarker = null;

    function ensureEtaMap() {
      if (etaMap) return etaMap;
      if (typeof L === 'undefined') return null;
      const el = document.getElementById('etaMap');
      if (!el) return null;
      el.innerHTML = '';
      etaMap = L.map(el, { zoomControl: false, attributionControl: true })
        .setView([22.3193, 114.1694], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(etaMap);
      L.control.zoom({ position: 'topleft' }).addTo(etaMap);
      return etaMap;
    }

    function updateEtaStopMap(stop) {
      const map = ensureEtaMap();
      if (!map) return;
      setTimeout(() => map.invalidateSize(), 120);

      if (etaStopMarker) { map.removeLayer(etaStopMarker); etaStopMarker = null; }
      if (etaUserMarker) { map.removeLayer(etaUserMarker); etaUserMarker = null; }

      const hasStop = stop && stop.lat != null && stop.lng != null && !isNaN(stop.lat) && !isNaN(stop.lng);
      if (hasStop) {
        const num = stop.displaySeq || stop.seq || '';
        const icon = L.divIcon({
          className: '',
          html: `<div class="stop-marker-icon active">${num || '站'}</div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });
        etaStopMarker = L.marker([stop.lat, stop.lng], { icon })
          .addTo(map)
          .bindPopup(`<b>${num}. ${stop.name || ''}</b><br>往 ${state.directionLabel || ''}`);
        map.setView([stop.lat, stop.lng], 17);
      }

      if (state.userLat != null && state.userLng != null) {
        etaUserMarker = L.circleMarker([state.userLat, state.userLng], {
          radius: 8, color: '#fff', weight: 2, fillColor: '#007AFF', fillOpacity: 1
        }).addTo(map).bindPopup('我的位置');
        if (hasStop) {
          const b = L.latLngBounds([[stop.lat, stop.lng], [state.userLat, state.userLng]]);
          map.fitBounds(b.pad(0.35));
        } else {
          map.setView([state.userLat, state.userLng], 16);
        }
      }

      if (!hasStop && state.userLat == null) {
        map.setView([22.3193, 114.1694], 12);
      }
    }

    function locateUserOnEta() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        pos => {
          state.userLat = pos.coords.latitude;
          state.userLng = pos.coords.longitude;
          const stop = (state.currentStops || []).find(x => String(x.id) === String(state.stopId));
          updateEtaStopMap(stop || { id: state.stopId, name: state.stopName });
        },
        () => {},
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    }

    function selectStop(stop) {
      state.stopId = stop.id;
      state.stopName = stop.name;
      state.selectedStop = stop;
      document.getElementById('etaRoute').textContent = state.route;
      document.getElementById('etaRoute').className = `eta-route-num ${plateClass({ co: state.co, region: state.region })}`;
      document.getElementById('etaDest').textContent = `往 ${state.directionLabel}`;
      const num = stop.displaySeq || stop.seq;
      document.getElementById('etaStopName').textContent =
        num != null ? `📍 ${num}. ${state.stopName}` : `📍 ${state.stopName}`;
      document.getElementById('etaCo').textContent = CO_NAMES[state.co] || state.co;
      showPage('pageEta');
      // 顯示該站在地圖上的實際位置
      setTimeout(() => updateEtaStopMap(stop), 80);
      fetchETA();
    }

    // ========== 真實 ETA ==========
    async function fetchEtaDataForStop(stopId) {
      const prev = state.stopId;
      state.stopId = stopId;
      state._etaSilent = true;
      try {
        await fetchETA();
        return (state._lastEtas || []).slice();
      } finally {
        state.stopId = prev;
        state._etaSilent = false;
      }
    }

    async function fetchETA() {
      const silent = !!state._etaSilent;
      const rowsEl = document.getElementById('etaRows');
      const infoEl = document.getElementById('etaInfo');
      if (!silent && rowsEl) rowsEl.innerHTML = '<div class="loading-state">更新到站時間...</div>';

      try {
        let etas = [];
        const co = state.co;
        const route = state.route;
        const stopId = state.stopId;

        if (co === 'kmb' || co === 'lwb') {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${stopId}/${route}/${state.service_type}`);
          const json = await res.json();
          if (json.data) {
            etas = json.data
              .filter(e => e.eta)
              .map(e => ({
                eta: e.eta,
                rmk: e.rmk_tc || e.rmk_en || '',
                dest: e.dest_tc || e.dest_en || ''
              }));
          }
        } else if (co === 'ctb') {
          const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${route}`);
          const json = await res.json();
          if (json.data) {
            etas = json.data
              .filter(e => e.eta)
              .map(e => ({
                eta: e.eta,
                rmk: e.rmk_tc || e.rmk_en || '',
                dest: e.dest_tc || e.dest_en || ''
              }));
          }
        } else if (co === 'gmb') {
          // 小巴 ETA（直連無 CORS，失敗時走代理）
          const wantSeq = Number(state.gmbRouteSeq) || (state.bound === 'in' ? 2 : 1);
          let gmbEtaList = [];
          if (state.gmbRouteId) {
            const json = await gmbApiFetch(
              `https://data.etagmb.gov.hk/eta/route-stop/${state.gmbRouteId}/${stopId}`
            );
            if (json && json.data && Array.isArray(json.data)) gmbEtaList = json.data;
          }
          if (!gmbEtaList.length) {
            const json = await gmbApiFetch(`https://data.etagmb.gov.hk/eta/stop/${stopId}`);
            if (json && json.data && Array.isArray(json.data)) {
              gmbEtaList = json.data.filter(item => {
                if (state.gmbRouteId && item.route_id && item.route_id !== state.gmbRouteId) return false;
                return true;
              });
            }
          }
          gmbEtaList.forEach(item => {
            // 只取目前所選方向（route_seq）
            if (item.route_seq != null && Number(item.route_seq) !== wantSeq) return;
            if (item.enabled === false) return;
            if (!item.eta || !item.eta.length) return;
            item.eta.forEach(e => {
              // diff = 距離到站分鐘數；timestamp = 預計到站時刻
              const diff = (typeof e.diff === 'number') ? e.diff : null;
              let etaIso = e.timestamp || null;
              if (!etaIso && diff != null) {
                etaIso = new Date(Date.now() + Math.max(0, diff) * 60000).toISOString();
              }
              if (!etaIso) return;
              const rmk = e.remarks_tc || e.remarks_en || '';
              // 「未開出」：用 scheduled 標記，顯示備註而非「即將到站」
              const scheduled = /未開出|Scheduled/i.test(rmk);
              etas.push({
                eta: etaIso,
                rmk: rmk || (diff != null ? `${diff} 分鐘` : ''),
                dest: '',
                gmbDiff: diff,
                gmbScheduled: scheduled
              });
            });
          });
        } else if (co === 'nlb' && state.nlbRouteId) {
          const res = await fetch(
            `https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&routeId=${state.nlbRouteId}&stopId=${stopId}&language=zh`
          );
          const json = await res.json();
          if (json.estimatedArrivals) {
            json.estimatedArrivals.forEach(e => {
              if (e.estimatedArrivalTime) {
                const iso = e.estimatedArrivalTime.replace(' ', 'T') + '+08:00';
                etas.push({
                  eta: iso,
                  rmk: e.routeVariantName || '',
                  dest: ''
                });
              }
            });
          }
        } else if (co === 'mtrbus') {
          // 港鐵巴士：只顯示所選車站的到站／開出時間
          // 108000 = API 表示無實時／已離開，應改用 departureTimeInSecond
          const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ language: 'zh', routeName: route })
          });
          const json = await res.json();
          if (json.busStop && json.busStop.length) {
            // 精確匹配 → 後綴匹配 → 第一個有有效班次的站
            let target = json.busStop.find(bs => bs.busStopId === stopId);
            if (!target) {
              target = json.busStop.find(bs => stopId && bs.busStopId && (
                bs.busStopId.endsWith(stopId.replace(/^.*-/, '-')) ||
                stopId.endsWith(bs.busStopId.replace(/^.*-/, '-'))
              ));
            }
            if (!target || !target.bus || !target.bus.length) {
              target = json.busStop.find(bs => {
                if (!bs.bus || !bs.bus.length) return false;
                return bs.bus.some(b => {
                  const a = parseInt(b.arrivalTimeInSecond || '108000', 10);
                  const d = parseInt(b.departureTimeInSecond || '108000', 10);
                  return (a > 0 && a < 108000) || (d > 0 && d < 108000);
                });
              }) || json.busStop[0];
            }
            if (target && target.bus) {
              const seenBus = new Set();
              target.bus.forEach(b => {
                let arr = parseInt(b.arrivalTimeInSecond, 10);
                let dep = parseInt(b.departureTimeInSecond, 10);
                if (isNaN(arr)) arr = 108000;
                if (isNaN(dep)) dep = 108000;
                // 優先有效到站秒數，否則用開出秒數；0 視為即將到站
                let sec = 108000;
                if (arr >= 0 && arr < 108000) sec = arr;
                else if (dep >= 0 && dep < 108000) sec = dep;
                else return;
                const key = (b.busId || '') + '_' + sec;
                if (seenBus.has(key)) return;
                seenBus.add(key);
                const t = new Date(Date.now() + Math.max(0, sec) * 1000);
                const text = b.arrivalTimeText || b.departureTimeText || '';
                etas.push({
                  eta: t.toISOString(),
                  rmk: [b.busId ? `車號 ${b.busId}` : '', text].filter(Boolean).join(' · ') || '',
                  dest: ''
                });
              });
            }
          }
        }

        etas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
        etas = etas.slice(0, 4); // 最近 4 班
        state._lastEtas = etas;
        if (silent) return;

        rowsEl.innerHTML = '';
        if (etas.length === 0) {
          rowsEl.innerHTML = `
            <div class="no-eta">
              暫時沒有到站資料<br>
              <small>可能非服務時間或資料暫缺</small><br>
              <button class="eta-btn" style="margin-top:12px;max-width:140px;display:inline-block" onclick="fetchETA()">再試一次</button>
            </div>`;
        } else {
          const now = Date.now();
          etas.forEach((e, idx) => {
            const d = formatEtaDisplay(e, now);
            const div = document.createElement('div');
            div.className = 'eta-row';
            // 第1班綠色，第2~4班藍色
            const colorStyle = idx === 0 ? 'color:var(--green)' : 'color:#007AFF';
            div.innerHTML = `
              <div class="eta-time-pair" style="align-items:flex-start">
                <div class="eta-time-label">倒數</div>
                <div class="eta-mins" style="${colorStyle}">${d.minText}</div>
                <div class="eta-rmk">${d.rmk || ('班次 ' + (idx + 1))}</div>
              </div>
              <div class="eta-time-pair">
                <div class="eta-time-label">預計到站</div>
                <div class="eta-clock" style="${colorStyle}">${d.timeStr}</div>
              </div>
            `;
            rowsEl.appendChild(div);
          });
        }
        const updatedStr = new Date().toTimeString().substring(0, 8);
        if (infoEl) infoEl.textContent = `最後更新時間: ${updatedStr}`;
      } catch (e) {
        console.error('fetchETA error', e);
        state._lastEtas = [];
        if (silent) return;
        const isTimeout = e.name === 'AbortError';
        if (rowsEl) rowsEl.innerHTML = `
          <div class="no-eta">
            ${isTimeout ? '連線逾時' : '無法取得到站資料'}<br>
            <small>請檢查網絡後再試</small><br>
            <button class="eta-btn" style="margin-top:12px;max-width:140px;display:inline-block" onclick="fetchETA()">再試一次</button>
          </div>`;
        if (infoEl) infoEl.textContent = '';
      }
    }

    function toggleAuto() {
      state.auto = !state.auto;
      const btn = document.getElementById('btnAuto');
      btn.classList.toggle('active-refresh', state.auto);
      btn.textContent = state.auto ? '⏸ 停止自動' : '▶ 自動刷新';
      if (state.auto) state.timer = setInterval(fetchETA, 15000);
      else clearInterval(state.timer);
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }
    function goSearch() {
      if (state.timer) { clearInterval(state.timer); state.auto = false; }
      showPage('pageSearch');
    }
    function goStops() {
      if (state.timer) { clearInterval(state.timer); state.auto = false; }
      showPage('pageStops');
    }

    // ========== 天氣（香港天文台） ==========
    const WX_ICON_NAME = {
      50: '陽光充沛', 51: '間有陽光', 52: '短暫陽光', 53: '間有陽光幾陣驟雨',
      54: '短暫陽光幾陣驟雨', 60: '多雲', 61: '密雲', 62: '微雨', 63: '雨',
      64: '大雨', 65: '雷暴', 70: '微雨', 71: '微雨', 72: '微雨', 73: '雨',
      74: '大雨', 75: '大雨', 76: '大雨', 77: '大雨', 80: '大風', 81: '大風',
      82: '大風', 83: '大風', 84: '大風', 85: '大風', 90: '熱', 91: '冷', 92: '冷', 93: '冷'
    };

    function wxWarnClass(code) {
      const c = String(code || '').toUpperCase();
      if (c.includes('BLACK') || c.includes('黑')) return 'black';
      if (c.includes('RED') || c.includes('紅')) return 'red';
      if (c.includes('AMBER') || c.includes('黃') || c.includes('AMBER')) return 'amber';
      if (c.includes('YELLOW') || c.includes('黃')) return 'yellow';
      if (c.includes('BLUE') || c.includes('藍')) return 'blue';
      return '';
    }

    async function loadWeather() {
      const bar = document.getElementById('weatherBar');
      if (!bar) return;
      try {
        const [rhr, flw, warn] = await Promise.all([
          fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
          fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc').catch(() => ({})),
          fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc').catch(() => ({}))
        ]);

        // 氣溫：優先天文台
        let temp = '—';
        if (rhr.temperature && rhr.temperature.data) {
          const hko = rhr.temperature.data.find(t => t.place === '香港天文台') || rhr.temperature.data[0];
          if (hko) temp = hko.value;
        }
        let humidity = '—';
        if (rhr.humidity && rhr.humidity.data && rhr.humidity.data[0]) {
          humidity = rhr.humidity.data[0].value;
        }
        const iconNum = (rhr.icon && rhr.icon[0]) ? rhr.icon[0] : 60;
        const iconName = WX_ICON_NAME[iconNum] || '天氣';
        const iconUrl = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconNum}.png`;

        // 警告
        const warnBadges = [];
        if (warn && typeof warn === 'object') {
          Object.keys(warn).forEach(k => {
            const w = warn[k];
            if (!w) return;
            const name = w.name || w.code || k;
            const type = w.type || w.actionCode || '';
            const label = type ? `${name} ${type}` : name;
            warnBadges.push({ label, cls: wxWarnClass(w.code || name) });
          });
        }
        // rhr 也可能有 warningMessage 字串
        if ((!warnBadges.length) && rhr.warningMessage) {
          const msgs = Array.isArray(rhr.warningMessage) ? rhr.warningMessage : [rhr.warningMessage];
          msgs.filter(Boolean).forEach(m => warnBadges.push({ label: m, cls: 'red' }));
        }

        const forecast = (flw && flw.forecastDesc) ? flw.forecastDesc : '';
        const outlook = (flw && flw.outlook) ? flw.outlook : '';
        const forecastText = forecast || outlook || '';
        const updatedAt = new Date().toTimeString().substring(0, 5);

        bar.classList.remove('wx-loading');
        bar.innerHTML = `
          <div class="weather-main">
            <img class="weather-icon" src="${iconUrl}" alt="${iconName}" onerror="this.style.display='none'">
            <div class="weather-temp">${temp}<span style="font-size:.7rem;font-weight:500">°C</span></div>
            <div class="weather-meta">
              <div class="wx-line"><strong>${iconName}</strong> · 濕度 ${humidity}%</div>
              <div class="wx-line">天文台 · 更新 ${updatedAt} · 每10分鐘自動更新</div>
            </div>
          </div>
          ${warnBadges.length ? `<div class="weather-warns">${warnBadges.map(b =>
            `<span class="wx-warn-badge ${b.cls}">${b.label}</span>`
          ).join('')}</div>` : ''}
          ${forecastText ? `<div class="wx-forecast">${forecastText}</div>` : ''}
        `;
      } catch (e) {
        console.warn('Weather load failed', e);
        bar.classList.add('wx-loading');
        bar.textContent = '天氣資料暫時無法載入';
      }
    }

    loadAllRoutes();
    loadWeather();
    // 每 10 分鐘自動更新天氣
    setInterval(loadWeather, 10 * 60 * 1000);
  </script>
</body>
</html>
