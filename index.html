<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巴士到站顯示欄</title>
  <style>
    /* 頁面基本設置 */
    body {
      background-color: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* 巴士到站顯示欄容器 */
    .bus-board {
      display: flex;
      align-items: center;
      background-color: #1a1a1a;
      border: 2px solid #333333;
      border-radius: 10px;
      padding: 16px 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    /* 左欄：路線號碼與終點站 */
    .route-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-right: 20px;
      border-right: 1px solid #333333;
      min-width: 100px;
    }

    /* 路線號碼 */
    .route-no {
      font-size: 32px;
      font-weight: 800;
      color: #ffcc00; /* LED 經典金黃色 */
      line-height: 1.1;
      letter-spacing: 1px;
    }

    /* 終點站 (路線號碼下方) */
    .destination {
      font-size: 14px;
      color: #aaaaaa;
      margin-top: 4px;
      font-weight: 500;
    }

    /* 右欄：車站位置名 */
    .station-info {
      flex-grow: 1;
      padding-left: 20px;
    }

    /* 車站位置名 (路線號碼右側) */
    .station-name {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div class="bus-board">
    <!-- 左欄：路線號碼 + 終點站 -->
    <div class="route-info">
      <div class="route-no">268X</div>
      <div class="destination">往 寶田</div>
    </div>

    <!-- 右欄：車站位置名 -->
    <div class="station-info">
      <div class="station-name">中環（港鐵香港站）</div>
    </div>
  </div>

</body>
</html>
