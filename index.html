<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>全港巴士到站 - 搜尋</title>
<style>
  :root{
    --kmb:#d81e26; --lwb:#ff7a00; --ctb:#1e8c45; --gmb-kln:#00a99d; --gmb-nt:#8e7cc3; --gmb-hk:#5dade2; --mtr:#0a58ca;
    --bg:#f2f3f5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:-apple-system, BlinkMacSystemFont,"PingFang HK","Noto Sans HK",sans-serif; background:var(--bg); display:flex; justify-content:center}
  .phone{width:100%; max-width:430px; min-height:100vh; background:#fff; display:flex; flex-direction:column; position:relative; border-left:1px solid #e5e5e5; border-right:1px solid #e5e5e5}
  .status{display:flex; justify-content:space-between; padding:6px 16px 2px; font-size:15px; font-weight:700}
  .app-header{background: linear-gradient(to bottom, #3db9ff, #0a8ae0); color:white; text-align:center; padding:12px 0 14px; font-size:19px; font-weight:700; letter-spacing:2px}
  .search-wrap{padding:10px 14px; background:#eef2f7}
  .search-box{width:100%; background:white; border:none; border-radius:8px; padding:11px 12px; text-align:center; font-size:16px; outline:none; box-shadow:inset 0 0 0 1px #ddd}
  .hint{text-align:center; color:#8a8f98; font-size:14px; line-height:1.6; padding:42px 20px}
  .results{flex:1; overflow-y:auto; padding:10px 10px 8px; background:#f5f6f8}
  .card{background:white; border-radius:12px; padding:12px; margin-bottom:10px; display:flex; gap:10px; border-left:6px solid #d81e26; box-shadow:0 1px 4px rgba(0,0,0,.08); cursor:pointer}
  .card.kmb{border-color:#d81e26} .card.lwb{border-color:#ff7a00} .card.ctb,.card.nlb{border-color:#1e8c45}
  .card.gmb-kln{border-color:#00a99d} .card.gmb-nt{border-color:#8e7cc3} .card.gmb-hk{border-color:#5dade2} .card.mtr{border-color:#0a58ca}
  .badge{font-size:11px; color:white; padding:2px 6px; border-radius:4px; font-weight:700; display:inline-block; margin-bottom:4px}
  .badge.kmb{background:#d81e26} .badge.lwb{background:#ff7a00} .badge.ctb,.badge.nlb{background:#1e8c45} .badge.gmb-kln{background:#00a99d} .badge.gmb-nt{background:#8e7cc3} .badge.gmb-hk{background:#5dade2} .badge.mtr{background:#0a58ca}
  .route-no{font-size:26px; font-weight:900; line-height:1}
  .route-meta{flex:1} .dest{font-size:14px; color:#333; margin-top:2px}
  .eta{text-align:right; min-width:82px} .eta-main{font-size:20px; font-weight:800} .eta-main.soon{color:#d81e26} .eta-sub{font-size:11px; color:#888; margin-top:2px}
  .modal{position:absolute; inset:0; background:rgba(0,0,0,.45); display:none; z-index:30; align-items:flex-end}
  .modal.show{display:flex}
  .sheet{width:100%; background:white; border-radius:18px 18px 0 0; max-height:88vh; display:flex; flex-direction:column}
  .sheet-head{padding:16px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center}
  .stop-list{overflow:auto} .stop{display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid #f3f3f3; align-items:center}
  .stop-dot{width:10px; height:10px; border-radius:50%; background:#ccc} .stop-dot.active{background:#d81e26; box-shadow:0 0 0 4px rgba(216,30,38,.15)}
  .kbd-wrap{background:#5a6a82; padding:10px 8px 6px} .kbd{display:grid; grid-template-columns:repeat(8,1fr); gap:8px}
  .key{background:white; border:none; border-radius:8px; height:48px; font-size:18px; font-weight:800}
  .key.letter{background:#f5f5f5; border-radius:50%; width:48px; justify-self:center; font-size:16px}
  .info-bar{background:#1e2228; color:#aaa; display:flex; justify-content:space-between; padding:6px 10px; font-size:12px}
  .info-bar .temp{color:#ffcc00; font-weight:700} .warn{background:#3ab54a; color:white; padding:2px 8px; border-radius:12px; font-size:11px}
  .tabbar{display:flex; background:#f8f8f8; border-top:1px solid #ddd; padding:4px 0}
  .tab{flex:1; text-align:center; font-size:11px; color:#999} .tab.active{color:#0a8ae0} .tab i{display:block; font-size:18px; font-style:normal}
  .legend{display:flex; flex-wrap:wrap; gap:6px; padding:8px 12px 2px} .legend span{font-size:10px; padding:3px 6px; border-radius:4px; color:white; font-weight:700}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>00:15 🚌</span><span>✈ ☀ 96</span></div>
  <div class="app-header">搜尋</div>
  <div class="search-wrap"><input id="q" class="search-box" placeholder="輸入路線號碼" readonly /></div>
  <div class="legend">
    <span style="background:#d81e26">九巴-紅色</span>
    <span style="background:#ff7a00">龍運-橙色</span>
    <span style="background:#1e8c45">城巴/嶼巴-綠色</span>
    <span style="background:#00a99d">九龍小巴-青綠</span>
    <span style="background:#8e7cc3">新界小巴-淺紫</span>
    <span style="background:#5dade2">港島小巴-淺藍</span>
    <span style="background:#0a58ca">港鐵巴士-藍色</span>
  </div>
  <div id="results" class="results"><div id="empty" class="hint">輸入路線號碼開始搜尋<br>已支援港鐵巴士與 GPS 附近路線定位</div></div>
  <div class="kbd-wrap"><div class="kbd" id="kbd"></div></div>
  <div class="info-bar"><div><span class="temp">☀ 28°C</span> 濕度 77%</div><div class="warn">現無警告</div></div>
  <div class="tabbar">
    <div class="tab"><i>⌂</i>主頁</div><div class="tab"><i>☆</i>收藏</div><div class="tab active"><i>🔍</i>搜尋</div><div class="tab"><i>📍</i>附近</div><div class="tab"><i>⛶</i>遊戲</div>
  </div>
  <div id="modal" class="modal" onclick="if(event.target==this)closeModal()"><div class="sheet"><div class="sheet-head"><div id="sheetTitle" style="font-weight:800"></div><button onclick="closeModal()" style="width:32px;height:32px;border-radius:16px;border:none">✕</button></div><div id="stopList" class="stop-list"></div></div></div>
