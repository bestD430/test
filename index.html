}
/* =========================================================
   方向改變
========================================================= */
function onDirectionChanged(index) {
    var items =
        document.querySelectorAll(
            '.config-item'
        );
    var item =
        items[index];
    if (!item) {
        return;
    }
    var dirSelect =
        item.querySelector(
            '.bus-dir'
        );
    var destInput =
        item.querySelector(
            '.bus-dest'
        );
    var newDir =
        dirSelect.value;
    currentBuses[index].dir =
        newDir;
    currentBuses[index].stop =
        '';
    item.setAttribute(
        'data-current-dir',
        newDir
    );
    item.setAttribute(
        'data-current-stop',
        ''
    );
    var selectedOpt =
        dirSelect.options[
            dirSelect.selectedIndex
        ];
    if (
        selectedOpt &&
        selectedOpt.text &&
        destInput
    ) {
        destInput.value =
            selectedOpt.text;
        currentBuses[index].dest_name =
            selectedOpt.text;
    }
    if (
        currentBuses[index].company ===
        'nlb'
    ) {
        currentBuses[index].nlb_route_id =
            newDir;
    }
    loadStopOptions(
        index,
        false
    );
}
/* =========================================================
   方向選項
========================================================= */
function updateDirectionOptions(
    index,
    isUserAction,
    callback
) {
    var items =
        document.querySelectorAll(
            '.config-item'
        );
    var item =
        items[index];
    if (!item) {
        if (callback) {
            callback();
        }
        return;
    }
    var company =
        item.querySelector(
            '.bus-company'
        ).value;
    var routeInput =
        item.querySelector(
            '.bus-route'
        );
    var route =
        routeInput.value
        .trim()
        .toUpperCase();
    var dirSelect =
        item.querySelector(
            '.bus-dir'
        );
    var currentDir =
        item.getAttribute(
            'data-current-dir'
        ) ||
        currentBuses[index].dir ||
        'outbound';
    var destInput =
        item.querySelector(
            '.bus-dest'
        );
    if (!route) {
        dirSelect.innerHTML =
            '<option value="outbound">' +
            '請先輸入路線...' +
            '</option>';
        if (callback) {
            callback();
        }
        return;
    }
    dirSelect.innerHTML =
        '<option value="' +
        escapeHtml(currentDir) +
        '">' +
        '方向載入中...' +
        '</option>';
    /* -----------------------------------------------------
       KMB / LWB
    ----------------------------------------------------- */
    if (
        company === 'kmb' ||
        company === 'lwb'
    ) {
        var destO = '';
        var destI = '';
        fetch(
            'https://data.etabus.gov.hk/v1/transport/kmb/route/' +
            route +
            '/outbound/1'
        )
        .then(function(res) {
            return res.json();
        })
        .then(function(d) {
            if (
                d &&
                d.data &&
                d.data.dest_tc
            ) {
                destO =
                    d.data.dest_tc;
            }
            return fetch(
                'https://data.etabus.gov.hk/v1/transport/kmb/route/' +
                route +
                '/inbound/1'
            );
        })
        .then(function(res) {
            return res.json();
        })
        .then(function(d) {
            if (
                d &&
                d.data &&
                d.data.dest_tc
            ) {
                destI =
                    d.data.dest_tc;
            }
            var html =
                '<option value="outbound">' +
                '往 ' +
                escapeHtml(
                    destO ||
                    '去程終點'
                ) +
                '</option>' +
                '<option value="inbound">' +
                '往 ' +
                escapeHtml(
                    destI ||
                    '回程終點'
                ) +
                '</option>';
            dirSelect.innerHTML =
                html;
            finalizeDir(
                dirSelect,
                item,
                currentDir,
                isUserAction,
                destInput,
                callback
            );
        })
        .catch(function() {
            dirSelect.innerHTML =
                '<option value="outbound">往 去程</option>' +
                '<option value="inbound">往 回程</option>';
            finalizeDir(
                dirSelect,
                item,
                currentDir,
                isUserAction,
                destInput,
                callback
            );
        });
    /* -----------------------------------------------------
       CTB
    ----------------------------------------------------- */
    } else if (
        company === 'ctb'
    ) {
        fetch(
            'https://rt.data.gov.hk/v2/transport/citybus/route/CTB/' +
            route
        )
        .then(function(res) {
            return res.json();
        })
        .then(function(data) {
            var html = '';
            if (
                data &&
                data.data
            ) {
                var destO =
                    data.data.dest_tc ||
                    '去程終點';
                var destI =
                    data.data.orig_tc ||
                    '回程終點';
                html =
                    '<option value="outbound">' +
                    '往 ' +
                    escapeHtml(
                        destO
                    ) +
                    '</option>' +
                    '<option value="inbound">' +
                    '往 ' +
                    escapeHtml(
                        destI
                    ) +
                    '</option>';
            } else {
                html =
                    '<option value="outbound">往 去程</option>' +
                    '<option value="inbound">往 回程</option>';
            }
            dirSelect.innerHTML =
                html;
            finalizeDir(
                dirSelect,
                item,
                currentDir,
                isUserAction,
                destInput,
                callback
            );
        })
        .catch(function() {
            dirSelect.innerHTML =
                '<option value="outbound">往 去程</option>' +
                '<option value="inbound">往 回程</option>';
            finalizeDir(
                dirSelect,
                item,
                currentDir,
                isUserAction,
                destInput,
                callback
            );
        });
    /* -----------------------------------------------------
       NLB
    ----------------------------------------------------- */
    } else if (
        company === 'nlb'
    ) {
        getNLBRouteList(
            function(routes) {
                var matched = [];
                for (
                    var i = 0;
                    i < routes.length;
                    i++
                ) {
                    var routeNo =
                        routes[i].routeNo;
                    if (
                        String(routeNo)
                        .toUpperCase() ===
                        route.toUpperCase()
                    ) {
                        matched.push(
                            routes[i]
                        );
                    }
                }
                if (
                    matched.length === 0
                ) {
                    dirSelect.innerHTML =
                        '<option value="">' +
                        '找不到 NLB 路線' +
                        '</option>';
                    if (callback) {
                        callback();
                    }
                    return;
                }
                var html = '';
                for (
                    var j = 0;
                    j < matched.length;
                    j++
                ) {
                    var r =
                        matched[j];
                    var routeId =
                        r.routeId;
                    var routeName =
                        r.routeName_c ||
                        r.routeName_tc ||
                        r.routeName_e ||
                        '';
                    html +=
                        '<option value="' +
                        escapeHtml(routeId) +
                        '">' +
                        '往 ' +
                        escapeHtml(
                            routeName
                        ) +
                        '</option>';
                }
                dirSelect.innerHTML =
                    html;
                finalizeDir(
                    dirSelect,
                    item,
                    currentDir,
                    isUserAction,
                    destInput,
                    callback
                );
            }
        );
    }
}
/* =========================================================
   完成方向設定
========================================================= */
function finalizeDir(
    dirSelect,
    item,
    currentDir,
    isUserAction,
    destInput,
    callback
) {
    if (
        !isUserAction &&
        currentDir
    ) {
        for (
            var k = 0;
            k < dirSelect.options.length;
            k++
        ) {
            if (
                String(
                    dirSelect.options[k].value
                ) ===
                String(currentDir)
            ) {
                dirSelect.selectedIndex =
                    k;
                break;
            }
        }
    }
    item.setAttribute(
        'data-current-dir',
        dirSelect.value
    );
    var index =
        parseInt(
            item.getAttribute(
                'data-index'
            ),
            10
        );
    if (
        !isNaN(index) &&
        currentBuses[index]
    ) {
        currentBuses[index].dir =
            dirSelect.value;
        if (
            currentBuses[index].company ===
            'nlb'
        ) {
            currentBuses[index].nlb_route_id =
                dirSelect.value;
        }
    }
    if (
        isUserAction &&
        dirSelect.options[
            dirSelect.selectedIndex
        ]
    ) {
        destInput.value =
            dirSelect.options[
                dirSelect.selectedIndex
            ].text;
    }
    if (callback) {
        callback();
    }
}
/* =========================================================
   車站
========================================================= */
function loadStopOptions(
    index,
    resetStop
) {
    var items =
        document.querySelectorAll(
            '.config-item'
        );
    var item =
        items[index];
    if (!item) {
        return;
    }
    var company =
        item.querySelector(
            '.bus-company'
        ).value;
    var route =
        item.querySelector(
            '.bus-route'
        ).value
        .trim()
        .toUpperCase();
    var dirSelect =
        item.querySelector(
            '.bus-dir'
        );
    var dir =
        dirSelect.value;
    var stopSelect =
        item.querySelector(
            '.bus-stop'
        );
    var currentStop =
        resetStop
        ?
        ''
        :
        (
            currentBuses[index]
            ?
            currentBuses[index].stop
            :
            item.getAttribute(
                'data-current-stop'
            )
        );
    if (
        !route ||
        !dir
    ) {
        stopSelect.innerHTML =
            '<option value="">' +
            '請先選擇方向...' +
            '</option>';
        return;
    }
    stopSelect.innerHTML =
        '<option value="">' +
        '車站載入中...' +
        '</option>';
    /* -----------------------------------------------------
       KMB / LWB
    ----------------------------------------------------- */
    if (
        company === 'kmb' ||
        company === 'lwb'
    ) {
        var kmbDir =
            dir === 'inbound'
            ? 'inbound'
            : 'outbound';
        getKmbStopsMap(
            function(stopsMap) {
                fetch(
                    'https://data.etabus.gov.hk/v1/transport/kmb/route-stop/' +
                    route +
                    '/' +
                    kmbDir +
                    '/1'
                )
                .then(function(res) {
                    return res.json();
                })
                .then(function(data) {
                    var list =
                        data.data || [];
                    var html =
                        '<option value="">' +
                        '請選擇車站...' +
                        '</option>';
                    for (
                        var i = 0;
                        i < list.length;
                        i++
                    ) {
                        var code =
                            list[i].stop;
                        var name =
                            stopsMap[code] ||
                            (
                                '車站 ' +
                                code
                            );
                        var selected =
                            code ===
                            currentStop
                            ?
                            'selected'
                            :
                            '';
                        html +=
                            '<option value="' +
                            escapeHtml(code) +
                            '" ' +
                            selected +
                            '>' +
                            (i + 1) +
                            '. ' +
                            escapeHtml(name) +
                            '</option>';
                    }
                    stopSelect.innerHTML =
                        html;
                    if (
                        currentStop &&
                        currentBuses[index]
                    ) {
                        currentBuses[index].stop =
                            currentStop;
                    }
                })
                .catch(function() {
                    if (currentStop) {
                        stopSelect.innerHTML =
                            '<option value="' +
                            escapeHtml(
                                currentStop
                            ) +
                            '" selected>' +
                            '已選代碼: ' +
                            escapeHtml(
                                currentStop
                            ) +
                            '</option>';
                    } else {
                        stopSelect.innerHTML =
                            '<option value="">' +
                            '載入車站失敗' +
                            '</option>';
                    }
                });
            }
        );
    /* -----------------------------------------------------
       CTB
    ----------------------------------------------------- */
    } else if (
        company === 'ctb'
    ) {
        fetch(
            'https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/' +
            route +
            '/' +
            dir
        )
        .then(function(res) {
            return res.json();
        })
        .then(function(data) {
            var list =
                data.data || [];
            if (
                list.length === 0
            ) {
                stopSelect.innerHTML =
                    '<option value="">' +
                    '無車站資料' +
                    '</option>';
                return;
            }
            var completedStops = 0;
            var stopNames =
                new Array(
                    list.length
                );
            list.forEach(
                function(sObj, idx) {
                    fetch(
                        'https://rt.data.gov.hk/v2/transport/citybus/stop/' +
                        sObj.stop
                    )
                    .then(function(res) {
                        return res.json();
                    })
                    .then(function(sData) {
                        stopNames[idx] =
                            sData.data
                            ? sData.data.name_tc
                            : sObj.stop;
                        completedStops++;
                        if (
                            completedStops ===
                            list.length
                        ) {
                            renderCTBStops();
                        }
                    })
                    .catch(function() {
                        stopNames[idx] =
                            sObj.stop;
                        completedStops++;
                        if (
                            completedStops ===
                            list.length
                        ) {
                            renderCTBStops();
                        }
                    });
                    function renderCTBStops() {
                        var html =
                            '<option value="">' +
                            '請選擇車站...' +
                            '</option>';
                        for (
                            var k = 0;
                            k < list.length;
                            k++
                        ) {
                            var code =
                                list[k].stop;
                            var name =
                                stopNames[k];
                            var selected =
                                code ===
                                currentStop
                                ?
                                'selected'
                                :
                                '';
                            html +=
                                '<option value="' +
                                escapeHtml(code) +
                                '" ' +
                                selected +
                                '>' +
                                (k + 1) +
                                '. ' +
                                escapeHtml(name) +
                                '</option>';
                        }
                        stopSelect.innerHTML =
                            html;
                    }
                }
            );
        })
        .catch(function() {
            if (currentStop) {
                stopSelect.innerHTML =
                    '<option value="' +
                    escapeHtml(
                        currentStop
                    ) +
                    '" selected>' +
                    '已選代碼: ' +
                    escapeHtml(
                        currentStop
                    ) +
                    '</option>';
            } else {
                stopSelect.innerHTML =
                    '<option value="">' +
                    '載入車站失敗' +
                    '</option>';
            }
        });
    /* -----------------------------------------------------
       NLB
    ----------------------------------------------------- */
    } else if (
        company === 'nlb'
    ) {
        getNLBStops(
            dir,
            function(stops) {
                var html =
                    '<option value="">' +
                    '請選擇車站...' +
                    '</option>';
                for (
                    var i = 0;
                    i < stops.length;
                    i++
                ) {
                    var code =
                        stops[i].stopId;
                    var name =
                        stops[i].stopName_c ||
                        stops[i].stopName_tc ||
                        stops[i].stopName_e ||
                        code;
                    var selected =
                        String(code) ===
                        String(currentStop)
                        ?
                        'selected'
                        :
                        '';
                    html +=
                        '<option value="' +
                        escapeHtml(code) +
                        '" ' +
                        selected +
                        '>' +
                        (i + 1) +
                        '. ' +
                        escapeHtml(name) +
                        '</option>';
                }
                stopSelect.innerHTML =
                    html;
            }
        );
    }
}
/* =========================================================
   車站改變
========================================================= */
function handleStopChange(index) {
    var items =
        document.querySelectorAll(
            '.config-item'
        );
    var item =
        items[index];
    if (!item) {
        return;
    }
    var stopSelect =
        item.querySelector(
            '.bus-stop'
        );
    var selectedOpt =
        stopSelect.options[
            stopSelect.selectedIndex
        ];
    var originInput =
        item.querySelector(
            '.bus-origin'
        );
    var stopValue =
        stopSelect.value;
    if (!currentBuses[index]) {
        currentBuses[index] = {};
    }
    currentBuses[index].stop =
        stopValue;
    item.setAttribute(
        'data-current-stop',
        stopValue
    );
    if (
        selectedOpt &&
        selectedOpt.value
    ) {
        var cleanName =
            selectedOpt.text.replace(
                /^\d+\.\s*/,
                ''
            );
        originInput.value =
            cleanName;
        currentBuses[index].origin_name =
            cleanName;
    }
}
/* =========================================================
   新增路線
========================================================= */
function addNewBusConfig() {
    currentBuses.push({
        company:'kmb',
        route:'',
        dir:'outbound',
        stop:'',
        origin_name:'',
        dest_name:'',
        offset:0,
        nlb_route_id:''
    });
    renderSettingsList();
}
/* =========================================================
   刪除路線
========================================================= */
function deleteBusConfig(index) {
    if (
        index < 0 ||
        index >= currentBuses.length
    ) {
        return;
    }
    currentBuses.splice(
        index,
        1
    );
    renderSettingsList();
}
/* =========================================================
   保存設定
========================================================= */
function saveBusConfig() {
    var items =
        document.querySelectorAll(
            '.config-item'
        );
    for (
        var i = 0;
        i < items.length;
        i++
    ) {
        syncConfigItemToBus(i);
    }
    var newConfigs = [];
    for (
        var j = 0;
        j < currentBuses.length;
        j++
    ) {
        var bus =
            currentBuses[j];
        if (!bus) {
            continue;
        }
        var route =
            String(
                bus.route || ''
            )
            .trim()
            .toUpperCase();
        var stop =
            String(
                bus.stop || ''
            )
            .trim();
        if (
            !route ||
            !stop
        ) {
            continue;
        }
        var busObj = {
            company:
                bus.company ||
                'kmb',
            route:
                route,
            dir:
                bus.dir ||
                'outbound',
            stop:
                stop,
            origin_name:
                bus.origin_name ||
                '',
            dest_name:
                bus.dest_name ||
                '',
            offset:
                parseFloat(
                    bus.offset ||
                    0
                )
        };
        if (
            bus.company ===
            'nlb'
        ) {
            busObj.nlb_route_id =
                bus.nlb_route_id ||
                bus.dir;
        }
        newConfigs.push(
            busObj
        );
    }
    currentBuses =
        newConfigs.slice();
    /* -----------------------------------------------------
       夜間設定
    ----------------------------------------------------- */
    var startEl =
        document.getElementById(
            'night-start-time'
        );
    var endEl =
        document.getElementById(
            'night-end-time'
        );
    var startTime =
        startEl
        ? startEl.value
        : '20:00';
    var endTime =
        endEl
        ? endEl.value
        : '05:00';
    localStorage.setItem(
        'night_mode_start',
        startTime
    );
    localStorage.setItem(
        'night_mode_end',
        endTime
    );
    /* -----------------------------------------------------
       保存全部路線
    ----------------------------------------------------- */
    localStorage.setItem(
        'user_bus_configs_v15',
        JSON.stringify(
            currentBuses
        )
    );
    closeSettings();
    fetchBusData();
}
/* =========================================================
   啟動
========================================================= */
loadBusConfigs();
fetchWeatherData();
fetchGovPressRelease();
fetchBusData();
/* =========================================================
   定時更新
========================================================= */
setInterval(
    fetchWeatherData,
    60000
);
setInterval(
    fetchGovPressRelease,
    60000
);
setInterval(
    fetchBusData,
    30000
);
</script>
