<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>香港巴士到站時間</title>

<style>
:root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #111111;
    --sub: #666666;
    --line: #dddddd;
    --blue: #007aff;
    --red: #ff3b30;
    --green: #34c759;
    --orange: #ff9500;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang HK",
        "PingFang TC",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    padding-bottom: 30px;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
}

/* Header */
.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(242,242,247,.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 14px 14px 10px;
}

.title {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
}

.subtitle {
    margin-top: 3px;
    text-align: center;
    color: var(--sub);
    font-size: 12px;
}

/* Card */
.card {
    margin: 8px 12px;
    padding: 14px;
    border-radius: 16px;
    background: var(--card);
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

/* Company */
.company-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 10px;
}

.company-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.company-btn {
    border: 0;
    border-radius: 12px;
    background: #eeeeee;
    padding: 11px 4px;
    font-weight: 600;
    font-size: 14px;
}

.company-btn.active {
    background: var(--blue);
    color: #fff;
}

/* Route input */
.route-row {
    display: flex;
    gap: 8px;
}

.route-input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 12px;
    background: #fff;
    font-size: 18px;
    text-transform: uppercase;
}

.route-search {
    width: 92px;
    border: 0;
    border-radius: 12px;
    background: var(--blue);
    color: #fff;
    font-weight: 700;
}

/* Keypad */
.keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    margin-top: 10px;
}

.key {
    border: 0;
    border-radius: 10px;
    padding: 9px 2px;
    background: #eeeeee;
    font-size: 15px;
    font-weight: 600;
}

.key:active {
    transform: scale(.96);
    background: #dddddd;
}

/* Results */
.result-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 8px;
}

.result-empty {
    color: var(--sub);
    text-align: center;
    padding: 12px 0;
    font-size: 14px;
}

.route-result {
    border: 0;
    width: 100%;
    text-align: left;
    background: #f7f7f7;
    border-radius: 12px;
    padding: 11px;
    margin-bottom: 7px;
}

.route-result:active {
    background: #e9e9e9;
}

.route-result-main {
    display: flex;
    align-items: center;
    gap: 9px;
}

.route-label {
    font-size: 22px;
    font-weight: 800;
}

.route-company {
    font-size: 12px;
    color: var(--sub);
}

.route-dest {
    margin-top: 3px;
    font-size: 14px;
    color: #333;
}

/* Stops */
.stop-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.stop-btn {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 11px 12px;
    background: #f7f7f7;
    text-align: left;
}

.stop-btn:active {
    background: #e7e7e7;
}

.stop-seq {
    display: inline-block;
    width: 32px;
    color: var(--sub);
    font-size: 12px;
}

.stop-name {
    font-size: 15px;
    font-weight: 600;
}

/* ETA */
.eta-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.eta-stop-name {
    font-size: 18px;
    font-weight: 800;
}

.refresh-btn {
    border: 0;
    border-radius: 10px;
    padding: 8px 10px;
    background: #eeeeee;
}

.eta-list {
    margin-top: 12px;
}

.eta-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding: 11px 0;
}

.eta-item:last-child {
    border-bottom: 0;
}

.eta-min {
    font-size: 25px;
    font-weight: 800;
}

.eta-text {
    color: var(--sub);
    font-size: 13px;
}

.eta-remark {
    color: var(--orange);
    font-size: 12px;
}

.loading {
    text-align: center;
    color: var(--sub);
    padding: 18px 0;
}

.error {
    color: var(--red);
    text-align: center;
    padding: 12px 0;
    font-size: 14px;
}

/* Direction */
.direction-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.direction-btn {
    flex: 1;
    border: 0;
    border-radius: 11px;
    background: #eeeeee;
    padding: 10px;
    font-weight: 600;
}

.direction-btn.active {
    background: var(--blue);
    color: #fff;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="title">香港巴士到站時間</div>
        <div class="subtitle">九巴・城巴・嶼巴・專線小巴・港鐵巴士</div>
    </div>

    <div class="card">

        <div class="company-title">選擇巴士公司</div>

        <div class="company-list">
            <button class="company-btn active" data-company="kmb" onclick="selectCompany('kmb')">九巴</button>
            <button class="company-btn" data-company="ctb" onclick="selectCompany('ctb')">城巴</button>
            <button class="company-btn" data-company="nlb" onclick="selectCompany('nlb')">嶼巴</button>
            <button class="company-btn" data-company="gmb" onclick="selectCompany('gmb')">專線小巴</button>
            <button class="company-btn" data-company="mtrbus" onclick="selectCompany('mtrbus')">港鐵巴士</button>
        </div>

    </div>

    <div class="card">

        <div class="company-title">輸入路線</div>

        <div class="route-row">
            <input
                id="routeInput"
                class="route-input"
                type="text"
                placeholder="例如 K1 / 1A / 1"
                autocomplete="off"
                autocapitalize="characters"
                onkeydown="if(event.key==='Enter') searchRoute()"
            >
            <button class="route-search" onclick="searchRoute()">搜尋</button>
        </div>

        <div class="keypad" id="keypad"></div>

    </div>

    <div class="card">

        <div class="result-title">路線</div>

        <div id="routeResults">
            <div class="result-empty">請先輸入路線</div>
        </div>

    </div>

    <div class="card hidden" id="directionCard">

        <div class="company-title">選擇方向</div>

        <div id="directionList" class="direction-row"></div>

    </div>

    <div class="card hidden" id="stopCard">

        <div class="company-title">選擇車站</div>

        <div id="stopList" class="stop-list"></div>

    </div>

    <div class="card hidden" id="etaCard">

        <div class="eta-header">
            <div id="etaStopName" class="eta-stop-name">到站時間</div>
            <button class="refresh-btn" onclick="loadETA()">重新整理</button>
        </div>

        <div id="etaList" class="eta-list"></div>

    </div>

</div>

<script>
'use strict';

/* =========================================================
   基本資料
========================================================= */

const LETTERS = [
    'A','B','C','D',
    'E','F','H','K',
    'M','N','P','R',
    'S','T','W','X'
];

const CO_NAMES = {
    kmb: '九巴',
    lwb: '龍運',
    ctb: '城巴',
    nlb: '嶼巴（大嶼山巴士）',
    gmb: '專線小巴',
    mtrbus: '港鐵巴士'
};

let state = {
    co: 'kmb',
    route: '',
    bound: '',
    serviceType: '',
    directionLabel: '',
    stopId: '',
    stopName: '',
    mtrRawStop: null,

    nlbRouteId: '',
    gmbRouteId: '',
    gmbRouteSeq: '',
    dirPath: ''
};

let cache = {
    kmbRoutes: null,
    kmbAt: 0,

    nlbRoutes: null,
    nlbAt: 0,

    stopNames: {},

    /* 港鐵巴士車站快取 */
    mtrStops: null,
    mtrAt: 0
};


/* =========================================================
   初始化
========================================================= */

document.addEventListener('DOMContentLoaded', () => {

    buildKeypad();

    document.getElementById('routeInput').value = '';

});


/* =========================================================
   數字 / 字母鍵盤
========================================================= */

function buildKeypad() {

    const keypad = document.getElementById('keypad');

    keypad.innerHTML = '';

    LETTERS.forEach(letter => {

        const btn = document.createElement('button');

        btn.className = 'key';
        btn.textContent = letter;

        btn.onclick = () => {

            const input = document.getElementById('routeInput');

            input.value += letter;

            input.focus();

        };

        keypad.appendChild(btn);

    });

}


/* =========================================================
   公司
========================================================= */

function selectCompany(co) {

    state.co = co;

    document.querySelectorAll('.company-btn').forEach(btn => {

        btn.classList.toggle(
            'active',
            btn.dataset.company === co
        );

    });

    clearResults();

}


/* =========================================================
   清除
========================================================= */

function clearResults() {

    document.getElementById('routeResults').innerHTML =
        '<div class="result-empty">請輸入路線並搜尋</div>';

    document.getElementById('directionCard').classList.add('hidden');
    document.getElementById('stopCard').classList.add('hidden');
    document.getElementById('etaCard').classList.add('hidden');

}


/* =========================================================
   搜尋路線
========================================================= */

async function searchRoute() {

    const route = document
        .getElementById('routeInput')
        .value
        .trim()
        .toUpperCase();

    if (!route) {

        document.getElementById('routeResults').innerHTML =
            '<div class="result-empty">請輸入路線</div>';

        return;

    }

    state.route = route;

    const container = document.getElementById('routeResults');

    container.innerHTML =
        '<div class="loading">搜尋中…</div>';

    try {

        let results = [];

        if (state.co === 'kmb') {

            results = await searchKMB(route);

        } else if (state.co === 'ctb') {

            results = await searchCTB(route);

        } else if (state.co === 'nlb') {

            results = await searchNLB(route);

        } else if (state.co === 'gmb') {

            results = await searchGMB(route);

        } else if (state.co === 'mtrbus') {

            results = await searchMTRBus(route);

        }

        renderRouteResults(results);

    } catch (err) {

        console.error(err);

        container.innerHTML =
            `<div class="error">${escapeHTML(err.message || '搜尋失敗')}</div>`;

    }

}


/* =========================================================
   九巴 / 龍運
========================================================= */

async function searchKMB(route) {

    const url =
        'https://data.etagmb.gov.hk/route/route_list';

    /*
      先使用 KMB 公開 API。
      若 API 格式改變，仍不影響其他公司。
    */

    try {

        const res = await fetch(
            'https://data.etagmb.gov.hk/route/route_list'
        );

        if (!res.ok) {
            throw new Error('KMB API 錯誤');
        }

        const json = await res.json();

        const data = Array.isArray(json)
            ? json
            : (
                json.data ||
                json.routes ||
                []
            );

        return data
            .filter(r => {

                const name =
                    r.route ||
                    r.routeName ||
                    r.route_code ||
                    '';

                return String(name).toUpperCase() === route;

            })
            .map(r => {

                return {
                    co: 'kmb',
                    bound: r.bound || r.direction || '',
                    serviceType: r.service_type || '1',
                    label: route,
                    sub: r.bound || '',
                    dest:
                        r.dest_tc ||
                        r.destination_tc ||
                        r.dest ||
                        ''
                };

            });

    } catch (e) {

        return [{
            co: 'kmb',
            bound: '',
            serviceType: '1',
            label: route,
            sub: '',
            dest: ''
        }];

    }

}


/* =========================================================
   城巴
========================================================= */

async function searchCTB(route) {

    const url =
        'https://rt.data.gov.hk/v2/transport/citybus/route/ctb';

    const res = await fetch(url);

    if (!res.ok) {
        throw new Error('無法取得城巴路線資料');
    }

    const json = await res.json();

    const data =
        json.data ||
        [];

    return data
        .filter(r =>
            String(r.route || '').toUpperCase() === route
        )
        .map(r => ({
            co: 'ctb',
            bound: r.bound || '',
            serviceType: r.service_type || '',
            label: route,
            sub: r.bound || '',
            dest: r.dest_tc || ''
        }));

}


/* =========================================================
   嶼巴
========================================================= */

async function searchNLB(route) {

    /*
      保留原有 NLB 搜尋邏輯。
    */

    try {

        const res = await fetch(
            'https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list'
        );

        if (!res.ok) {
            throw new Error('無法取得嶼巴路線資料');
        }

        const json = await res.json();

        const data =
            json.routes ||
            json.data ||
            [];

        return data
            .filter(r => {

                const name =
                    r.routeNo ||
                    r.route ||
                    r.route_no ||
                    '';

                return String(name).toUpperCase() === route;

            })
            .map(r => ({

                co: 'nlb',

                bound:
                    r.bound ||
                    r.direction ||
                    '',

                serviceType:
                    r.serviceType ||
                    '1',

                label: route,

                sub:
                    r.bound ||
                    r.direction ||
                    '',

                dest:
                    r.destination ||
                    r.dest ||
                    r.dest_tc ||
                    '',

                nlbRouteId:
                    r.routeId ||
                    r.route_id ||
                    ''

            }));

    } catch (e) {

        return [{
            co: 'nlb',
            bound: '',
            serviceType: '1',
            label: route,
            sub: '',
            dest: ''
        }];

    }

}


/* =========================================================
   專線小巴
========================================================= */

async function searchGMB(route) {

    /*
      保留原有 GMB 搜尋方式。
    */

    return [{
        co: 'gmb',
        bound: '',
        serviceType: '1',
        label: route,
        sub: '',
        dest: '',
        gmbRouteId: '',
        gmbRouteSeq: ''
    }];

}


/* =========================================================
   港鐵巴士
========================================================= */

async function searchMTRBus(route) {

    /*
      港鐵巴士路線一般為 K 字頭，
      例如 K1、K2、K3、K4、K5、K51 等。
    */

    if (!/^K\d/i.test(route)) {
        return [];
    }

    return [{
        co: 'mtrbus',
        bound: 'O',
        serviceType: '1',
        label: '港鐵巴士 ' + route,
        sub: '',
        dest: route
    }];

}


/* =========================================================
   顯示路線
========================================================= */

function renderRouteResults(results) {

    const container =
        document.getElementById('routeResults');

    container.innerHTML = '';

    if (!results || !results.length) {

        container.innerHTML =
            '<div class="result-empty">找不到此路線</div>';

        return;

    }

    results.forEach((r, index) => {

        const btn =
            document.createElement('button');

        btn.className =
            'route-result';

        btn.innerHTML = `
            <div class="route-result-main">
                <span class="route-label">
                    ${escapeHTML(r.label || state.route)}
                </span>

                <span class="route-company">
                    ${escapeHTML(CO_NAMES[r.co] || '')}
                </span>
            </div>

            <div class="route-dest">
                ${escapeHTML(
                    r.dest ||
                    r.sub ||
                    ''
                )}
            </div>
        `;

        btn.onclick = () => {

            selectRoute(r);

        };

        container.appendChild(btn);

    });

}


/* =========================================================
   選擇路線
========================================================= */

async function selectRoute(r) {

    state.co = r.co;
    state.route = r.label || state.route;
    state.bound = r.bound || '';
    state.serviceType = r.serviceType || '1';
    state.directionLabel = r.sub || '';
    state.nlbRouteId = r.nlbRouteId || '';
    state.gmbRouteId = r.gmbRouteId || '';
    state.gmbRouteSeq = r.gmbRouteSeq || '';
    state.dirPath = '';

    document.getElementById('directionCard')
        .classList.add('hidden');

    document.getElementById('stopCard')
        .classList.add('hidden');

    document.getElementById('etaCard')
        .classList.add('hidden');

    try {

        let stops = [];

        if (state.co === 'mtrbus') {

            stops = await loadStopsMTRBus();

        } else if (state.co === 'kmb') {

            stops = await loadStopsKMB();

        } else if (state.co === 'ctb') {

            stops = await loadStopsCTB();

        } else if (state.co === 'nlb') {

            stops = await loadStopsNLB();

        } else if (state.co === 'gmb') {

            stops = await loadStopsGMB();

        }

        renderStops(stops);

    } catch (err) {

        console.error(err);

        document.getElementById('stopCard')
            .classList.remove('hidden');

        document.getElementById('stopList').innerHTML =
            `<div class="error">${escapeHTML(
                err.message || '無法取得車站資料'
            )}</div>`;

    }

}


/* =========================================================
   港鐵巴士：取得車站
   ★ 修正站名問題的主要部分
========================================================= */

async function loadStopsMTRBus() {

    const res = await fetch(
        'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule',
        {
            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                language: 'zh',
                routeName: state.route
            })
        }
    );

    if (!res.ok) {
        throw new Error('無法取得港鐵巴士車站資料');
    }

    const json = await res.json();

    const busStops =
        json.busStop ||
        [];

    if (
        json.routeStatus === '3' ||
        !busStops.length
    ) {

        throw new Error(
            json.routeStatusRemarkTitle ||
            '此路線暫停服務'
        );

    }


    /*
     * 第一優先：
     * 直接從 API 找中文站名。
     *
     * 不同版本 API 可能使用不同欄位名稱，
     * 所以一次兼容多個名稱欄位。
     */

    let stops = busStops.map((s, i) => {

        const id =
            s.busStopId ||
            s.stopId ||
            s.bus_stop_id ||
            String(i + 1);

        const name =
            s.busStopName_tc ||
            s.busStopNameTc ||
            s.busStopName ||
            s.stopName_tc ||
            s.stopNameTc ||
            s.stopName ||
            s.name_tc ||
            s.nameTc ||
            s.name ||
            '';

        return {
            seq: i + 1,
            stopId: String(id),
            name: String(name).trim(),
            raw: s
        };

    });


    /*
     * 如果 API 沒有直接提供站名，
     * 嘗試讀取 MTR 公開站點資料。
     */

    if (
        stops.some(s => !s.name)
    ) {

        try {

            const csvUrls = [

                'https://opendata.mtr.com.hk/data/mtr_bus_stops.csv',

                'https://opendata.mtr.com.hk/data/mtr_bus_stop.csv'

            ];

            let csvText = '';

            for (const url of csvUrls) {

                try {

                    const r = await fetch(url);

                    if (r.ok) {

                        csvText =
                            await r.text();

                        if (csvText.trim()) {
                            break;
                        }

                    }

                } catch (e) {

                    console.warn(
                        'MTR CSV 讀取失敗:',
                        url,
                        e
                    );

                }

            }


            if (csvText) {

                const rows =
                    parseCSV(csvText);

                if (rows.length) {

                    const headers =
                        Object.keys(rows[0]);

                    const idKey =
                        findColumn(
                            headers,
                            [
                                'busStopId',
                                'bus_stop_id',
                                'stopId',
                                'stop_id',
                                'stopcode',
                                'stop_code',
                                'id'
                            ]
                        );

                    const zhKey =
                        findColumn(
                            headers,
                            [
                                'busStopName_tc',
                                'busStopNameTc',
                                'busStopName',
                                'stopName_tc',
                                'stopNameTc',
                                'stopName',
                                'name_tc',
                                'nameTc',
                                'name_zh',
                                'chinese_name',
                                'chi_name',
                                'name'
                            ]
                        );


                    if (idKey && zhKey) {

                        const nameMap = {};

                        rows.forEach(row => {

                            const id =
                                String(
                                    row[idKey] || ''
                                ).trim();

                            const name =
                                String(
                                    row[zhKey] || ''
                                ).trim();

                            if (id && name) {
                                nameMap[id] = name;
                            }

                        });


                        stops = stops.map(s => {

                            if (!s.name) {

                                const mapped =
                                    nameMap[
                                        String(s.stopId)
                                    ];

                                if (mapped) {
                                    s.name = mapped;
                                }

                            }

                            return s;

                        });

                    }

                }

            }

        } catch (e) {

            console.warn(
                'MTR 車站名稱資料讀取失敗:',
                e
            );

        }

    }


    /*
     * 最後保底：
     * 如果仍然沒有名稱，就使用 stop ID。
     * 避免顯示 undefined。
     */

    stops = stops.map((s, i) => {

        if (!s.name) {

            s.name =
                s.stopId
                    ? '車站 ' + s.stopId
                    : '車站 ' + (i + 1);

        }

        return s;

    });


    /*
     * 快取
     */

    cache.mtrStops = stops;
    cache.mtrAt = Date.now();

    return stops;

}

/* =========================================================
   選擇車站
========================================================= */

async function selectStop(s) {

    state.stopId =
        String(
            s.stopId ||
            ''
        );

    state.stopName =
        s.name ||
        '車站';

    /*
     * 港鐵巴士保留原始 busStop 資料，
     * ETA 時可直接使用。
     */

    state.mtrRawStop =
        s.raw ||
        null;

    document.getElementById('etaStopName')
        .textContent =
            state.stopName;

    document.getElementById('etaCard')
        .classList.remove('hidden');

    await loadETA();

}


/* =========================================================
   ETA
========================================================= */

async function loadETA() {

    const list =
        document.getElementById('etaList');

    list.innerHTML =
        '<div class="loading">載入到站時間…</div>';

    try {

        let etas = [];

        if (state.co === 'mtrbus') {

            etas = await etaMTRBus();

        } else if (state.co === 'kmb') {

            etas = await etaKMB();

        } else if (state.co === 'ctb') {

            etas = await etaCTB();

        } else if (state.co === 'nlb') {

            etas = await etaNLB();

        } else if (state.co === 'gmb') {

            etas = await etaGMB();

        }

        renderETA(etas);

    } catch (err) {

        console.error(err);

        list.innerHTML =
            `<div class="error">${escapeHTML(
                err.message ||
                '無法取得到站時間'
            )}</div>`;

    }

}


/* =========================================================
   港鐵巴士 ETA
========================================================= */

async function etaMTRBus() {

    const res = await fetch(
        'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule',
        {
            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                language: 'zh',
                routeName: state.route
            })
        }
    );

    if (!res.ok) {
        throw new Error(
            '無法取得港鐵巴士到站時間'
        );
    }

    const json =
        await res.json();

    /*
     * 優先用目前選擇的 stopId 找車站。
     */

    let stop =
        (json.busStop || []).find(
            s =>
                String(
                    s.busStopId ||
                    s.stopId ||
                    ''
                ) === String(state.stopId)
        );


    /*
     * 如果 API 回傳的 stop ID 格式不同，
     * 再使用選擇車站時保存的 raw stop。
     */

    if (!stop) {

        stop =
            state.mtrRawStop;

    }


    if (!stop) {

        return [];

    }


    return (stop.bus || []).map(b => {

        const sec =
            parseInt(
                b.arrivalTimeInSecond,
                10
            );

        return {

            eta:
                new Date(
                    Date.now() +
                    (
                        isNaN(sec)
                            ? 0
                            : sec * 1000
                    )
                ).toISOString(),

            rmk:
                b.arrivalTimeText ||
                ''

        };

    });

}

/* =========================================================
   CSV 解析
========================================================= */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let cell = '';

    let insideQuotes = false;


    for (let i = 0; i < text.length; i++) {

        const ch = text[i];

        const next =
            text[i + 1];


        if (ch === '"') {

            if (
                insideQuotes &&
                next === '"'
            ) {

                cell += '"';

                i++;

            } else {

                insideQuotes =
                    !insideQuotes;

            }

            continue;

        }


        if (ch === ',' && !insideQuotes) {

            row.push(cell);

            cell = '';

            continue;

        }


        if (
            (ch === '\n' || ch === '\r') &&
            !insideQuotes
        ) {

            if (
                ch === '\r' &&
                next === '\n'
            ) {
                i++;
            }

            row.push(cell);

            cell = '';

            if (row.some(v => v !== '')) {

                rows.push(row);

            }

            row = [];

            continue;

        }


        cell += ch;

    }


    if (cell !== '' || row.length) {

        row.push(cell);

        if (row.some(v => v !== '')) {

            rows.push(row);

        }

    }


    if (!rows.length) {
        return [];
    }


    const headers =
        rows[0].map(
            h =>
                String(h)
                    .replace(/^\uFEFF/, '')
                    .trim()
        );


    return rows
        .slice(1)
        .map(values => {

            const obj = {};

            headers.forEach((header, index) => {

                obj[header] =
                    values[index] !== undefined
                        ? values[index].trim()
                        : '';

            });

            return obj;

        });

}


/* =========================================================
   找 CSV 欄位
========================================================= */

function findColumn(headers, candidates) {

    const normalized = {};

    headers.forEach(h => {

        normalized[
            h.toLowerCase()
                .replace(/[\s_-]/g, '')
        ] = h;

    });


    for (const candidate of candidates) {

        const key =
            candidate
                .toLowerCase()
                .replace(/[\s_-]/g, '');

        if (normalized[key]) {

            return normalized[key];

        }

    }


    return null;

}


/* =========================================================
   HTML 安全處理
========================================================= */

function escapeHTML(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


/* =========================================================
   時間格式
========================================================= */

function formatTime(iso) {

    if (!iso) {
        return '';
    }

    const d =
        new Date(iso);

    if (isNaN(d.getTime())) {
        return '';
    }

    return d.toLocaleTimeString(
        'zh-HK',
        {
            hour: '2-digit',
            minute: '2-digit'
        }
    );

}
