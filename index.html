<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>貓咪邏輯謎題 Meowdoku</title>
<style>
  :root {
    --bg: #f8f4ef;
    --card: #fffdf9;
    --text: #4a3f35;
    --accent: #e8b86d;
    --heart: #ff6b6b;
    --success: #7bc67e;
    --fail: #e07a7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #f0e6d8 0%, #e8d9c8 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding: 8px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 92vh;
    position: relative;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 8px;
    background: #fff;
  }
  .back-btn, .settings-btn {
    width: 36px; height: 36px;
    border: none; background: #f5f0e8;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .level-title {
    font-size: 20px;
    font-weight: 700;
    color: #5c4a3a;
  }
  .status-bar {
    display: flex;
    justify-content: center;
    gap: 16px;
    padding: 6px 16px 10px;
    align-items: center;
  }
  .cats-count {
    background: #fff;
    border: 1.5px solid #e8d9c8;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hearts {
    display: flex;
    gap: 4px;
    font-size: 18px;
  }
  .rules {
    display: flex;
    gap: 6px;
    padding: 0 12px 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .rule-btn {
    background: #faf6f0;
    border: 1.5px solid #e8d9c8;
    border-radius: 12px;
    padding: 6px 10px;
    font-size: 12px;
    color: #6b5a4a;
    cursor: default;
    white-space: nowrap;
  }
  .rule-btn.active {
    background: #fff3e0;
    border-color: #e8b86d;
    color: #8b6914;
    font-weight: 600;
  }
  .grid-wrap {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px 12px 16px;
    position: relative;
  }
  #grid {
    display: grid;
    gap: 3px;
    background: #d4c4b0;
    border-radius: 12px;
    padding: 4px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
    position: relative;
    z-index: 1;
  }
  .cell {
    aspect-ratio: 1;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    position: relative;
    transition: transform 0.12s, box-shadow 0.12s;
    user-select: none;
    -webkit-user-select: none;
  }
  .cell:active { transform: scale(0.92); }
  .cell.prefilled { cursor: default; }
  .cell.marked::after {
    content: "✕";
    position: absolute;
    font-size: 20px;
    color: rgba(255,255,255,0.85);
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .cell.has-cat {
    box-shadow: 0 0 0 2px #fff, 0 0 12px rgba(255,200,100,0.6);
  }
  
  /* 火燒憤怒特效 */
  .cell.angry .cat-svg {
    animation: fire-shake 0.3s ease infinite;
    filter: drop-shadow(0 0 10px #ff4d4d) drop-shadow(0 -5px 15px #ff944d) drop-shadow(0 -10px 20px #ffc34d);
  }
  @keyframes fire-shake {
    0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1.1); }
    25% { transform: translate(-3px, 2px) rotate(-5deg) scale(1.1); }
    50% { transform: translate(3px, -2px) rotate(5deg) scale(1.1); }
    75% { transform: translate(-2px, -3px) rotate(-3deg) scale(1.1); }
  }

  .footer {
    text-align: center;
    padding: 12px 16px 20px;
    background: linear-gradient(180deg, transparent, #e8f4fc);
    position: relative;
  }
  .footer-text {
    font-size: 18px;
    font-weight: 700;
    color: #3a7ca5;
    margin-bottom: 8px;
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    padding: 0 16px 16px;
    z-index: 10;
  }
  .btn {
    border: none;
    border-radius: 14px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: #e8b86d; color: #5c3d0a; }
  .btn-secondary { background: #f0e6d8; color: #5c4a3a; }
  .btn-danger { background: #ffb4b4; color: #8b1a1a; }
  
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,253,249,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .overlay h2 { font-size: 28px; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(255,255,255,0.8); z-index: 30; }
  .overlay p { font-size: 15px; color: #6b5a4a; margin-bottom: 16px; text-align: center; padding: 0 20px; z-index: 30;}
  .overlay .btn { z-index: 30; }

  .start-screen, .level-complete, .game-over {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal {
    background: #fffdf9;
    border-radius: 24px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal h1 { font-size: 26px; color: #5c4a3a; margin-bottom: 8px; }
  .modal p { color: #7a6a5a; margin-bottom: 20px; line-height: 1.5; }
  .modal .btn { width: 100%; margin-top: 8px; padding: 14px; font-size: 16px; }
  .hidden { display: none !important; }
  
  .cat-svg {
    width: 85%;
    height: 85%;
    display: block;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
    pointer-events: none;
  }

  /* --- 走路與撲向螢幕的全身貓咪動畫 --- */
  #celebration-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 25;
    overflow: hidden;
    border-radius: 12px;
  }
  
  .walking-cat {
    position: absolute;
    width: 80px;
    height: 80px;
    will-change: transform, opacity;
    transform-origin: center bottom;
  }
  
  .walking-cat .body-wrap {
    animation: cat-bob 0.4s infinite alternate ease-in-out;
  }
  
  /* 走路四肢擺動 */
  .leg-fl, .leg-br { animation: leg-swing 0.6s infinite alternate ease-in-out; transform-origin: top center; }
  .leg-fr, .leg-bl { animation: leg-swing-reverse 0.6s infinite alternate ease-in-out; transform-origin: top center; }
  
  @keyframes cat-bob {
    0% { transform: translateY(0); }
    100% { transform: translateY(-4px); }
  }
  @keyframes leg-swing {
    0% { transform: rotate(-25deg); }
    100% { transform: rotate(25deg); }
  }
  @keyframes leg-swing-reverse {
    0% { transform: rotate(25deg); }
    100% { transform: rotate(-25deg); }
  }

  /* 撲向螢幕的放大淡出效果 */
  .walking-cat.pounce {
    animation: cat-pounce 1s forwards ease-in;
  }
  @keyframes cat-pounce {
    0% { transform: scale(1) translateY(0); opacity: 1; }
    40% { transform: scale(1.2) translateY(-20px); opacity: 1; }
    100% { transform: scale(6) translateY(50px); opacity: 0; }
  }

</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <button class="back-btn" id="btnPrev" title="上一關">←</button>
    <div class="level-title" id="levelTitle">第 1 關</div>
    <button class="settings-btn" id="btnMenu" title="選單">⚙</button>
  </header>

  <div class="status-bar">
    <div class="cats-count">
      <span id="statusCatIcon"></span>
      <span id="catsProgress">0/5</span>
    </div>
    <div class="hearts" id="hearts">❤️❤️❤️</div>
  </div>

  <div class="rules">
    <div class="rule-btn active">每色1隻貓</div>
    <div class="rule-btn active">每行列1隻貓</div>
    <div class="rule-btn active">貓咪不能相鄰</div>
  </div>

  <div class="grid-wrap">
    <div id="grid"></div>
    <div id="celebration-container"></div> <!-- 慶祝動畫容器 -->
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">🎉 過關！</h2>
      <p id="overlayMsg">貓咪開心地向你撲來！</p>
      <button class="btn btn-primary" id="btnNext">下一關 →</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-secondary" id="btnClear">清除</button>
    <button class="btn btn-primary" id="btnCheck">檢查</button>
    <button class="btn btn-danger" id="btnHint">提示</button>
  </div>

  <div class="footer">
    <div class="footer-text" id="footerText">找到貓咪</div>
  </div>
</div>

<!-- Start Modal & Menu Modals... -->
<div class="start-screen" id="startScreen">
  <div class="modal">
    <h1>🐈 貓咪邏輯謎題</h1>
    <p>每色區域放 1 隻貓<br>每行每列各 1 隻<br>貓咪不能相鄰（含對角線）</p>
    <button class="btn btn-primary" id="btnStart">開始遊戲</button>
    <button class="btn btn-secondary" id="btnContinue" style="display:none">繼續遊戲</button>
  </div>
</div>

<div class="start-screen hidden" id="menuScreen">
  <div class="modal">
    <h1>選單</h1>
    <button class="btn btn-primary" id="btnRestartLevel">重新本關</button>
    <button class="btn btn-secondary" id="btnSelectLevel">選擇關卡</button>
    <button class="btn btn-secondary" id="btnToggleSound">音樂：開</button>
    <button class="btn btn-secondary" id="btnCloseMenu">關閉</button>
  </div>
</div>

<div class="start-screen hidden" id="levelSelectScreen">
  <div class="modal" style="max-height:80vh;overflow-y:auto">
    <h1>選擇關卡</h1>
    <div id="levelGrid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0"></div>
    <button class="btn btn-secondary" id="btnCloseLevelSelect">關閉</button>
  </div>
</div>

<script>
const MAX_LEVEL = 500;
const COLORS = [
  '#f8a5a5','#f8c291','#f7d794','#b8e994','#82ccdd',
  '#a29bfe','#fd79a8','#e17055','#00b894','#0984e3'
];

// 基於 image_2.png 的四款貓咪資料
const CAT_STYLES = [
  { // 0: 左上灰白貓
    body: '#f4f1eb', patch: '#a49796', eye: '#2c2925', nose: '#9a6b68', 
    drawHead: `<path d="M15 45 Q5 25 15 10 L30 20 Q50 15 70 20 L85 10 Q95 25 85 45 Q95 75 50 85 Q5 75 15 45 Z" fill="#f4f1eb"/>
               <path d="M50 15 Q70 20 85 10 Q95 25 85 45 Q75 40 50 15 Z" fill="#a49796"/>
               <circle cx="30" cy="45" r="5" fill="#2c2925"/> <circle cx="70" cy="45" r="5" fill="#2c2925"/>
               <path d="M47 53 L53 53 L50 56 Z" fill="#9a6b68"/>
               <path d="M10 55 L20 60 M12 65 L22 65 M15 75 L25 70" stroke="#5a524e" stroke-width="3" stroke-linecap="round"/>
               <path d="M90 55 L80 60 M88 65 L78 65 M85 75 L75 70" stroke="#5a524e" stroke-width="3" stroke-linecap="round"/>`
  },
  { // 1: 右上大眼黑貓
    body: '#26221c', patch: '#26221c', eye: '#e2d3ae', nose: '#635345',
    drawHead: `<path d="M15 45 Q5 25 15 10 L30 20 Q50 15 70 20 L85 10 Q95 25 85 45 Q95 75 50 85 Q5 75 15 45 Z" fill="#26221c"/>
               <path d="M22 18 L32 26 L26 30 Z" fill="#d2a084"/> <path d="M78 18 L68 26 L74 30 Z" fill="#d2a084"/>
               <circle cx="35" cy="45" r="14" fill="#e2d3ae"/> <circle cx="35" cy="45" r="10" fill="#111"/> <circle cx="38" cy="42" r="3" fill="#fff"/>
               <circle cx="65" cy="45" r="14" fill="#e2d3ae"/> <circle cx="65" cy="45" r="10" fill="#111"/> <circle cx="68" cy="42" r="3" fill="#fff"/>
               <path d="M47 55 L53 55 L50 58 Z" fill="#635345"/>`
  },
  { // 2: 左下棕斑白貓
    body: '#fcf8ec', patch: '#bb8258', eye: '#3a2717', nose: '#4a382c',
    drawHead: `<path d="M15 45 Q5 25 15 10 L30 20 Q50 15 70 20 L85 10 Q95 25 85 45 Q95 75 50 85 Q5 75 15 45 Z" fill="#fcf8ec"/>
               <path d="M15 45 Q5 25 15 10 L30 20 Q45 25 50 50 Q45 65 10 55 Q5 45 15 45 Z" fill="#bb8258"/>
               <path d="M22 18 L32 26 L26 30 Z" fill="#f6cca7"/> <path d="M78 18 L68 26 L74 30 Z" fill="#f6cca7"/>
               <circle cx="33" cy="50" r="11" fill="#3a2717"/> <circle cx="35" cy="46" r="3" fill="#fff"/>
               <circle cx="67" cy="50" r="11" fill="#3a2717"/> <circle cx="69" cy="46" r="3" fill="#fff"/>
               <path d="M48 60 L52 60 L50 62 Z" fill="#4a382c"/>
               <path d="M15 65 L25 68 M18 73 L28 72 M85 65 L75 68 M82 73 L72 72" stroke="#4a382c" stroke-width="2.5" stroke-linecap="round"/>`
  },
  { // 3: 右下虎斑橘貓
    body: '#df8b5b', patch: '#cb613b', eye: '#31231a', nose: '#432c21',
    drawHead: `<path d="M15 45 Q5 25 15 10 L30 20 Q50 15 70 20 L85 10 Q95 25 85 45 Q95 75 50 85 Q5 75 15 45 Z" fill="#df8b5b"/>
               <path d="M22 18 L32 26 L26 30 Z" fill="#e9bfa2"/> <path d="M78 18 L68 26 L74 30 Z" fill="#e9bfa2"/>
               <!-- 頭頂紋 --> <path d="M40 15 L42 25 M50 14 L50 25 M60 15 L58 25" stroke="#cb613b" stroke-width="4" stroke-linecap="round"/>
               <!-- 側邊紋 --> <path d="M5 45 L20 50 M2 55 L22 58 M8 65 L20 65" stroke="#cb613b" stroke-width="4" stroke-linecap="round"/>
               <path d="M95 45 L80 50 M98 55 L78 58 M92 65 L80 65" stroke="#cb613b" stroke-width="4" stroke-linecap="round"/>
               <circle cx="35" cy="50" r="5" fill="#31231a"/> <circle cx="65" cy="50" r="5" fill="#31231a"/>
               <path d="M47 58 L53 58 L50 61 Z" fill="#432c21"/>
               <path d="M22 62 L30 65 M24 68 L32 68 M78 62 L70 65 M76 68 L68 68" stroke="#31231a" stroke-width="2.5" stroke-linecap="round"/>`
  }
];

// 大頭 SVG (用於九宮格)
function getCatSVG(variant = 0, size = 64) {
  const v = CAT_STYLES[variant % 4];
  return `<svg class="cat-svg" viewBox="0 0 100 100" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
    ${v.drawHead}
  </svg>`;
}

// 全身 SVG (用於過關動畫)
function getFullBodyCatSVG(variant = 0) {
  const v = CAT_STYLES[variant % 4];
  return `<svg viewBox="0 0 100 140" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <g class="body-wrap">
      <!-- 尾巴 -->
      <path d="M 70 85 Q 90 70 85 50 Q 80 40 75 45" fill="none" stroke="${v.patch}" stroke-width="8" stroke-linecap="round"/>
      <!-- 後腿 -->
      <line class="leg-bl" x1="40" y1="90" x2="40" y2="120" stroke="${v.body}" stroke-width="12" stroke-linecap="round"/>
      <line class="leg-br" x1="60" y1="90" x2="60" y2="120" stroke="${v.body}" stroke-width="12" stroke-linecap="round"/>
      <!-- 身體 (膠囊狀) -->
      <rect x="25" y="40" width="50" height="60" rx="25" fill="${v.body}"/>
      <!-- 前腿 -->
      <line class="leg-fl" x1="35" y1="95" x2="35" y2="125" stroke="${v.body}" stroke-width="10" stroke-linecap="round" filter="brightness(0.9)"/>
      <line class="leg-fr" x1="65" y1="95" x2="65" y2="125" stroke="${v.body}" stroke-width="10" stroke-linecap="round" filter="brightness(0.9)"/>
      <!-- 頭部 (縮小放入身體上方) -->
      <g transform="translate(10, 0) scale(0.8)">
        ${v.drawHead}
      </g>
    </g>
  </svg>`;
}

let currentLevel = 1, gridSize = 5, regions = [], solution = [];
let playerCats = new Set(), marked = new Set(), prefilled = new Set();
let hearts = 3, soundOn = true, audioCtx = null, isAnimating = false;

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, duration, type='sine', vol=0.05) {
  if (!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function playHappy() { if(!soundOn)return; initAudio(); [523, 659, 784, 1047].forEach((n,i)=>setTimeout(()=>playTone(n,0.2,'triangle',0.06), i*150)); }
function playAngry() { if(!soundOn)return; initAudio(); [150, 100].forEach((n,i)=>setTimeout(()=>playTone(n,0.3,'sawtooth',0.08), i*200)); }

// (省略部分產生器邏輯以保證簡潔，保留核心)
function generateValidPositions(n) {
  const fallback = [];
  const step = Math.max(2, Math.floor(n / 2));
  for (let i = 0; i < n; i++) fallback.push({r: i, c: (i * step) % n});
  return fallback;
}
function growRegions(n, cats) {
  const region = Array.from({length: n}, () => Array(n).fill(0));
  cats.forEach((cat, id) => { region[cat.r][cat.c] = id; });
  for (let r=0; r<n; r++) for(let c=0; c<n; c++) {
    if(region[r][c]===0) {
      let best=0, bestD=999;
      cats.forEach((cat, id) => {
        let d = Math.abs(cat.r-r) + Math.abs(cat.c-c);
        if(d<bestD){bestD=d; best=id;}
      });
      region[r][c] = best;
    }
  }
  return region;
}

function loadLevel(level) {
  currentLevel = level; hearts = 3; isAnimating = false;
  playerCats.clear(); marked.clear(); prefilled.clear();
  document.getElementById('celebration-container').innerHTML = ''; // 清除動畫貓咪
  document.getElementById('overlay').classList.remove('show');
  
  gridSize = 5; 
  let cats = generateValidPositions(gridSize);
  regions = growRegions(gridSize, cats);
  solution = cats;
  
  // 隨機預填 1-2 隻
  prefilled.add(`${cats[0].r},${cats[0].c}`);
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
  const cellSize = 50;

  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const rid = regions[r][c];
      cell.style.background = COLORS[rid % COLORS.length];
      
      const key = `${r},${c}`;
      if (prefilled.has(key) || playerCats.has(key)) {
        cell.classList.add('has-cat');
        if(prefilled.has(key)) cell.classList.add('prefilled');
        cell.innerHTML = getCatSVG(rid % 4, cellSize * 0.9);
      } else if (marked.has(key)) {
        cell.classList.add('marked');
      }
      cell.onclick = () => onCellClick(r, c);
      grid.appendChild(cell);
    }
  }
  document.getElementById('catsProgress').textContent = `${playerCats.size + prefilled.size}/${gridSize}`;
  document.getElementById('hearts').textContent = '❤️'.repeat(hearts) + '🖤'.repeat(3 - hearts);
  document.getElementById('levelTitle').textContent = `第 ${currentLevel} 關`;
  document.getElementById('statusCatIcon').innerHTML = getCatSVG(0, 22);
}

function onCellClick(r, c) {
  if (isAnimating) return;
  const key = `${r},${c}`;
  if (prefilled.has(key)) return;
  if (playerCats.has(key)) playerCats.delete(key);
  else if (marked.has(key)) { marked.delete(key); playerCats.add(key); playTone(660,0.08); }
  else { marked.add(key); playTone(400,0.06,'square'); }
  renderGrid();
  if (playerCats.size + prefilled.size === gridSize) setTimeout(()=>checkSolution(true), 300);
}

function checkSolution(auto = false) {
  if (isAnimating) return;
  const allCats = [...prefilled, ...playerCats].map(k => {
    const [r, c] = k.split(',').map(Number);
    return {r, c};
  });
  if (allCats.length !== gridSize) { if(!auto) alert('請先放完所有貓咪！'); return; }

  let error = false;
  const rows = new Set(), cols = new Set(), regs = new Set();
  for (const {r, c} of allCats) {
    if (rows.has(r) || cols.has(c)) error = true;
    rows.add(r); cols.add(c); regs.add(regions[r][c]);
  }
  if (regs.size !== gridSize) error = true;
  for (let i = 0; i < allCats.length; i++) {
    for (let j = i + 1; j < allCats.length; j++) {
      if (Math.abs(allCats[i].r - allCats[j].r) <= 1 && Math.abs(allCats[i].c - allCats[j].c) <= 1) error = true;
    }
  }

  if (error) {
    hearts--; renderGrid(); playAngry(); isAnimating = true;
    document.querySelectorAll('.cell.has-cat').forEach(el => el.classList.add('angry'));
    setTimeout(() => {
      document.querySelectorAll('.cell').forEach(el => el.classList.remove('angry'));
      isAnimating = false;
      if(hearts <= 0) { document.getElementById('overlay').classList.add('show'); document.getElementById('overlayTitle').textContent = '😿 失敗'; }
    }, 1200);
  } else {
    // 成功！觸發全身貓咪撲向螢幕動畫
    isAnimating = true;
    playHappy();
    spawnHappyCats();
    setTimeout(() => {
      document.getElementById('overlayTitle').textContent = '🎉 過關！';
      document.getElementById('overlay').classList.add('show');
    }, 2000); // 延遲顯示面板讓撲向動畫演完
  }
}

// 生成開心走路並撲向螢幕的全身貓咪
function spawnHappyCats() {
  const container = document.getElementById('celebration-container');
  container.innerHTML = '';
  const catCount = 8; // 生成 8 隻
  
  for(let i=0; i<catCount; i++) {
    const cat = document.createElement('div');
    cat.className = 'walking-cat';
    cat.innerHTML = getFullBodyCatSVG(Math.floor(Math.random() * 4));
    
    // 隨機初始位置
    const left = Math.random() * 80 + 10;
    const top = Math.random() * 80 + 10;
    cat.style.left = `${left}%`;
    cat.style.top = `${top}%`;
    
    // 隨機動畫延遲，產生層次感
    const delay = Math.random() * 0.8;
    
    container.appendChild(cat);
    
    // 一小段時間後加上 'pounce' 類別，使其放大撲向螢幕
    setTimeout(() => {
      cat.classList.add('pounce');
    }, 500 + (delay * 1000));
  }
}

document.getElementById('btnStart').onclick = () => { document.getElementById('startScreen').classList.add('hidden'); initAudio(); loadLevel(1); };
document.getElementById('btnCheck').onclick = () => checkSolution(false);
document.getElementById('btnClear').onclick = () => { if(!isAnimating){ playerCats.clear(); marked.clear(); renderGrid(); } };
document.getElementById('btnNext').onclick = () => loadLevel(currentLevel + (hearts>0?1:0));
</script>
