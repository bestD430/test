<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港交通及天氣 Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --warning-bg: #451a03;
      --warning-border: #78350f;
      --warning-text: #fbbf24;
      --kmb-red: #ef4444;
      --ctb-yellow: #eab308;
      --nlb-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .clock-container {
      text-align: left;
    }

    .time {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .date {
      font-size: 1rem;
      color: var(--text-sub);
    }

    /* 天氣警報 Banner */
    #warning-banner {
      background-color: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning-text);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }

    .btn-sm {
      background: var(--accent);
      color: var(--bg-color);
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .btn-sm:hover {
      opacity: 0.9;
    }

    /* 天氣樣式 */
    .weather-temp {
      font-size: 3rem;
      font-weight: bold;
      margin: 10px 0;
    }

    .weather-details {
      color: var(--text-sub);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 15px;
      text-align: center;
    }

    .forecast-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    /* 交通時間估算 */
    .route-item {
      margin-bottom: 15px;
    }

    .route-time {
      font-size: 1.8rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .map-container {
      width: 100%;
      height: 200px;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 12px;
      border: none;
    }

    /* 巴士 ETA 樣式 */
    .eta-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .eta-item:last-child {
      border-bottom: none;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85rem;
      margin-right: 8px;
      color: #fff;
    }

    .badge-kmb { background-color: var(--kmb-red); }
    .badge-ctb { background-color: var(--ctb-yellow); color: #000; }
    .badge-nlb { background-color: var(--nlb-green); }

    .eta-times {
      text-align: right;
    }

    .eta-main {
      font-size: 1.2rem;
      font-weight: bold;
      color: #4ade80;
    }

    .eta-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    /* Modal 設定視窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-color);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 6px;
    }

    .btn-group {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-cancel {
      background: #64748b;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .time { font-size: 1.8rem; }
      .dashboard-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="clock-container">
      <div id="clock-time" class="time">00:00:00</div>
      <div id="clock-date" class="date">----年--月--日 星期-</div>
    </div>
  </header>

  <!-- 天氣警報與公告 -->
  <div id="warning-banner"></div>

  <div class="dashboard-grid">
    <!-- 天氣卡片 -->
    <div class="card">
      <div class="card-title">
        <span>即時與預報天氣</span>
        <button class="btn-sm" onclick="openWeatherModal()">設定地區</button>
      </div>
      <div id="weather-district" style="font-weight: 600; color: var(--accent);">正在載入...</div>
      <div id="weather-temp" class="weather-temp">--°C</div>
      <div id="weather-details" class="weather-details">相對濕度: --%</div>
      
      <div style="margin-top: 15px; font-weight: 600; font-size: 0.9rem;">明日天氣預報</div>
      <div id="weather-forecast" class="forecast-grid">
        <!-- 預報資料動態插入 -->
      </div>
    </div>

    <!-- 車程估計卡片 -->
    <div class="card">
      <div class="card-title">
        <span>行車時間估計</span>
        <button class="btn-sm" onclick="openDriveModal()">設定路線</button>
      </div>
      <div class="route-item">
        <div id="drive-route-name" style="color: var(--text-sub); font-size: 0.9rem;">--</div>
        <div id="drive-time" class="route-time">計算中...</div>
        <div id="drive-distance" style="font-size: 0.85rem; color: var(--text-sub);">距離: -- km</div>
      </div>
      <iframe id="google-map" class="map-container" loading="lazy" src=""></iframe>
    </div>

    <!-- 巴士 ETA 卡片 -->
    <div class="card">
      <div class="card-title">
        <span>巴士到站時間 (ETA)</span>
        <button class="btn-sm" onclick="openBusModal()">新增/管理</button>
      </div>
      <div id="bus-eta-list">
        <!-- 動態渲染 ETA -->
        <div style="color: var(--text-sub);">載入中...</div>
      </div>
    </div>
  </div>

  <!-- 天氣設定 Modal -->
  <div id="weather-modal" class="modal">
    <div class="modal-content">
      <h3>設定天氣分區</h3>
      <div class="form-group" style="margin-top:15px;">
        <label for="district-select">選擇居住/工作地區：</label>
        <select id="district-select">
          <option value="King's Park">京士柏 / 尖沙咀</option>
          <option value="Hong Kong Observatory">香港天文台</option>
          <option value="Wong Chuk Hang">黃竹坑</option>
          <option value="Ta Kwu Ling">打鼓嶺</option>
          <option value="Lau Fau Shan">流浮山</option>
          <option value="Tai Po">大埔</option>
          <option value="Sha Tin">沙田</option>
          <option value="Tuen Mun">屯門</option>
          <option value="Tseung Kwan O">將軍澳</option>
          <option value="Tsuen Wan">荃灣</option>
          <option value="Tsing Yi">青衣</option>
          <option value="Wong Tai Sin">黃大仙</option>
          <option value="Kwun Tong">觀塘</option>
          <option value="Sham Shui Po">深水埗</option>
          <option value="HK Park">香港公園 / 中環</option>
          <option value="Shau Kei Wan">筲箕灣</option>
          <option value="Stanley">赤柱</option>
          <option value="Kwai Chung">葵湧</option>
          <option value="Chek Lap Kok">赤鱲角 / 東涌</option>
          <option value="Sai Kung">西貢</option>
        </select>
      </div>
      <div class="btn-group">
        <button class="btn-cancel" onclick="closeModal('weather-modal')">取消</button>
        <button class="btn-sm" onclick="saveWeatherConfig()">儲存</button>
      </div>
    </div>
  </div>

  <!-- 行車設定 Modal -->
  <div id="drive-modal" class="modal">
    <div class="modal-content">
      <h3>設定行車路線</h3>
      <div class="form-group" style="margin-top:15px;">
        <label>起點 (例如: 沙田大圍)</label>
        <input type="text" id="drive-origin-input" placeholder="輸入起點">
      </div>
      <div class="form-group">
        <label>終點 (例如: 中環國際金融中心)</label>
        <input type="text" id="drive-dest-input" placeholder="輸入終點">
      </div>
      <div class="btn-group">
        <button class="btn-cancel" onclick="closeModal('drive-modal')">取消</button>
        <button class="btn-sm" onclick="saveDriveConfig()">儲存並計算</button>
      </div>
    </div>
  </div>

  <!-- 巴士 ETA Modal -->
  <div id="bus-modal" class="modal">
    <div class="modal-content">
      <h3>新增巴士路線監控</h3>
      <div class="form-group" style="margin-top:15px;">
        <label>巴士公司</label>
        <select id="bus-company-select" onchange="onCompanyChange()">
          <option value="KMB">九巴 / 龍運 (KMB)</option>
          <option value="CTB">城巴 (CTB)</option>
          <option value="NLB">新大嶼山巴士 (NLB)</option>
        </select>
      </div>
      <div class="form-group">
        <label>路線號碼 (例如: 238X, 102, 37M)</label>
        <input type="text" id="bus-route-input" placeholder="輸入路線" onblur="loadStopOptions()">
      </div>
      <div class="form-group">
        <label>方向 / 目的地</label>
        <select id="bus-dir-select" onchange="loadStopOptions()">
          <option value="outbound">去程 (Outbound)</option>
          <option value="inbound">回程 (Inbound)</option>
        </select>
      </div>
      <div class="form-group">
        <label>選擇車站</label>
        <select id="bus-stop-select">
          <option value="">-- 請先輸入路線 --</option>
        </select>
      </div>
      <div class="form-group">
        <label>預計步行至車站時間 (分鐘)</label>
        <input type="number" id="bus-walk-time" value="5" min="0">
      </div>
      
      <div style="margin-top: 20px; border-top: 1px solid var(--card-border); padding-top: 10px;">
        <h4>已儲存路線</h4>
        <div id="saved-bus-list" style="margin-top: 10px; font-size: 0.85rem;"></div>
      </div>

      <div class="btn-group">
        <button class="btn-cancel" onclick="closeModal('bus-modal')">關閉</button>
        <button class="btn-sm" onclick="addBusConfig()">新增路線</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. 時鐘功能 ---
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('clock-time').textContent = `${hours}:${minutes}:${seconds}`;
      
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      
      document.getElementById('clock-date').textContent = `${year}年${month}月${date}日 ${days[now.getDay()]}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- 2. 天氣與政府警告 ---
    let selectedDistrict = localStorage.getItem('weather_district') || "King's Park";

    async function fetchWeather() {
      try {
        // 即時天氣
        const resRHRREAD = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const dataRHR = await resRHRREAD.json();
        
        // 氣溫比對
        let temp = '--';
        if (dataRHR.temperature && dataRHR.temperature.data) {
          const districtData = dataRHR.temperature.data.find(d => d.place === selectedDistrict) || dataRHR.temperature.data[0];
          temp = districtData.value;
          document.getElementById('weather-district').textContent = districtData.place;
        }

        let humidity = dataRHR.humidity && dataRHR.humidity.data ? dataRHR.humidity.data[0].value : '--';
        document.getElementById('weather-temp').textContent = `${temp}°C`;
        document.getElementById('weather-details').textContent = `相對濕度: ${humidity}%`;

        // 警告訊息 Banner
        const warningBanner = document.getElementById('warning-banner');
        let warningsText = [];
        if (dataRHR.warningMessage && dataRHR.warningMessage.length > 0) {
          warningsText = warningsText.concat(dataRHR.warningMessage);
        }

        // 讀取教育局 / 政府特別通告 (RSS fallback 捕獲)
        try {
          const rssRes = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.news.gov.hk%2Ftc%2Fcommon%2Fhtml%2Ftopstories.rss');
          const rssData = await rssRes.json();
          if (rssData.items) {
            const schoolNotice = rssData.items.find(item => item.title.includes('停課') || item.title.includes('熱帶氣旋') || item.title.includes('暴雨'));
            if (schoolNotice) {
              warningsText.push(`特別特別消息: ${schoolNotice.title}`);
            }
          }
        } catch (e) {
          console.warn("RSS parsing skipped or failed.");
        }

        if (warningsText.length > 0) {
          warningBanner.style.display = 'block';
          warningBanner.innerHTML = `<strong>特別天氣 / 政府公告：</strong><br>` + warningsText.join('<br>');
        } else {
          warningBanner.style.display = 'none';
        }

        // 九天天氣預報
        const resNDF = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        const dataNDF = await resNDF.json();
        
        const forecastContainer = document.getElementById('weather-forecast');
        forecastContainer.innerHTML = '';
        
        if (dataNDF.weatherForecast) {
          // 顯示未來3天預報
          dataNDF.weatherForecast.slice(0, 3).forEach(f => {
            const dayStr = f.forecastDate.substring(4, 6) + '/' + f.forecastDate.substring(6, 8);
            const item = document.createElement('div');
            item.className = 'forecast-item';
            item.innerHTML = `
              <div>${dayStr} (${f.week})</div>
              <div style="font-weight:bold; margin: 4px 0;">${f.forecastMintemp.value}-${f.forecastMaxtemp.value}°C</div>
              <div style="font-size: 0.75rem; color: var(--text-sub);">${f.forecastWeather}</div>
            `;
            forecastContainer.appendChild(item);
          });
        }
      } catch (err) {
        console.error("Fetch weather error:", err);
      }
    }

    function openWeatherModal() {
      document.getElementById('district-select').value = selectedDistrict;
      document.getElementById('weather-modal').style.display = 'flex';
    }

    function saveWeatherConfig() {
      selectedDistrict = document.getElementById('district-select').value;
      localStorage.setItem('weather_district', selectedDistrict);
      closeModal('weather-modal');
      fetchWeather();
    }

    // --- 3. 路線估計與 OpenStreetMap/OSRM ---
    let driveOrigin = localStorage.getItem('drive_origin') || "Sha Tin, Hong Kong";
    let driveDest = localStorage.getItem('drive_dest') || "Central, Hong Kong";

    async function calculateDriveTime() {
      document.getElementById('drive-route-name').textContent = `${driveOrigin} ➔ ${driveDest}`;
      
      // 更新 Google Maps Embed
      const mapIframe = document.getElementById('google-map');
      mapIframe.src = `https://www.google.com/maps/embed/v1/directions?key=YOUR_API_KEY_HERE&origin=${encodeURIComponent(driveOrigin)}&destination=${encodeURIComponent(driveDest)}&mode=driving`;
      
      // 使用 OpenStreetMap Nominatim 進行地理編碼 (加入 User-Agent 避免 403)
      try {
        const headers = { 'User-Agent': 'HongKongTransportDashboard/1.0' };
        
        const geoO = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(driveOrigin)}`, { headers });
        const dataO = await geoO.json();
        
        const geoD = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(driveDest)}`, { headers });
        const dataD = await geoD.json();

        if (dataO.length > 0 && dataD.length > 0) {
          const start = [dataO[0].lon, dataO[0].lat];
          const end = [dataD[0].lon, dataD[0].lat];
          
          // 使用 OSRM 路由服務
          const osrmRes = await fetch(`https://router.project-osrm.org/route/v1/driving/${start[0]},${start[1]};${end[0]},${end[1]}?overview=false`);
          const osrmData = await osrmRes.json();

          if (osrmData.routes && osrmData.routes.length > 0) {
            const durationSec = osrmData.routes[0].duration;
            const distanceMeters = osrmData.routes[0].distance;

            const minutes = Math.round(durationSec / 60);
            const km = (distanceMeters / 1000).toFixed(1);

            document.getElementById('drive-time').textContent = `約 ${minutes} 分鐘`;
            document.getElementById('drive-distance').textContent = `估計距離: ${km} km`;
          }
        } else {
          document.getElementById('drive-time').textContent = "無法計算路線";
        }
      } catch (err) {
        console.error("OSRM error:", err);
        document.getElementById('drive-time').textContent = "估算暫時不可用";
      }
    }

    function openDriveModal() {
      document.getElementById('drive-origin-input').value = driveOrigin;
      document.getElementById('drive-dest-input').value = driveDest;
      document.getElementById('drive-modal').style.display = 'flex';
    }

    function saveDriveConfig() {
      driveOrigin = document.getElementById('drive-origin-input').value;
      driveDest = document.getElementById('drive-dest-input').value;
      localStorage.setItem('drive_origin', driveOrigin);
      localStorage.setItem('drive_dest', driveDest);
      closeModal('drive-modal');
      calculateDriveTime();
    }

    // --- 4. 巴士到站時間 (ETA) 開放數據整合 ---
    let savedBuses = JSON.parse(localStorage.getItem('saved_buses')) || [
      { company: 'KMB', route: '238X', dir: 'outbound', stopId: 'B5A24B9E90123456', stopName: '海濱花園', walkTime: 5 }
    ];

    async function fetchBusETA() {
      const container = document.getElementById('bus-eta-list');
      if (savedBuses.length === 0) {
        container.innerHTML = `<div style="color:var(--text-sub);">尚未新增監控路線。</div>`;
        return;
      }

      container.innerHTML = '';

      for (let index = 0; index < savedBuses.length; index++) {
        const bus = savedBuses[index];
        let etaList = [];

        try {
          if (bus.company === 'KMB') {
            // 九巴 API 呼叫 (修正方向轉換: outbound -> O, inbound -> I)
            const dirParam = bus.dir === 'outbound' ? 'O' : 'I';
            const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${bus.stopId}/${bus.route}/1`);
            const data = await res.json();
            if (data.data) {
              etaList = data.data
                .filter(item => (item.dir === dirParam || item.dir === bus.dir.charAt(0).toUpperCase()))
                .map(item => item.eta);
            }
          } else if (bus.company === 'CTB') {
            // 城巴 API 呼叫
            const res = await fetch(`https://data.etabus.gov.hk/v1/transport/citybus-nwfb/eta/CTB/${bus.stopId}/${bus.route}`);
            const data = await res.json();
            if (data.data) {
              const dirParam = bus.dir === 'outbound' ? 'O' : 'I';
              etaList = data.data.filter(item => item.dir === dirParam).map(item => item.eta);
            }
          } else if (bus.company === 'NLB') {
            // 嶼巴 API 呼叫
            const res = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&routeId=${bus.route}&stopId=${bus.stopId}`);
            const data = await res.json();
            if (data.estimatedArrivals) {
              etaList = data.estimatedArrivals.map(item => item.estimatedArrivalDateTime);
            }
          }
        } catch (e) {
          console.error("ETA Fetch error:", e);
        }

        // 計算剩餘時間
        const now = new Date();
        let displayEtas = [];

        etaList.forEach(etaStr => {
          if (!etaStr) return;
          const etaTime = new Date(etaStr);
          const diffMins = Math.floor((etaTime - now) / 60000);
          if (diffMins >= 0) {
            displayEtas.push(diffMins);
          }
        });

        // HTML 渲染
        const badgeClass = bus.company === 'KMB' ? 'badge-kmb' : (bus.company === 'CTB' ? 'badge-ctb' : 'badge-nlb');
        
        let primaryText = "未有班次";
        let secondaryText = "";

        if (displayEtas.length > 0) {
          const firstEta = displayEtas[0];
          const walkTime = parseInt(bus.walkTime) || 0;
          
          if (firstEta <= 0) {
            primaryText = "即將到站";
          } else {
            primaryText = `${firstEta} 分鐘`;
          }

          if (firstEta < walkTime) {
            secondaryText = `<span style="color:#ef4444;">(不夠時間前往)</span>`;
          } else {
            secondaryText = `建議 ${firstEta - walkTime} 分鐘內出門`;
          }

          if (displayEtas.length > 1) {
            secondaryText += ` | 下班: ${displayEtas[1]}分`;
          }
        }

        const itemEl = document.createElement('div');
        itemEl.className = 'eta-item';
        itemEl.innerHTML = `
          <div>
            <div style="display:flex; align-items:center;">
              <span class="badge ${badgeClass}">${bus.company}</span>
              <strong style="font-size:1.1rem; margin-right:8px;">${bus.route}</strong>
            </div>
            <div style="font-size:0.85rem; color:var(--text-sub); margin-top:4px;">${bus.stopName} (步航: ${bus.walkTime}分)</div>
          </div>
          <div class="eta-times">
            <div class="eta-main">${primaryText}</div>
            <div class="eta-sub">${secondaryText}</div>
          </div>
        `;
        container.appendChild(itemEl);
      }
    }

    // 動態載入巴士車站選項 (以九巴 API 為例示範)
    async function loadStopOptions() {
      const company = document.getElementById('bus-company-select').value;
      const route = document.getElementById('bus-route-input').value.trim().toUpperCase();
      const dir = document.getElementById('bus-dir-select').value;
      const select = document.getElementById('bus-stop-select');

      if (!route) return;
      select.innerHTML = '<option>載入中...</option>';

      try {
        if (company === 'KMB') {
          const dirParam = dir === 'outbound' ? 'outbound' : 'inbound';
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${dirParam}/1`);
          const data = await res.json();
          
          select.innerHTML = '';
          if (data.data && data.data.length > 0) {
            for (let item of data.data) {
              const stopRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${item.stop}`);
              const stopData = await stopRes.json();
              const opt = document.createElement('option');
              opt.value = item.stop;
              opt.textContent = stopData.data ? stopData.data.name_tc : item.stop;
              select.appendChild(opt);
            }
          } else {
            select.innerHTML = '<option value="">未有找到相符車站</option>';
          }
        } else {
          select.innerHTML = '<option value="DEMO_STOP">預設範例車站 (請輸入 Stop ID)</option>';
        }
      } catch (e) {
        select.innerHTML = '<option value="">載入失敗</option>';
      }
    }

    function onCompanyChange() {
      loadStopOptions();
    }

    function openBusModal() {
      renderSavedBusList();
      document.getElementById('bus-modal').style.display = 'flex';
    }

    function renderSavedBusList() {
      const listEl = document.getElementById('saved-bus-list');
      listEl.innerHTML = '';
      savedBuses.forEach((bus, index) => {
        const div = document.createElement('div');
        div.style.cssText = "display:flex; justify-between; align-items:center; margin-bottom: 5px; background: rgba(0,0,0,0.2); padding: 6px; border-radius: 4px;";
        div.innerHTML = `
          <span>[${bus.company}] ${bus.route} - ${bus.stopName}</span>
          <button style="background:#ef4444; color:white; border:none; padding:2px 6px; border-radius:4px; cursor:pointer;" onclick="removeBusConfig(${index})">刪除</button>
        `;
        listEl.appendChild(div);
      });
    }

    function addBusConfig() {
      const company = document.getElementById('bus-company-select').value;
      const route = document.getElementById('bus-route-input').value.trim().toUpperCase();
      const dir = document.getElementById('bus-dir-select').value;
      const stopSelect = document.getElementById('bus-stop-select');
      const stopId = stopSelect.value;
      const stopName = stopSelect.options[stopSelect.selectedIndex] ? stopSelect.options[stopSelect.selectedIndex].text : '指定車站';
      const walkTime = document.getElementById('bus-walk-time').value;

      if (!route || !stopId) {
        alert("請輸入完整路線與車站！");
        return;
      }

      savedBuses.push({ company, route, dir, stopId, stopName, walkTime });
      localStorage.setItem('saved_buses', JSON.stringify(savedBuses));
      renderSavedBusList();
      fetchBusETA();
    }

    function removeBusConfig(index) {
      savedBuses.splice(index, 1);
      localStorage.setItem('saved_buses', JSON.stringify(savedBuses));
      renderSavedBusList();
      fetchBusETA();
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    // --- 5. 初始化與自動刷新 ---
    function init() {
      fetchWeather();
      calculateDriveTime();
      fetchBusETA();

      // 定時更新
      setInterval(fetchWeather, 300000); // 5 分鐘
      setInterval(fetchBusETA, 30000);    // 30 秒
      setInterval(calculateDriveTime, 600000); // 10 分鐘
    }

    window.onload = init;
  </script>
</body>
</html>
